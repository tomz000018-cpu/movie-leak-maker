<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>やめよう映画盗撮 | 盗撮流出風動画メーカー</title>
<style>
:root{--pink:#f50082;--ink:#151b29;--muted:#697386;--line:#e8eaf1;--bg:#fafafd}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN',sans-serif}
main{max-width:620px;margin:auto;padding:20px 13px 56px}
header{text-align:center;padding:12px 0 18px}
h1{font-size:clamp(27px,7.4vw,43px);font-weight:950;letter-spacing:-.07em;margin:5px 0 8px;white-space:normal}h1 em{font-style:normal;color:var(--pink)}
.sub{font-size:clamp(12px,3.5vw,16px);font-weight:650;color:#5b6676}.ver{font-size:11px;color:#9298a5;margin-top:8px}
.card{background:white;border:1px solid #edf0f4;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 20px #14193209}
.videoShell{background:#141519;border-radius:12px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#a7acb6;font-weight:700;font-size:13px}
.videoShell video{width:100%;height:100%;object-fit:contain;background:#090a0c}#sourceVideo{display:none}#sourceVideo.loaded{display:block}#videoPlaceholder{text-align:center;padding:20px}
.file-label,.make,.save{display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:14px;background:var(--pink);color:white;text-decoration:none;text-align:center;font-size:18px;font-weight:850;min-height:63px;width:100%;cursor:pointer}
.file-label{margin-top:0;position:relative}.file-label input{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;clip-path:inset(50%);pointer-events:none}.file-label svg,.make svg{width:23px;height:23px}
.file-note,.hint,.name{font-size:12px;color:var(--muted);line-height:1.65}.file-note{text-align:center;margin:9px 0 0}.name{text-align:center;margin-top:9px;overflow-wrap:anywhere}

h2{font-size:18px;margin:0 0 8px;font-weight:850}.hint{margin:0 0 10px}.setting{margin:13px 0 11px;padding-top:12px;border-top:1px solid var(--line)}
.settingHeader{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:800}#crowdText{color:var(--pink);font-size:13px;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--pink);touch-action:pan-y}.sliderLabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}#preview{display:none}
.clock{text-align:center;font-weight:900;font-size:21px;font-variant-numeric:tabular-nums;margin:8px 0 5px}.seek{display:flex;align-items:center;gap:10px}.seek input{min-width:0;flex:1}
.smallbtn{border:1px solid var(--line);background:white;border-radius:11px;color:var(--ink);font-size:13px;font-weight:700;padding:12px 8px;white-space:nowrap}
.choices{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:7px;margin:8px 0 12px}.choice{grid-column:span 2;position:relative;min-width:0}.choice.wide{grid-column:span 3}
.choice input{position:absolute;opacity:0;width:1px;height:1px}.choice span{display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);border-radius:999px;min-height:44px;padding:7px 3px;font-weight:800;font-size:clamp(11px,3.4vw,14px);white-space:nowrap;cursor:pointer}.choice input:checked+span{color:white;background:var(--pink);border-color:var(--pink)}
.listHeader{display:flex;align-items:center;justify-content:space-between;gap:8px}.listHeader h2{font-size:17px;margin:0}
.add{display:block;width:100%;min-height:57px;border:3px double #fff;outline:2px solid #bd0068;outline-offset:0;background:#b60067;color:white;border-radius:13px;padding:11px 7px;font-size:16px;font-weight:900;box-shadow:0 3px 9px #94005222;cursor:pointer;white-space:normal}.add:disabled,.make:disabled{opacity:.45}
.pointSection{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.pointSection h2{font-size:17px;margin:0}.listHeader{margin-top:12px;border-top:1px solid var(--line);padding-top:12px}.listHeader #count{white-space:nowrap;font-size:11px}.videoShell{margin-top:3px}#preview{margin-top:4px}#addNotice{color:#e10077;min-height:16px;font-size:12px;margin-top:6px}#count{font-size:12px;color:var(--muted);margin:4px 0 10px}
.markerRow{display:flex;align-items:center;gap:12px;margin-top:7px;border:1px solid var(--line);border-radius:11px;padding:10px 9px;background:#fcfcff}.markerRow:before{content:'⋮';font-size:18px;color:#b7bcc7}
.jump{background:transparent;border:0;color:var(--ink);font-size:15px;font-weight:850;padding:6px 0}.type{flex:1;font-size:14px;font-weight:700}.delete{border:0;background:#f5f5f8;color:#707887;border-radius:8px;padding:9px;font-size:12px}.empty{color:var(--muted);font-size:13px;padding:14px 0}
.make{margin:16px 0;border-radius:999px;box-shadow:0 5px 13px #f500822e;font-size:clamp(16px,4.7vw,20px)}#progress,#result{display:none}.barbg{height:11px;background:#f0f0f3;border-radius:9px;overflow:hidden;margin-top:10px}.bar{height:100%;background:var(--pink);width:0%}.progressText{font-size:12px;color:var(--muted);text-align:center;margin:8px}.status{background:#f6f7fa;border-radius:10px;padding:12px;font-size:12px;line-height:1.6;color:#5f6978;white-space:pre-wrap}
#outVideo{width:100%;border-radius:11px;background:black;margin:10px 0;max-height:55vh}.save{background:white;color:var(--pink);border:2px solid var(--pink);margin:9px 0}.notice{text-align:center;font-size:11px;color:#969cab;line-height:1.8;margin-top:14px}#work{display:none}
@media(max-width:370px){.choice span{font-size:10px;gap:3px}.card{padding:12px}.smallbtn{font-size:11px}}
</style>
</head>
<body>
<main>
<header><h1>やめよう<em>映画盗撮</em></h1><div class="sub">どんな動画も映画盗撮流出風に変換します</div><div class="ver">Version 33 | 動画選択統一・録画自動再試行版</div></header>
<section class="card" id="editingArea">
<label class="file-label" for="videoInput">⇧ 動画を選ぶ</label>
<input id="videoInput" type="file" accept="video/*" aria-label="動画ファイルを選択">
<div class="file-note">MP4 / MOV / WebM などに対応</div>

<div class="name" id="fileName">動画が選択されていません</div>
<div class="setting"><div class="settingHeader"><span>全体の盛り上がり</span><span id="crowdText">レベル4：大歓声</span></div><input id="crowdLevel" type="range" min="1" max="5" value="4"><div class="sliderLabels"><span>控えめ</span><span>激しめ</span></div></div>
<div class="videoShell"><div id="videoPlaceholder">ここに選択した動画が表示されます</div><video id="sourceVideo" controls playsinline preload="metadata"></video></div>
<div id="preview"><div class="clock" id="clock">0:00 / 0:00</div><div class="seek"><button class="smallbtn" id="minus" type="button">−1秒</button><input type="range" id="seek" min="0" max="1000" value="0"><button class="smallbtn" id="plus" type="button">＋1秒</button></div></div>
<div class="pointSection">
<h2>盛り上がりポイント</h2>
<div class="choices">
<label class="choice"><input type="radio" name="strength" value="1"><span>👏 拍手</span></label>
<label class="choice"><input type="radio" name="strength" value="2"><span>☺ 笑い声</span></label>
<label class="choice"><input type="radio" name="strength" value="3"><span>✴ Oh my God!</span></label>
<label class="choice wide"><input type="radio" name="strength" value="4" checked><span>📣 声援</span></label>
<label class="choice wide"><input type="radio" name="strength" value="5"><span>🔥 大声援</span></label>
</div>
<button class="add" id="add" type="button">＋ 盛り上がりポイントを追加する</button>
<div id="addNotice"></div>
<div class="listHeader"><h2>追加したポイント一覧</h2><div id="count">登録ポイント：0 / 15</div></div>
<div id="markerList"></div>
</div>
</section>
<button id="make" class="make">✦ 盗撮流出風動画を作る</button>
<div class="card"><div id="progress"><div class="barbg"><div class="bar" id="bar"></div></div><div class="progressText" id="progressText">準備中</div></div><div id="status" class="status">動画を選んでください。</div></div>
<section id="result" class="card"><h2>完成動画</h2><video id="outVideo" playsinline controls></video><a id="save" class="save">↓ 完成動画を保存</a></section>
<canvas id="work"></canvas><p class="notice">加工は端末内で行います。実際の映画盗撮は法律で禁止されています。<br>音声素材の権利確認が済むまでは個人テスト用としてご利用ください。</p>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id),video=$('sourceVideo'),work=$('work'),ctx=work.getContext('2d',{alpha:false});
const names=['','控えめ','普通','大きめ','大歓声','超大歓声'];
const types={1:'拍手',2:'笑い声',3:'Oh my God!',4:'声援',5:'大声援'};
const sounds=['applause_01.mp3','applause_02.mp3','applause_03.mp3','applause_04.mp3','cheer_large_01.mp3','cheer_medium_01.mp3','cheer_medium_02.mp3','cheer_short_01.mp3','cheer_short_02.mp3','laugh_01.mp3','laugh_02.mp3','laugh_03.mp3','laugh_04.mp3','laugh_05.mp3','voice_01.mp3','voice_02.mp3','voice_03.mp3','voice_04.mp3'];
let file=null,fileURL=null,resultURL=null,selection=0,markers=[],seq=0,working=false;
let ac=null,movieSource=null,dest=null,analyser=null,movieGain=null,manualGain=null,crowdBus=null,voiceBus=null,finalGain=null,active=[],cachedSounds=null;
const duration=()=>Number.isFinite(video.duration)?video.duration:0;
const delay=ms=>new Promise(r=>setTimeout(r,ms));
const formatTime=t=>`${Math.floor(Math.max(0,t)/60)}:${String(Math.floor(Math.max(0,t))%60).padStart(2,'0')}`;
function updateClock(){let d=duration();$('clock').textContent=formatTime(video.currentTime||0)+' / '+formatTime(d);if(d)$('seek').value=Math.round(video.currentTime/d*1000)}
$('crowdLevel').oninput=e=>$('crowdText').textContent=`レベル${e.target.value}：${names[+e.target.value]}`;
function selectVideo(f){
 if(!f)return;
 if(working){$('status').textContent='加工中は動画を変更できません。完了後に選び直してください。';return}
 const id=++selection,old=fileURL;
 video.pause();file=f;fileURL=URL.createObjectURL(f);
 $('fileName').textContent='選択した動画：'+f.name;
 $('status').textContent='動画を読み込み中：'+f.name;
 $('videoPlaceholder').style.display='none';video.classList.add('loaded');$('preview').style.display='block';$('result').style.display='none';$('progress').style.display='none';
 markers=[];seq=0;renderMarkers();$('addNotice').textContent='';
 video.onerror=()=>{if(id===selection&&!working)$('status').textContent='動画の読み込みに失敗しました。ほかの動画、または「ファイル」から選び直してください。'};
 video.src=fileURL;video.load();
 if(old)setTimeout(()=>URL.revokeObjectURL(old),1500);
}
for(const id of ['videoInput']){
 const picker=$(id);
 picker.addEventListener('change',()=>{const f=picker.files&&picker.files[0];if(f)selectVideo(f);picker.value=''});
}
video.addEventListener('loadedmetadata',()=>{updateClock();if(!working&&file)$('status').textContent='読み込み完了：'+formatTime(duration())+'。ポイントを設定できます。'});
video.addEventListener('timeupdate',updateClock);
$('seek').oninput=e=>{if(working||!duration())return;video.pause();video.currentTime=duration()*e.target.value/1000;updateClock()};
function move(s){if(working||!duration())return;video.pause();video.currentTime=Math.min(duration(),Math.max(0,video.currentTime+s));updateClock()}
$('minus').onclick=()=>move(-1);$('plus').onclick=()=>move(1);
$('add').onclick=()=>{if(working||markers.length>=15||!duration())return;video.pause();let level=+document.querySelector('input[name=strength]:checked').value;markers.push({id:++seq,t:video.currentTime,level});renderMarkers();$('addNotice').textContent='追加しました：'+formatTime(video.currentTime)+' '+types[level]};
function renderMarkers(){
 markers.sort((a,b)=>a.t-b.t);$('count').textContent=`登録ポイント：${markers.length} / 15`;$('add').disabled=working||markers.length>=15;
 const root=$('markerList');root.replaceChildren();
 if(!markers.length){let empty=document.createElement('div');empty.className='empty';empty.textContent='まだポイントはありません。';root.append(empty)}
 for(const m of markers){const row=document.createElement('div');row.className='markerRow';const jump=document.createElement('button');jump.className='jump';jump.textContent=formatTime(m.t);jump.onclick=()=>{if(!working){video.pause();video.currentTime=m.t;updateClock()}};const type=document.createElement('span');type.className='type';type.textContent=types[m.level];const del=document.createElement('button');del.className='delete';del.textContent='削除';del.onclick=()=>{if(!working){markers=markers.filter(x=>x.id!==m.id);renderMarkers()}};row.append(jump,type,del);root.append(row)}
}
function impulse(seconds,decay){let n=Math.floor(ac.sampleRate*seconds),b=ac.createBuffer(2,n,ac.sampleRate);for(let c=0;c<2;c++){let d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,decay)}return b}
async function audioSetup(){
 if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();
 await ac.resume();if(movieSource)return;
 movieSource=ac.createMediaElementSource(video);dest=ac.createMediaStreamDestination();analyser=ac.createAnalyser();analyser.fftSize=1024;
 const low=ac.createBiquadFilter(),dry=ac.createGain(),wet=ac.createGain(),echo=ac.createDelay(),reverb=ac.createConvolver();
 low.type='lowpass';low.frequency.value=4600;dry.gain.value=.86;wet.gain.value=.4;echo.delayTime.value=.075;reverb.buffer=impulse(1.9,2.4);
 movieGain=ac.createGain();manualGain=ac.createGain();movieSource.connect(analyser);analyser.connect(low);low.connect(dry);low.connect(echo);echo.connect(reverb);reverb.connect(wet);dry.connect(movieGain);wet.connect(movieGain);movieGain.connect(manualGain);
 crowdBus=ac.createGain();const crowdFilter=ac.createBiquadFilter(),crowdDry=ac.createGain(),crowdRev=ac.createConvolver(),crowdWet=ac.createGain();crowdFilter.type='lowpass';crowdFilter.frequency.value=5200;crowdRev.buffer=impulse(1.45,2.5);crowdDry.gain.value=.85;crowdWet.gain.value=.2;crowdBus.connect(crowdFilter);crowdFilter.connect(crowdDry);crowdFilter.connect(crowdRev);crowdRev.connect(crowdWet);
 const mix=ac.createGain(),compress=ac.createDynamicsCompressor();compress.threshold.value=-7;compress.knee.value=9;compress.ratio.value=6;compress.attack.value=.004;compress.release.value=.24;
 manualGain.connect(mix);crowdDry.connect(mix);crowdWet.connect(mix);
 voiceBus=ac.createGain();const vh=ac.createBiquadFilter(),vl=ac.createBiquadFilter(),vd=ac.createGain(),vr=ac.createConvolver(),vw=ac.createGain();vh.type='highpass';vh.frequency.value=260;vl.type='lowpass';vl.frequency.value=2900;vd.gain.value=.72;vr.buffer=impulse(1.65,2);vw.gain.value=.43;voiceBus.connect(vh);vh.connect(vl);vl.connect(vd);vl.connect(vr);vr.connect(vw);vd.connect(mix);vw.connect(mix);
 finalGain=ac.createGain();mix.connect(compress);compress.connect(finalGain);finalGain.connect(dest);finalGain.connect(ac.destination);
}
function mono(b){if(b.numberOfChannels===1)return b;let m=ac.createBuffer(1,b.length,b.sampleRate),target=m.getChannelData(0);for(let c=0;c<b.numberOfChannels;c++){let src=b.getChannelData(c);for(let i=0;i<src.length;i++)target[i]+=src[i]/b.numberOfChannels}return m}
async function loadSounds(){
 if(cachedSounds)return cachedSounds;
 const lib={cheer:[],applause:[],voices:[],laugh:[]};
 for(let i=0;i<sounds.length;i++){
  const name=sounds[i];$('status').textContent=`観客音声を読み込み中：${i+1} / ${sounds.length}`;
  const r=await fetch('./'+name+'?v=31');if(!r.ok)throw Error('音声が見つかりません：'+name);
  let b;try{b=mono(await ac.decodeAudioData(await r.arrayBuffer()))}catch(e){throw Error('読み込めない音声：'+name)}
  if(name.startsWith('voice_'))lib.voices.push(b);else if(name.startsWith('laugh_'))lib.laugh.push(b);else if(name.startsWith('applause_'))lib.applause.push(b);else lib.cheer.push(b);
 }
 cachedSounds=lib;return lib;
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function stopSounds(){
 for(const item of active.splice(0)){try{item.src.onended=null;item.src.stop()}catch(e){}try{item.src.disconnect();item.g.disconnect()}catch(e){}}
 if(ac){for(const g of [movieGain,manualGain,crowdBus,finalGain])if(g){try{g.gain.cancelScheduledValues(ac.currentTime);g.gain.setValueAtTime(1,ac.currentTime)}catch(e){}}}
}
function clip(b,start,length,volume,fi=.4,fo=2.4,target=crowdBus){
 if(!b)return;let len=Math.min(length,b.duration);if(len<.12)return;
 start=Math.max(ac.currentTime+.01,start);
 let src=ac.createBufferSource(),g=ac.createGain(),a=Math.min(fi,len*.23),z=Math.min(fo,len*.38);src.buffer=b;
 g.gain.setValueAtTime(.0001,start);g.gain.linearRampToValueAtTime(Math.max(.0001,volume),start+a);g.gain.setValueAtTime(Math.max(.0001,volume),start+Math.max(a,len-z));g.gain.linearRampToValueAtTime(.0001,start+len);
 src.connect(g);g.connect(target);let item={src,g};active.push(item);
 src.onended=()=>{let i=active.indexOf(item);if(i>=0)active.splice(i,1);try{src.disconnect();g.disconnect()}catch(e){}};
 try{src.start(start,0,len);src.stop(start+len+.03)}catch(e){src.onended()}
}
function randomClip(a,start,len,vol,fi=.4,fo=2.4,target=crowdBus){if(a.length)clip(pick(a),start,len,vol,fi,fo,target)}
function manualReaction(lib,t,kind,level){const s=[0,.35,.55,.75,1,1.25][level];
 if(kind===1){randomClip(lib.applause,t,8,1.1*s,.2,2);randomClip(lib.applause,t+1.1,7,.72*s,.3,2)}
 else if(kind===2){randomClip(lib.laugh,t,7,.92*s,.12,1);randomClip(lib.laugh,t+1.1,6,.63*s,.2,1)}
 else if(kind===3){randomClip(lib.cheer,t,5,.45*s,.2,2);randomClip(lib.voices,t+.22,4,1.48*s,.09,.5,voiceBus);randomClip(lib.voices,t+1.85,4,1.12*s,.12,.6,voiceBus)}
 else {let big=kind===5;for(let i=0;i<(big?4:2);i++)randomClip(lib.cheer,t+i*(big?.43:.75),big?8:5.5,(big?1.35:.95)*s*(1-i*.17),.2,3);if(big)randomClip(lib.applause,t+.5,8,.56*s,.2,3.5)}
}
function scheduleSounds(lib,start,d,level){
 stopSounds();const bank=[...lib.cheer,...lib.applause],base=[0,.07,.1,.14,.18,.24][level],scale=[0,.35,.55,.75,1,1.25][level];
 for(let t=0;t<d;t+=1.1){let b=pick(bank);clip(b,start+t,Math.min(5.7,d-t),base*(.55+Math.random()*.4),1,2)}
 randomClip(lib.cheer,start,Math.min(12,Math.max(4,d*.16)),.9*scale,.12,4);
 randomClip(lib.applause,start+.15,Math.min(11,Math.max(4,d*.16)),1.1*scale,.15,4);
 movieGain.gain.setValueAtTime(level>=4?.68:.8,start);movieGain.gain.linearRampToValueAtTime(1,start+Math.min(d*.16,12));
 let span=Math.min(30,d*.35),from=Math.max(0,d-span);
 for(let t=from;t<d;t+=2.1){let p=(t-from)/Math.max(1,span);randomClip(lib.cheer,start+t,8,(.6+p*1.15)*scale,.4,3.5)}
 for(let t=Math.max(from,d-12);t<d;t+=2.5)randomClip(lib.applause,start+t,9,1.3*scale,.35,4);
 randomClip(lib.applause,start+Math.max(0,d-4),10,1.65*scale,.25,3.5);
 movieGain.gain.setValueAtTime(1,start+from);movieGain.gain.linearRampToValueAtTime(.62,start+Math.max(from+.1,d-3));movieGain.gain.setValueAtTime(.58,start+d);
 for(const m of markers){manualReaction(lib,start+m.t,m.level,level)}
 const points=markers.map(m=>({b:m.t,e:Math.min(d,m.t+(m.level===5?8:5)),v:m.level===5?.52:m.level===4?.78:.86}));
 points.sort((a,b)=>a.b-b.b);let merged=[];
 for(const p of points){let prev=merged[merged.length-1];if(prev&&p.b<=prev.e+.2){prev.e=Math.max(prev.e,p.e);prev.v=Math.min(prev.v,p.v)}else merged.push({...p})}
 for(const p of merged){let b=start+p.b,e=start+p.e,fi=Math.min(.2,(e-b)*.2),fo=Math.min(1,(e-b)*.3);manualGain.gain.setValueAtTime(1,b);manualGain.gain.linearRampToValueAtTime(p.v,b+fi);manualGain.gain.setValueAtTime(p.v,Math.max(b+fi,e-fo));manualGain.gain.linearRampToValueAtTime(1,e)}
}
function renderFrame(t){
 const w=work.width,h=work.height;ctx.fillStyle='#030406';ctx.fillRect(0,0,w,h);
 const vr=video.videoWidth/video.videoHeight,tr=w/h;let sx=0,sy=0,sw=video.videoWidth,sh=video.videoHeight;
 if(vr>tr){sw=video.videoHeight*tr;sx=(video.videoWidth-sw)/2}else{sh=video.videoWidth/tr;sy=(video.videoHeight-sh)/2}
 const jitterX=Math.sin(t*8.3)*2.5+Math.sin(t*16.9)+Math.sin(t*.39)*6.5,jitterY=Math.cos(t*7.1)*2+Math.sin(t*13.5)+Math.cos(t*.28)*4.2;
 ctx.save();ctx.translate(w/2+jitterX,h/2+jitterY);ctx.rotate(-.048+Math.sin(t*.63)*.006);ctx.transform(1,-.022,.115,1,0,0);
