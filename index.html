<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Movie Leak Maker V13</title>

<style>

*{box-sizing:border-box}

body{

 margin:0;background:#080808;color:#fff;

 font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif

}

.container{width:min(92%,800px);margin:auto;padding:35px 0 80px}

h1{text-align:center;margin:0 0 8px}

.subtitle,.version{text-align:center;color:#aaa;line-height:1.6}

.version{margin:8px 0 25px;font-size:13px}

.panel{

 background:#161616;border:1px solid #333;

 border-radius:18px;padding:20px

}

.file-label,.process-button,.save-button{

 display:block;width:100%;padding:16px;border:0;

 border-radius:12px;font-size:16px;font-weight:bold;text-align:center

}

.file-label{background:#fff;color:#111}

.file-label.secondary{background:#343434;color:#fff;margin-top:20px}

.file-input{display:none}

.filename,.help{

 margin-top:10px;color:#aaa;font-size:13px;

 line-height:1.6;word-break:break-word

}

.filename{text-align:center}

.preview-area,.result-area{display:none;margin-top:22px}

.screen{padding:8px;border-radius:10px;background:#000}

video{display:block;width:100%;max-height:65vh}

#workCanvas{display:none}

.process-button{margin-top:20px;background:#f2f2f2;color:#111}

.process-button:disabled{background:#444;color:#aaa}

.save-button{

 margin-top:16px;color:#111;background:#fff;text-decoration:none

}

.status,.setting{

 background:#252525;padding:14px;border-radius:11px;

 margin-top:20px;line-height:1.6

}

.status{font-size:13px}

.setting label{font-weight:bold}

input[type=range]{

 width:100%;margin:16px 0 4px;accent-color:#fff

}

.progress-wrap{display:none;margin-top:18px}

.progress-track{

 height:12px;border-radius:12px;background:#333;overflow:hidden

}

.progress-bar{height:100%;width:0;background:white}

.progress-text{

 text-align:center;color:#aaa;margin-top:8px;font-size:13px

}

.notice{

 text-align:center;color:#777;font-size:12px;

 margin-top:24px;line-height:1.6

}

</style>

</head>

<body>

<div class="container">

<h1>Movie Leak Maker</h1>

<div class="subtitle">

普通の動画を「海外試写会の流出映像風」に加工します

</div>

<div class="version">

Version 13 — ざわめき・自然な余韻・音量反応

</div>

<div class="panel">

<label for="videoInput" class="file-label">

① 動画を選ぶ

</label>

<input id="videoInput" class="file-input" type="file" accept="video/*">

<div class="filename" id="fileName">

まだ動画は選択されていません

</div>

<label for="audioInput" class="file-label secondary">

② 観客音をまとめて選ぶ（7本）

</label>

<input

 id="audioInput"

 class="file-input"

 type="file"

 accept="audio/*,.mp3,.m4a,.wav,.ogg"

 multiple

>

<div class="filename" id="audioNames">

まだ観客音は選択されていません

</div>

<div class="help">

ZIPを展開し、MP3を7本まとめて選択してください。

</div>

<div class="setting">

<label for="crowdLevel">

③ 観客の盛り上がり

</label>

<input id="crowdLevel" type="range" min="1" max="5" value="4">

<div id="crowdValue">

レベル4：大歓声

</div>

</div>

<div id="previewArea" class="preview-area">

<div class="screen">

<video

 id="sourceVideo"

 playsinline

 controls

 preload="metadata"

></video>

</div>

<button id="processButton" class="process-button">

④ 観客音入り動画を作る

</button>

<div class="progress-wrap" id="progressWrap">

<div class="progress-track">

<div class="progress-bar" id="progressBar"></div>

</div>

<div class="progress-text" id="progressText">

準備中

</div>

</div>

<div id="status" class="status">

動画と観客音を選んでください。

</div>

</div>

<div id="resultArea" class="result-area">

<h2>完成動画</h2>

<div class="screen">

<video id="resultVideo" controls playsinline></video>

</div>

<a id="saveButton" class="save-button">

完成動画を保存

</a>

</div>

</div>

<canvas id="workCanvas"></canvas>

<div class="notice">

素材は端末内で処理します。音声素材の権利確認が済むまでは

個人用テストとしてお使いください。

</div>

</div>

<script>

"use strict";

const $ = id => document.getElementById(id);

const videoInput = $("videoInput");

const audioInput = $("audioInput");

const sourceVideo = $("sourceVideo");

const resultVideo = $("resultVideo");

const previewArea = $("previewArea");

const resultArea = $("resultArea");

const processButton = $("processButton");

const saveButton = $("saveButton");

const statusBox = $("status");

const progressWrap = $("progressWrap");

const progressBar = $("progressBar");

const progressText = $("progressText");

const crowdLevel = $("crowdLevel");

const crowdValue = $("crowdValue");

const canvas = $("workCanvas");

const ctx = canvas.getContext("2d", {alpha:false});

function layer(){

 const canvas = document.createElement("canvas");

 return {

  canvas,

  ctx:canvas.getContext("2d")

 };

}

const scene = layer();

const screen = layer();

const blurred = layer();

const bloom = layer();

const color = layer();

let selectedVideo = null;

let audioFiles = [];

let videoURL = null;

let resultURL = null;

let ac = null;

let sourceNode = null;

let destination = null;

let movieMaster = null;

let audienceInput = null;

let analyser = null;

let playingSources = [];

let processing = false;

let frameId = 0;

let holdTimer = null;

let recorder = null;

let videoStream = null;

const names = [

 "",

 "控えめ",

 "普通",

 "大きめ",

 "大歓声",

 "超大歓声"

];

crowdLevel.oninput = () => {

 crowdValue.textContent =

  `レベル${crowdLevel.value}：${names[+crowdLevel.value]}`;

};

videoInput.onchange = e => {

 if(processing) return;

 selectedVideo = e.target.files?.[0];

 if(!selectedVideo) return;

 if(videoURL) URL.revokeObjectURL(videoURL);

 videoURL = URL.createObjectURL(selectedVideo);

 sourceVideo.src = videoURL;

 sourceVideo.load();

 $("fileName").textContent = selectedVideo.name;

 previewArea.style.display = "block";

 resultArea.style.display = "none";

 statusBox.textContent = "動画を読み込みました。";

};

audioInput.onchange = e => {

 if(processing) return;

 audioFiles = [...(e.target.files || [])].filter(

  f => /\.(mp3|m4a|wav|ogg|aac)$/i.test(f.name)

   || f.type.startsWith("audio/")

 );

 $("audioNames").textContent = audioFiles.length

  ? `${audioFiles.length}本選択：${audioFiles.map(f=>f.name).join("、")}`

  : "まだ観客音は選択されていません";

};

function impulse(seconds,decay){

 const n = Math.floor(ac.sampleRate * seconds);

 const b = ac.createBuffer(2,n,ac.sampleRate);

 for(let c=0;c<2;c++){

  const d = b.getChannelData(c);

  for(let i=0;i<n;i++){

   d[i] = (Math.random()*2-1) * Math.pow(1-i/n,decay);

  }

 }

 return b;

}

async function audioSetup(){

 if(!ac){

  ac = new (window.AudioContext || window.webkitAudioContext)();

 }

 await ac.resume();

 if(sourceNode) return;

 sourceNode = ac.createMediaElementSource(sourceVideo);

 destination = ac.createMediaStreamDestination();

 const low = ac.createBiquadFilter();

 low.type = "lowpass";

 low.frequency.value = 3900;

 analyser = ac.createAnalyser();

 analyser.fftSize = 1024;

 analyser.smoothingTimeConstant = .28;

 movieMaster = ac.createGain();

 const dry = ac.createGain();

 const wet = ac.createGain();

 const delay = ac.createDelay();

 const rev = ac.createConvolver();

 dry.gain.value = .54;

 wet.gain.value = .43;

 delay.delayTime.value = .075;

 rev.buffer = impulse(2,2.2);

 sourceNode.connect(analyser);

 analyser.connect(low);

 low.connect(dry);

 low.connect(delay);

 delay.connect(rev);

 rev.connect(wet);

 dry.connect(movieMaster);

 wet.connect(movieMaster);

 audienceInput = ac.createGain();

 const af = ac.createBiquadFilter();

 const ar = ac.createConvolver();

 const ad = ac.createGain();

 const aw = ac.createGain();

 af.type = "lowpass";

 af.frequency.value = 5600;

 ar.buffer = impulse(1.5,2.5);

 ad.gain.value = 1;

 aw.gain.value = .22;

 audienceInput.connect(af);

 af.connect(ad);

 af.connect(ar);

 ar.connect(aw);

 const mix = ac.createGain();

 const compress = ac.createDynamicsCompressor();

 compress.threshold.value = -8;

 compress.knee.value = 8;

 compress.ratio.value = 8;

 compress.attack.value = .004;

 compress.release.value = .23;

 movieMaster.connect(mix);

 ad.connect(mix);

 aw.connect(mix);

 mix.connect(compress);

 compress.connect(destination);

 compress.connect(ac.destination);

}

async function loadSounds(){

 const lib = {

  cheer:[],

  applause:[],

  other:[]

 };

 const failed = [];

 for(const f of audioFiles){

  try{

   let b = await ac.decodeAudioData(await f.arrayBuffer());

   // 左右の偏りを減らすためモノラル化する

   if(b.numberOfChannels > 1){

    const m = ac.createBuffer(1,b.length,b.sampleRate);

    const dest = m.getChannelData(0);

    for(let c=0;c<b.numberOfChannels;c++){

     const src = b.getChannelData(c);

     for(let i=0;i<dest.length;i++){

      dest[i] += src[i] / b.numberOfChannels;

     }

    }

    b = m;

   }

   const kind = /applause|clap/i.test(f.name)

    ? "applause"

    : /cheer|crowd|whoa|wow/i.test(f.name)

     ? "cheer"

     : "other";

   lib[kind].push(b);

  }catch(e){

   failed.push(f.name);

  }

 }

 if(!Object.values(lib).some(a=>a.length)){

  throw Error("MP3を読み込めませんでした。");

 }

 return {lib,failed};

}

function stopSounds(){

 for(const s of playingSources){

  try{s.stop()}catch(e){}

 }

 playingSources = [];

}

function pick(a){

 return a[Math.floor(Math.random()*a.length)];

}

function clip(

 buffer,

 start,

 len,

 volume,

 fadeIn=.6,

 fadeOut=2.5,

 offset=0

){

 if(!buffer || len<.1) return;

 const actual = Math.min(len,buffer.duration-offset);

 if(actual<.1) return;

 const src = ac.createBufferSource();

 const g = ac.createGain();

 src.buffer = buffer;

 const i = Math.min(fadeIn,actual*.35);

 const o = Math.min(fadeOut,actual*.47);

 g.gain.setValueAtTime(.0001,start);

 g.gain.linearRampToValueAtTime(volume,start+i);

 g.gain.setValueAtTime(

  volume,

  start+Math.max(i,actual-o)

 );

 g.gain.linearRampToValueAtTime(.0001,start+actual);

 src.connect(g);

 g.connect(audienceInput);

 src.start(start,offset,actual);

 src.stop(start+actual+.02);

 playingSources.push(src);

}

function randomClip(

 buffers,

 start,

 len,

 volume,

 fadeIn=.6,

 fadeOut=2.5

){

 if(!buffers.length) return;

 const b = pick(buffers);

 clip(b,start,len,volume,fadeIn,fadeOut);

}

// 常時鳴っている客席音を重ねる

function ambience(lib,start,total,level){

 const bank = [

  ...lib.cheer,

  ...lib.other,

  ...lib.applause

 ];

 if(!bank.length) return;

 const step = 1.1;

 const clipLength = 5.7;

 const base = [0,.08,.13,.20,.27,.34][level];

 for(let t=0;t<total;t+=step){

  const b = pick(bank);

  const length = Math.min(

   clipLength,

   total-t,

   b.duration

  );

  const when = start+t;

  const finalFade = t+length>=total-.1

   ? Math.min(4,length*.6)

   : Math.min(2.1,length*.42);

  clip(

   b,

   when,

   length,

   base*(.55+Math.random()*.4),

   Math.min(1.1,length*.25),

   finalFade

  );

 }

}

// 観客が叫ぶ間は映画側の音を下げる

function duck(start,duration,level){

 if(!movieMaster) return;

 const g = movieMaster.gain;

 const begin = Math.max(ac.currentTime+.01,start);

 const end = begin+duration;

 const target = level>=5

  ? .10

  : level>=4

   ? .20

   : .40;

 g.cancelScheduledValues(begin);

 g.setValueAtTime(g.value,begin);

 g.linearRampToValueAtTime(target,begin+.18);

 g.setValueAtTime(

  target,

  Math.max(begin+.18,end-.75)

 );

 g.linearRampToValueAtTime(1,end);

}

// 歓声と拍手を重ねる

function reaction(time,lib,level,big=false){

 const c = lib.cheer.length

  ? lib.cheer

  : lib.other;

 const a = lib.applause.length

  ? lib.applause

  : lib.other;

 const multiplier = [0,.45,.7,1,1.5,1.95][level];

 randomClip(

  c,

  time,

  big?7:5,

  (big?1.30:.90)*multiplier,

  .2,

  big?4.0:3.0

 );

 if(big || Math.random()<.40){

  randomClip(

   a,

   time+.7,

   big?7:4,

   (big?.92:.4)*multiplier,

   .25,

   big?4.0:2.7

  );

 }

 duck(time,big?6:3.5,level);

}

// 終盤の大歓声と拍手

function finale(lib,start,duration,level){

 const time = start+Math.max(0,duration-8);

 reaction(time,lib,level,true);

 reaction(time+2.5,lib,level,true);

 const a = lib.applause.length

  ? lib.applause

  : lib.other;

 randomClip(

  a,

  time+1,

  11,

  1.15*[0,.45,.7,1,1.5,1.95][level],

  .35,

  4.8

 );

}

function cover(target,video,w,h,extra=1){

 const vr = video.videoWidth/video.videoHeight;

 const tr = w/h;

 let sx=0,sy=0;

 let sw=video.videoWidth;

 let sh=video.videoHeight;

 if(vr>tr){

  sw=video.videoHeight*tr;

  sx=(video.videoWidth-sw)/2;

 }else{

  sh=video.videoWidth/tr;

  sy=(video.videoHeight-sh)/2;

 }

 const dw=w*extra;

 const dh=h*extra;

 target.drawImage(

  video,sx,sy,sw,sh,

  (w-dw)/2,(h-dh)/2,dw,dh

 );

}

function renderScreen(t){

 const w=screen.canvas.width;

 const h=screen.canvas.height;

 const s=screen.ctx;

 const b=blurred.ctx;

 const g=bloom.ctx;

 const c=color.ctx;

 s.clearRect(0,0,w,h);

 b.clearRect(0,0,w,h);

 g.clearRect(0,0,w,h);

 c.clearRect(0,0,w,h);

 const fa=(Math.sin(t*.38)+1)/2;

 const fb=(Math.sin(t*.14+2.1)+1)/2;

 const blur=15+fa*9+fb*5;

 const brightness=108+Math.sin(t*.62)*8+Math.sin(t*3.7)*3;

 b.save();

 b.filter=

  `brightness(${brightness}%) contrast(79%) saturate(64%) blur(${blur}px)`;

 cover(b,sourceVideo,w,h,1.06);

 b.restore();

 const haze=b.createLinearGradient(0,0,w,h);

 haze.addColorStop(0,"rgba(210,220,230,.10)");

 haze.addColorStop(.45,"rgba(235,235,225,.16)");

 haze.addColorStop(1,"rgba(180,200,215,.08)");

 b.fillStyle=haze;

 b.fillRect(0,0,w,h);

 g.save();

 g.filter="brightness(190%) blur(32px)";

 cover(g,sourceVideo,w,h,1.08);

 g.restore();

 g.save();

 g.globalAlpha=.55;

 g.filter="brightness(260%) blur(62px)";

 cover(g,sourceVideo,w,h,1.10);

 g.restore();

 s.drawImage(blurred.canvas,0,0);

 s.save();

 s.globalCompositeOperation="screen";

 s.globalAlpha=.44;

 s.drawImage(bloom.canvas,0,0);

 s.restore();

 c.save();

 c.globalAlpha=.11;

 c.filter="sepia(100%) saturate(500%) hue-rotate(-35deg)";

 c.drawImage(blurred.canvas,4,1);

 c.restore();

 c.save();

 c.globalCompositeOperation="screen";

 c.globalAlpha=.08;

 c.filter="sepia(100%) saturate(500%) hue-rotate(170deg)";

 c.drawImage(blurred.canvas,-4,-1);

 c.restore();

 s.save();

 s.globalCompositeOperation="screen";

 s.drawImage(color.canvas,0,0);

 s.restore();

 s.fillStyle="rgba(215,220,215,.095)";

 s.fillRect(0,0,w,h);

 s.save();

 s.globalCompositeOperation="destination-in";

 s.filter="blur(38px)";

 s.fillStyle="white";

 s.fillRect(46,40,w-92,h-80);

 s.restore();

}

function buildScene(t){

 const w=scene.canvas.width;

 const h=scene.canvas.height;

 const s=scene.ctx;

 s.clearRect(0,0,w,h);

 s.fillStyle="rgb(5,6,7)";

 s.fillRect(0,0,w,h);

 renderScreen(t);

 const glow=s.createRadialGradient(

  w*.52,h*.47,w*.10,

  w*.52,h*.50,w*.95

 );

 glow.addColorStop(0,"rgba(135,150,165,.16)");

 glow.addColorStop(.38,"rgba(85,95,105,.075)");

 glow.addColorStop(.72,"rgba(35,40,45,.035)");

 glow.addColorStop(1,"rgba(0,0,0,0)");

 s.fillStyle=glow;

 s.fillRect(0,0,w,h);

 s.save();

 s.translate(w*.51,h*.48);

 s.rotate(-.048);

 s.transform(1,-.022,.115,1,0,0);

 const sw=w*1.46;

 const sh=h*1.18;

 s.save();

 s.globalAlpha=.26;

 s.filter="blur(65px) brightness(175%)";

 s.drawImage(screen.canvas,-sw/2,-sh/2,sw,sh);

 s.restore();

 s.save();

 s.filter="blur(7px)";

 s.drawImage(screen.canvas,-sw/2,-sh/2,sw,sh);

 s.restore();

 s.restore();

 const lens=s.createLinearGradient(0,0,w,h);

 lens.addColorStop(0,"rgba(160,175,190,.055)");

 lens.addColorStop(.5,"rgba(220,220,205,.075)");

 lens.addColorStop(1,"rgba(120,140,160,.035)");

 s.fillStyle=lens;

 s.fillRect(0,0,w,h);

 const vignette=s.createRadialGradient(

  w*.52,h*.47,w*.27,

  w*.52,h*.50,w*.87

 );

 vignette.addColorStop(0,"rgba(0,0,0,0)");

 vignette.addColorStop(.68,"rgba(0,0,0,.10)");

 vignette.addColorStop(1,"rgba(0,0,0,.76)");

 s.fillStyle=vignette;

 s.fillRect(0,0,w,h);

}

function drawCamera(t){

 const w=canvas.width;

 const h=canvas.height;

 const mx=Math.sin(t*8.3)*2.5+Math.sin(t*16.9);

 const my=Math.cos(t*7.1)*2+Math.sin(t*13.5)*.9;

 const dx=Math.sin(t*.39)*6.5;

 const dy=Math.cos(t*.28)*4.2;

 const angle=

  Math.sin(t*.63)*.0062+

  Math.sin(t*2.8)*.0018;

 const zoom=1.055+Math.sin(t*.24)*.008;

 ctx.fillStyle="#000";

 ctx.fillRect(0,0,w,h);

 ctx.save();

 ctx.translate(w/2+mx+dx,h/2+my+dy);

 ctx.rotate(angle);

 ctx.scale(zoom,zoom);

 ctx.drawImage(scene.canvas,-w/2,-h/2,w,h);

 ctx.restore();

}

function mime(){

 const list=[

  'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',

  'video/mp4',

  'video/webm;codecs=vp9,opus',

  'video/webm;codecs=vp8,opus',

  'video/webm'

 ];

 return list.find(x=>MediaRecorder.isTypeSupported(x))||"";

}

function reset(){

 processing=false;

 processButton.disabled=false;

 videoInput.disabled=false;

 audioInput.disabled=false;

 sourceVideo.controls=true;

}

processButton.onclick=async()=>{

 if(processing)return;

 if(!selectedVideo||!audioFiles.length){

  statusBox.textContent="動画と観客音の両方を選んでください。";

  return;

 }

 processing=true;

 processButton.disabled=true;

 videoInput.disabled=true;

 audioInput.disabled=true;

 sourceVideo.controls=false;

 resultArea.style.display="none";

 progressWrap.style.display="block";

 progressBar.style.width="0%";

 statusBox.textContent="観客音を読み込み中…";

 let localRecorder=null;

 let stream=null;

 let failed=false;

 let stopped=false;

 const endRecording=()=>{

  if(stopped)return;

  stopped=true;

  if(localRecorder?.state!=="inactive"){

   localRecorder.stop();

  }

 };

 try{

  if(!window.MediaRecorder||!canvas.captureStream){

   throw Error("動画録画に対応していないブラウザです。");

  }

  await audioSetup();

  const loaded=await loadSounds();

  const lib=loaded.lib;

  const bad=loaded.failed;

  sourceVideo.pause();

  sourceVideo.currentTime=0;

  if(sourceVideo.seeking){

   await new Promise(r=>{

    sourceVideo.addEventListener("seeked",r,{once:true});

   });

  }

  const duration=sourceVideo.duration;

  if(!Number.isFinite(duration)||duration<=0){

   throw Error("動画の長さを取得できません。");

  }

  const portrait=

   sourceVideo.videoHeight>sourceVideo.videoWidth;

  canvas.width=portrait?540:960;

  canvas.height=portrait?960:540;

  for(const l of [scene,screen,blurred,bloom,color]){

   l.canvas.width=canvas.width;

   l.canvas.height=canvas.height;

  }

  buildScene(0);

  drawCamera(0);

  stream=canvas.captureStream(30);

  const finalStream=new MediaStream([

   ...stream.getVideoTracks(),

   ...destination.stream.getAudioTracks()

  ]);

  const type=mime();

  const chunks=[];

  localRecorder=new MediaRecorder(

   finalStream,

   type

    ? {mimeType:type,videoBitsPerSecond:4500000}

    : {videoBitsPerSecond:4500000}

  );

  recorder=localRecorder;

  localRecorder.ondataavailable=e=>{

   if(e.data?.size){

    chunks.push(e.data);

   }

  };

  localRecorder.onerror=e=>{

   failed=true;

   statusBox.textContent=

    "録画エラー："+(e.error?.message||"不明");

  };

  localRecorder.onstop=()=>{

   cancelAnimationFrame(frameId);

   if(holdTimer){

    clearTimeout(holdTimer);

   }

   stopSounds();

   stream?.getTracks().forEach(t=>t.stop());

   reset();

   if(failed||!chunks.length){

    if(!failed){

     statusBox.textContent="録画データがありません。";

    }

    return;

   }

   const actual=localRecorder.mimeType||type||"video/mp4";

   const blob=new Blob(chunks,{type:actual});

   if(resultURL){

    URL.revokeObjectURL(resultURL);

   }

   resultURL=URL.createObjectURL(blob);

   resultVideo.src=resultURL;

   saveButton.href=resultURL;

   saveButton.download=actual.includes("mp4")

    ? "movie-leak-v13.mp4"

    : "movie-leak-v13.webm";

   resultArea.style.display="block";

   progressBar.style.width="100%";

   progressText.textContent="完成";

   statusBox.textContent=

    "観客の余韻付き動画が完成しました。";

  };

  const level=+crowdLevel.value;

  const tail=5;

  const startNow=ac.currentTime+.2;

  stopSounds();

  movieMaster.gain.cancelScheduledValues(ac.currentTime);

  movieMaster.gain.setValueAtTime(1,ac.currentTime);

  // 常に観客のざわめきを鳴らす

  ambience(lib,startNow,duration+tail,level);

  // 終盤の歓声

  finale(lib,startNow,duration,level);

  const data=new Uint8Array(analyser.fftSize);

  let smoothed=.03;

  let wasQuiet=0;

  let lastEvent=-30;

  let prevTime=0;

  function frame(){

   if(!processing||sourceVideo.ended||sourceVideo.paused){

    return;

   }

   const t=sourceVideo.currentTime;

   buildScene(t);

   drawCamera(t);

   const pct=Math.min(100,Math.round(t/duration*100));

   progressBar.style.width=pct+"%";

   progressText.textContent="加工中 "+pct+"%";

   // 映画の音量が一度下がってから

   // 急に大きくなった場面を調べる

   if(t-prevTime>.09&&t<duration-9){

    analyser.getByteTimeDomainData(data);

    let sum=0;

    for(let i=0;i<data.length;i++){

     const v=(data[i]-128)/128;

     sum+=v*v;

    }

    const rms=Math.sqrt(sum/data.length);

    smoothed=smoothed*.83+rms*.17;

    if(smoothed<.036){

     wasQuiet=Math.min(

      3,

      wasQuiet+(t-prevTime)

     );

    }

    if(

     rms>Math.max(.085,smoothed*2.0)&&

     wasQuiet>.27&&

     t-lastEvent>6

    ){

     reaction(ac.currentTime+.06,lib,level,rms>.16);

     lastEvent=t;

     wasQuiet=0;

    }else if(rms>.055){

     wasQuiet=0;

    }

    prevTime=t;

   }

   frameId=requestAnimationFrame(frame);

  }

  localRecorder.start(500);

  await sourceVideo.play();

  sourceVideo.onended=()=>{

   cancelAnimationFrame(frameId);

   statusBox.textContent=

    "最後の歓声の余韻を録音中（約5秒）…";

   progressText.textContent="余韻を録音中";

   holdTimer=setTimeout(endRecording,5000);

  };

  statusBox.textContent=bad.length

   ? "一部読めなかった音声："+bad.join("、")

   : "客席のざわめきと歓声を合成しています。";

  frameId=requestAnimationFrame(frame);

 }catch(e){

  console.error(e);

  statusBox.textContent=

   "エラー："+(e.message||String(e));

  cancelAnimationFrame(frameId);

  if(holdTimer){

   clearTimeout(holdTimer);

  }

  sourceVideo.pause();

  stopSounds();

  if(localRecorder?.state!=="inactive"){

   try{

    localRecorder.stop();

   }catch(_){}

  }

  stream?.getTracks().forEach(t=>t.stop());

  reset();

 }

};
