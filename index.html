<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Leak Maker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

.container {
  width: min(92%, 800px);
  margin: auto;
  padding: 35px 0 80px;
}

h1 {
  text-align: center;
  margin: 0 0 8px;
  font-size: 30px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  line-height: 1.6;
  margin-bottom: 30px;
}

.panel {
  background: #161616;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 20px;
}

.file-label,
.process-button,
.save-button {
  display: block;
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
}

.file-label {
  background: white;
  color: #111;
}

#videoInput {
  display: none;
}

#fileName {
  margin-top: 14px;
  text-align: center;
  color: #aaa;
  word-break: break-all;
}

.preview-area,
.result-area {
  display: none;
  margin-top: 24px;
}

.screen {
  background: black;
  padding: 8px;
  border-radius: 10px;
  overflow: hidden;
}

video {
  display: block;
  width: 100%;
  max-height: 65vh;
  background: black;
}

#workCanvas {
  display: none;
}

.process-button {
  margin-top: 20px;
  background: #f2f2f2;
  color: #111;
}

.process-button:disabled {
  background: #444;
  color: #999;
}

.save-button {
  margin-top: 16px;
  background: white;
  color: #111;
  text-decoration: none;
}

.status {
  margin-top: 18px;
  padding: 14px;
  border-radius: 10px;
  background: #101010;
  color: #ccc;
  line-height: 1.6;
  font-size: 14px;
}

.progress-wrap {
  display: none;
  margin-top: 18px;
}

.progress-bg {
  height: 12px;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: white;
}

.progress-text {
  margin-top: 8px;
  color: #aaa;
  text-align: center;
  font-size: 13px;
}

.notice {
  margin-top: 25px;
  text-align: center;
  color: #777;
  font-size: 12px;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>Movie Leak Maker</h1>

<div class="subtitle">
普通の動画を<br>
「海外試写会の流出映像風」に加工します
</div>

<div class="panel">

<label class="file-label" for="videoInput">
動画を選ぶ
</label>

<input
  id="videoInput"
  type="file"
  accept="video/*"
>

<div id="fileName">
まだ動画は選択されていません
</div>

<div
  class="preview-area"
  id="previewArea"
>

<div class="screen">

<video
  id="sourceVideo"
  controls
  playsinline
></video>

</div>

<button
  id="processButton"
  class="process-button"
>
流出映像風に加工する
</button>

<div
  class="progress-wrap"
  id="progressWrap"
>

<div class="progress-bg">

<div
  class="progress-bar"
  id="progressBar"
></div>

</div>

<div
  class="progress-text"
  id="progressText"
>
準備中
</div>

</div>

<div
  class="status"
  id="status"
>
動画を選んでください。
</div>

</div>


<div
  class="result-area"
  id="resultArea"
>

<h2>完成動画</h2>

<div class="screen">

<video
  id="resultVideo"
  controls
  playsinline
></video>

</div>

<a
  id="saveButton"
  class="save-button"
>
完成動画を保存
</a>

</div>

</div>

<canvas id="workCanvas"></canvas>

<div class="notice">
動画はサーバーへ送信せず、
この端末の中で加工します。
</div>

</div>


<script>

const videoInput =
  document.getElementById("videoInput");

const sourceVideo =
  document.getElementById("sourceVideo");

const resultVideo =
  document.getElementById("resultVideo");

const previewArea =
  document.getElementById("previewArea");

const resultArea =
  document.getElementById("resultArea");

const processButton =
  document.getElementById("processButton");

const saveButton =
  document.getElementById("saveButton");

const fileName =
  document.getElementById("fileName");

const status =
  document.getElementById("status");

const progressWrap =
  document.getElementById("progressWrap");

const progressBar =
  document.getElementById("progressBar");

const progressText =
  document.getElementById("progressText");

const canvas =
  document.getElementById("workCanvas");

const ctx =
  canvas.getContext("2d");


const sceneCanvas =
  document.createElement("canvas");

const sceneCtx =
  sceneCanvas.getContext("2d");


const videoCanvas =
  document.createElement("canvas");

const videoCtx =
  videoCanvas.getContext("2d");


const glowCanvas =
  document.createElement("canvas");

const glowCtx =
  glowCanvas.getContext("2d");


let selectedFile = null;

let inputURL = null;

let outputURL = null;

let audioContext = null;

let audioSource = null;

let audioDestination = null;



videoInput.addEventListener(
  "change",
  function(event) {

    selectedFile =
      event.target.files[0];

    if (!selectedFile) {
      return;
    }

    if (inputURL) {
      URL.revokeObjectURL(inputURL);
    }

    inputURL =
      URL.createObjectURL(
        selectedFile
      );

    sourceVideo.src =
      inputURL;

    sourceVideo.load();

    fileName.textContent =
      selectedFile.name;

    previewArea.style.display =
      "block";

    resultArea.style.display =
      "none";

    status.textContent =
      "動画を読み込みました。";
  }
);



function chooseMimeType() {

  const types = [

    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',

    'video/mp4',

    'video/webm;codecs=vp9,opus',

    'video/webm;codecs=vp8,opus',

    'video/webm'
  ];


  for (const type of types) {

    if (
      MediaRecorder.isTypeSupported(type)
    ) {

      return type;
    }
  }

  return "";
}



function makeImpulse(
  context,
  seconds,
  decay
) {

  const rate =
    context.sampleRate;

  const length =
    rate * seconds;

  const impulse =
    context.createBuffer(
      2,
      length,
      rate
    );


  for (
    let channel = 0;
    channel < 2;
    channel++
  ) {

    const data =
      impulse.getChannelData(
        channel
      );


    for (
      let i = 0;
      i < length;
      i++
    ) {

      data[i] =
        (
          Math.random() * 2 - 1
        )
        *
        Math.pow(
          1 - i / length,
          decay
        );
    }
  }


  return impulse;
}



async function prepareAudio() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }


  await audioContext.resume();


  if (!audioSource) {

    audioSource =
      audioContext.createMediaElementSource(
        sourceVideo
      );


    audioDestination =
      audioContext.createMediaStreamDestination();


    const dry =
      audioContext.createGain();

    dry.gain.value =
      0.65;


    const wet =
      audioContext.createGain();

    wet.gain.value =
      0.28;


    const convolver =
      audioContext.createConvolver();


    convolver.buffer =
      makeImpulse(
        audioContext,
        1.35,
        2.8
      );


    const delay =
      audioContext.createDelay();


    delay.delayTime.value =
      0.045;


    const highCut =
      audioContext.createBiquadFilter();


    highCut.type =
      "lowpass";


    highCut.frequency.value =
      4700;


    audioSource.connect(
      highCut
    );


    highCut.connect(
      dry
    );


    dry.connect(
      audioDestination
    );


    highCut.connect(
      delay
    );


    delay.connect(
      convolver
    );


    convolver.connect(
      wet
    );


    wet.connect(
      audioDestination
    );


    dry.connect(
      audioContext.destination
    );


    wet.connect(
      audioContext.destination
    );
  }
}



function lerp(
  a,
  b,
  t
) {

  return a +
    (b - a) * t;
}



function getScreenPoints(
  w,
  h
) {

  /*
  スクリーンそのものは
  ここでは動かさない。

  最後に映画館全体を
  カメラ手ブレとして動かす。
  */

  return {

    TL: {
      x: w * 0.025,
      y: h * 0.09
    },

    TR: {
      x: w * 0.995,
      y: h * 0.005
    },

    BL: {
      x: w * 0.055,
      y: h * 0.88
    },

    BR: {
      x: w * 1.01,
      y: h * 0.79
    }

  };
}



function drawCinemaBackground(
  targetCtx,
  w,
  h
) {

  targetCtx.fillStyle =
    "#000000";


  targetCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /*
  スクリーンから映画館へ
  漏れている弱い光
  */

  const glow =
    targetCtx.createRadialGradient(

      w * 0.52,
      h * 0.47,
      w * 0.16,

      w * 0.52,
      h * 0.52,
      w * 0.78
    );


  glow.addColorStop(
    0,
    "rgba(115,125,135,0.11)"
  );


  glow.addColorStop(
    0.50,
    "rgba(45,50,55,0.055)"
  );


  glow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  targetCtx.fillStyle =
    glow;


  targetCtx.fillRect(
    0,
    0,
    w,
    h
  );
}



function prepareVideoImage(
  source,
  time,
  w,
  h
) {

  /*
  前回の320pxへの縮小は廃止。
  今回はかなり解像度を残す。
  */

  const renderWidth =
    Math.min(
      760,
      source.videoWidth
    );


  const renderHeight =
    Math.max(
      2,
      Math.round(
        renderWidth *
        source.videoHeight /
        source.videoWidth
      )
    );


  videoCanvas.width =
    renderWidth;

  videoCanvas.height =
    renderHeight;


  /*
  ピントがゆっくり前後する。
  単なる低解像度ではなく
  光学的に外れたようなボケ。
  */

  const focusWave =
    (
      Math.sin(
        time * 0.52
      ) + 1
    ) / 2;


  const focusWave2 =
    (
      Math.sin(
        time * 0.19 + 1.7
      ) + 1
    ) / 2;


  const blurAmount =
    2.8 +
    focusWave * 2.4 +
    focusWave2 * 1.0;


  /*
  自動露出が少し迷う
  */

  const brightness =
    82 +
    Math.sin(
      time * 4.2
    ) * 3 +
    Math.sin(
      time * 0.9
    ) * 2;


  videoCtx.clearRect(
    0,
    0,
    renderWidth,
    renderHeight
  );


  videoCtx.filter =
    "brightness(" +
    brightness +
    "%) " +

    "contrast(84%) " +

    "saturate(64%) " +

    "blur(" +
    blurAmount +
    "px)";


  videoCtx.drawImage(
    source,
    0,
    0,
    renderWidth,
    renderHeight
  );


  /*
  スクリーンの空気・霞
  */

  videoCtx.fillStyle =
    "rgba(210,220,225,0.035)";


  videoCtx.fillRect(
    0,
    0,
    renderWidth,
    renderHeight
  );


  /*
  Bloom（ブルーム）
  明るい部分を少し拡散
  */

  glowCanvas.width =
    renderWidth;

  glowCanvas.height =
    renderHeight;


  glowCtx.clearRect(
    0,
    0,
    renderWidth,
    renderHeight
  );


  glowCtx.globalAlpha =
    0.55;


  glowCtx.filter =
    "brightness(145%) blur(9px)";


  glowCtx.drawImage(
    videoCanvas,
    0,
    0
  );


  glowCtx.globalAlpha =
    1;


  videoCtx.save();


  videoCtx.globalCompositeOperation =
    "screen";


  videoCtx.globalAlpha =
    0.26;


  videoCtx.drawImage(
    glowCanvas,
    0,
    0
  );


  videoCtx.restore();
}



function drawWarpedScreen(
  targetCtx,
  source,
  w,
  h,
  time
) {

  const points =
    getScreenPoints(
      w,
      h
    );


  const {
    TL,
    TR,
    BL,
    BR
  } = points;


  prepareVideoImage(
    source,
    time,
    w,
    h
  );


  /*
  スクリーン周囲の光のにじみ。

  まず大きくぼけた光を
  後ろに敷く。
  */

  targetCtx.save();


  targetCtx.filter =
    "blur(16px)";


  targetCtx.fillStyle =
    "rgba(150,165,180,0.11)";


  targetCtx.beginPath();


  targetCtx.moveTo(
    TL.x - 4,
    TL.y - 4
  );


  targetCtx.lineTo(
    TR.x + 4,
    TR.y - 4
  );


  targetCtx.lineTo(
    BR.x + 4,
    BR.y + 4
  );


  targetCtx.lineTo(
    BL.x - 4,
    BL.y + 4
  );


  targetCtx.closePath();


  targetCtx.fill();


  targetCtx.restore();


  /*
  本体を台形へ描画
  */

  targetCtx.save();


  targetCtx.beginPath();


  targetCtx.moveTo(
    TL.x,
    TL.y
  );


  targetCtx.lineTo(
    TR.x,
    TR.y
  );


  targetCtx.lineTo(
    BR.x,
    BR.y
  );


  targetCtx.lineTo(
    BL.x,
    BL.y
  );


  targetCtx.closePath();


  targetCtx.clip();


  const strips =
    180;


  for (
    let i = 0;
    i < strips;
    i++
  ) {

    const u1 =
      i / strips;


    const u2 =
      (i + 1) / strips;


    const topX1 =
      lerp(
        TL.x,
        TR.x,
        u1
      );


    const topX2 =
      lerp(
        TL.x,
        TR.x,
        u2
      );


    const bottomX1 =
      lerp(
        BL.x,
        BR.x,
        u1
      );


    const bottomX2 =
      lerp(
        BL.x,
        BR.x,
        u2
      );


    const topY1 =
      lerp(
        TL.y,
        TR.y,
        u1
      );


    const topY2 =
      lerp(
        TL.y,
        TR.y,
        u2
      );


    const bottomY1 =
      lerp(
        BL.y,
        BR.y,
        u1
      );


    const bottomY2 =
      lerp(
        BL.y,
        BR.y,
        u2
      );


    const destX =
      Math.min(
        topX1,
        bottomX1
      );


    const nextX =
      Math.max(
        topX2,
        bottomX2
      );


    const destY =
      (
        topY1 +
        topY2
      ) / 2;


    const destBottom =
      (
        bottomY1 +
        bottomY2
      ) / 2;


    const destW =
      Math.max(
        2,
        nextX -
        destX +
        3
      );


    const destH =
      destBottom -
      destY;


    const srcX =
      Math.floor(
        u1 *
        videoCanvas.width
      );


    const srcW =
      Math.max(
        1,
        Math.ceil(
          videoCanvas.width /
          strips
        ) + 1
      );


    targetCtx.drawImage(
      videoCanvas,

      srcX,
      0,
      srcW,
      videoCanvas.height,

      destX,
      destY,
      destW,
      destH
    );
  }


  targetCtx.restore();


  /*
  黒背景とスクリーンの境界を
  はっきり線にしない。
  */

  targetCtx.save();


  targetCtx.filter =
    "blur(7px)";


  targetCtx.strokeStyle =
    "rgba(165,175,185,0.15)";


  targetCtx.lineWidth =
    12;


  targetCtx.beginPath();


  targetCtx.moveTo(
    TL.x,
    TL.y
  );


  targetCtx.lineTo(
    TR.x,
    TR.y
  );


  targetCtx.lineTo(
    BR.x,
    BR.y
  );


  targetCtx.lineTo(
    BL.x,
    BL.y
  );


  targetCtx.closePath();


  targetCtx.stroke();


  targetCtx.restore();
}



function drawVignette(
  targetCtx,
  w,
  h
) {

  const gradient =
    targetCtx.createRadialGradient(

      w * 0.52,
      h * 0.45,
      w * 0.25,

      w * 0.52,
      h * 0.48,
      w * 0.80
    );


  gradient.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );


  gradient.addColorStop(
    0.58,
    "rgba(0,0,0,0.08)"
  );


  gradient.addColorStop(
    1,
    "rgba(0,0,0,0.72)"
  );


  targetCtx.fillStyle =
    gradient;


  targetCtx.fillRect(
    0,
    0,
    w,
    h
  );
}



function drawNoise(
  targetCtx,
  w,
  h
) {

  targetCtx.save();


  targetCtx.globalAlpha =
    0.045;


  for (
    let i = 0;
    i < 130;
    i++
  ) {

    const gray =
      Math.floor(
        70 +
        Math.random() * 140
      );


    targetCtx.fillStyle =
      `rgb(${gray},${gray},${gray})`;


    targetCtx.fillRect(
      Math.random() * w,
      Math.random() * h,
      1 + Math.random() * 1.5,
      1 + Math.random() * 1.5
    );
  }


  targetCtx.restore();
}



function drawWholeCameraShake(
  time,
  w,
  h
) {

  /*
  カメラそのものが揺れる動き。
  スクリーン単体ではなく
  映画館全体に適用。
  */

  const shakeX =
    Math.sin(
      time * 7.9
    ) * 2.4
    +
    Math.sin(
      time * 17.1
    ) * 0.9
    +
    Math.sin(
      time * 1.8
    ) * 3.2;


  const shakeY =
    Math.cos(
      time * 6.7
    ) * 2.0
    +
    Math.sin(
      time * 12.8
    ) * 0.85;


  const driftX =
    Math.sin(
      time * 0.37
    ) * 4.5;


  const driftY =
    Math.cos(
      time * 0.31
    ) * 3.2;


  const rotation =
    Math.sin(
      time * 0.76
    ) * 0.0038
    +
    Math.sin(
      time * 3.6
    ) * 0.0012;


  ctx.save();


  ctx.fillStyle =
    "#000";


  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  ctx.translate(
    w / 2 +
    shakeX +
    driftX,

    h / 2 +
    shakeY +
    driftY
  );


  ctx.rotate(
    rotation
  );


  /*
  少し拡大して
  ブレで端が見えないようにする
  */

  ctx.scale(
    1.018,
    1.018
  );


  ctx.drawImage(
    sceneCanvas,

    -w / 2,
    -h / 2,

    w,
    h
  );


  ctx.restore();
}



processButton.addEventListener(
  "click",
  async function() {

    if (!selectedFile) {
      return;
    }


    try {


      if (
        !window.MediaRecorder
      ) {

        throw new Error(
          "MediaRecorderに対応していません"
        );
      }


      if (
        !canvas.captureStream
      ) {

        throw new Error(
          "Canvas captureStreamに対応していません"
        );
      }


      processButton.disabled =
        true;


      sourceVideo.controls =
        false;


      resultArea.style.display =
        "none";


      progressWrap.style.display =
        "block";


      progressBar.style.width =
        "0%";


      progressText.textContent =
        "準備中";


      status.textContent =
        "動画加工の準備をしています。";


      await prepareAudio();


      sourceVideo.pause();


      sourceVideo.currentTime =
        0;


      await new Promise(
        resolve => {

          if (
            sourceVideo.readyState >= 1
          ) {

            resolve();

          } else {

            sourceVideo.onloadedmetadata =
              resolve;
          }
        }
      );


      const isPortrait =
        sourceVideo.videoHeight >
        sourceVideo.videoWidth;


      if (isPortrait) {

        canvas.width =
          540;

        canvas.height =
          960;

      } else {

        canvas.width =
          960;

        canvas.height =
          540;
      }


      sceneCanvas.width =
        canvas.width;


      sceneCanvas.height =
        canvas.height;


      const canvasStream =
        canvas.captureStream(30);


      const finalStream =
        new MediaStream();


      canvasStream
        .getVideoTracks()
        .forEach(
          track => {

            finalStream.addTrack(
              track
            );
          }
        );


      if (audioDestination) {

        audioDestination.stream
          .getAudioTracks()
          .forEach(
            track => {

              finalStream.addTrack(
                track
              );
            }
          );
      }


      const mimeType =
        chooseMimeType();


      const recorderOptions =
        mimeType
        ? {
            mimeType:
              mimeType,

            videoBitsPerSecond:
              2300000
          }
        : {
            videoBitsPerSecond:
              2300000
          };


      const recorder =
        new MediaRecorder(
          finalStream,
          recorderOptions
        );


      const chunks = [];


      recorder.ondataavailable =
        function(event) {

          if (
            event.data &&
            event.data.size > 0
          ) {

            chunks.push(
              event.data
            );
          }
        };


      recorder.onstop =
        function() {


          const actualType =
            recorder.mimeType ||
            mimeType ||
            "video/mp4";


          const blob =
            new Blob(
              chunks,
              {
                type:
                  actualType
              }
            );


          if (outputURL) {

            URL.revokeObjectURL(
              outputURL
            );
          }


          outputURL =
            URL.createObjectURL(
              blob
            );


          resultVideo.src =
            outputURL;


          saveButton.href =
            outputURL;


          saveButton.download =
            actualType.includes(
              "mp4"
            )
              ? "movie-leak.mp4"
              : "movie-leak.webm";


          resultArea.style.display =
            "block";


          progressBar.style.width =
            "100%";


          progressText.textContent =
            "完成";


          status.textContent =
            "加工が完了しました。";


          processButton.disabled =
            false;


          sourceVideo.controls =
            true;
        };


      function drawFrame() {


        if (
          sourceVideo.paused ||
          sourceVideo.ended
        ) {

          return;
        }


        const time =
          sourceVideo.currentTime;


        const w =
          canvas.width;


        const h =
          canvas.height;


        /*
        まず映画館全体を
        静止した1枚として作る。
        */

        sceneCtx.clearRect(
          0,
          0,
          w,
          h
        );


        drawCinemaBackground(
          sceneCtx,
          w,
          h
        );


        drawWarpedScreen(
          sceneCtx,
          sourceVideo,
          w,
          h,
          time
        );


        drawVignette(
          sceneCtx,
          w,
          h
        );


        drawNoise(
          sceneCtx,
          w,
          h
        );


        /*
        最後にカメラ全体の
        手ブレとして描画。
        */

        drawWholeCameraShake(
          time,
          w,
          h
        );


        if (
          sourceVideo.duration
        ) {

          const percent =
            Math.min(
              100,
              Math.round(
                sourceVideo.currentTime /
                sourceVideo.duration *
                100
              )
            );


          progressBar.style.width =
            percent +
            "%";


          progressText.textContent =
            "加工中 " +
            percent +
            "%";
        }


        requestAnimationFrame(
          drawFrame
        );
      }


      sourceVideo.onended =
        function() {


          if (
            recorder.state !==
            "inactive"
          ) {

            recorder.stop();
          }
        };


      status.textContent =
        "ピンぼけ・光のにじみ・手ブレを加えています。動画の長さとほぼ同じ時間かかります。";


      recorder.start(
        500
      );


      await sourceVideo.play();


      requestAnimationFrame(
        drawFrame
      );

    }


    catch(error) {


      console.error(
        error
      );


      processButton.disabled =
        false;


      sourceVideo.controls =
        true;


      progressText.textContent =
        "エラー";


      status.textContent =
        "エラー：" +
        error.message;
    }
  }
);

</script>

</body>
</html>
