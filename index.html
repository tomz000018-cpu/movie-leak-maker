<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Leak Maker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
}

.container{
  width:min(92%,800px);
  margin:auto;
  padding:35px 0 80px;
}

h1{
  text-align:center;
  margin:0 0 8px;
  font-size:30px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  line-height:1.6;
  margin-bottom:30px;
}

.panel{
  background:#161616;
  border:1px solid #333;
  border-radius:18px;
  padding:20px;
}

.file-label,
.process-button,
.save-button{
  display:block;
  width:100%;
  border:0;
  border-radius:12px;
  padding:16px;
  font-size:17px;
  font-weight:bold;
  text-align:center;
}

.file-label{
  background:#fff;
  color:#111;
}

#videoInput{display:none}

#fileName{
  margin-top:14px;
  text-align:center;
  color:#aaa;
  word-break:break-all;
}

.preview-area,
.result-area{
  display:none;
  margin-top:24px;
}

.screen{
  background:#000;
  padding:8px;
  border-radius:10px;
  overflow:hidden;
}

video{
  display:block;
  width:100%;
  max-height:65vh;
  background:#000;
}

#workCanvas{display:none}

.process-button{
  margin-top:20px;
  background:#f2f2f2;
  color:#111;
}

.process-button:disabled{
  background:#444;
  color:#999;
}

.save-button{
  margin-top:16px;
  background:#fff;
  color:#111;
  text-decoration:none;
}

.status{
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  background:#101010;
  color:#ccc;
  line-height:1.6;
  font-size:14px;
}

.progress-wrap{
  display:none;
  margin-top:18px;
}

.progress-bg{
  height:12px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background:white;
}

.progress-text{
  margin-top:8px;
  text-align:center;
  color:#aaa;
  font-size:13px;
}

.notice{
  margin-top:25px;
  text-align:center;
  color:#777;
  font-size:12px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>Movie Leak Maker</h1>

<div class="subtitle">
普通の動画を<br>
「海外試写会の流出映像風」に加工します
</div>

<div class="panel">

<label class="file-label" for="videoInput">
動画を選ぶ
</label>

<input id="videoInput" type="file" accept="video/*">

<div id="fileName">
まだ動画は選択されていません
</div>

<div class="preview-area" id="previewArea">

<div class="screen">
<video id="sourceVideo" controls playsinline></video>
</div>

<button id="processButton" class="process-button">
流出映像風に加工する
</button>

<div class="progress-wrap" id="progressWrap">

<div class="progress-bg">
<div id="progressBar" class="progress-bar"></div>
</div>

<div id="progressText" class="progress-text">
準備中
</div>

</div>

<div id="status" class="status">
動画を選んでください。
</div>

</div>

<div class="result-area" id="resultArea">

<h2>完成動画</h2>

<div class="screen">
<video id="resultVideo" controls playsinline></video>
</div>

<a id="saveButton" class="save-button">
完成動画を保存
</a>

</div>

</div>

<canvas id="workCanvas"></canvas>

<div class="notice">
動画はサーバーへ送信せず、この端末の中で加工します。
</div>

</div>


<script>

const videoInput = document.getElementById("videoInput");
const sourceVideo = document.getElementById("sourceVideo");
const resultVideo = document.getElementById("resultVideo");

const previewArea = document.getElementById("previewArea");
const resultArea = document.getElementById("resultArea");

const processButton = document.getElementById("processButton");
const saveButton = document.getElementById("saveButton");

const fileName = document.getElementById("fileName");
const status = document.getElementById("status");

const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");

const canvas = document.getElementById("workCanvas");
const ctx = canvas.getContext("2d");

const sceneCanvas = document.createElement("canvas");
const sceneCtx = sceneCanvas.getContext("2d");

const screenCanvas = document.createElement("canvas");
const screenCtx = screenCanvas.getContext("2d");

let selectedFile = null;
let inputURL = null;
let outputURL = null;

let audioContext = null;
let audioSource = null;
let audioDestination = null;


videoInput.addEventListener("change", event => {

  selectedFile = event.target.files[0];

  if (!selectedFile) return;

  if (inputURL) URL.revokeObjectURL(inputURL);

  inputURL = URL.createObjectURL(selectedFile);

  sourceVideo.src = inputURL;
  sourceVideo.load();

  fileName.textContent = selectedFile.name;

  previewArea.style.display = "block";
  resultArea.style.display = "none";

  status.textContent = "動画を読み込みました。";
});


function chooseMimeType(){

  const types = [
    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];

  for(const type of types){

    if(MediaRecorder.isTypeSupported(type)){
      return type;
    }
  }

  return "";
}


function makeImpulse(context,seconds,decay){

  const rate = context.sampleRate;
  const length = rate * seconds;

  const impulse =
    context.createBuffer(2,length,rate);

  for(let c=0;c<2;c++){

    const data =
      impulse.getChannelData(c);

    for(let i=0;i<length;i++){

      data[i] =
        (Math.random()*2-1) *
        Math.pow(
          1-i/length,
          decay
        );
    }
  }

  return impulse;
}


async function prepareAudio(){

  if(!audioContext){

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }

  await audioContext.resume();

  if(audioSource) return;

  audioSource =
    audioContext.createMediaElementSource(
      sourceVideo
    );

  audioDestination =
    audioContext.createMediaStreamDestination();


  const dry =
    audioContext.createGain();

  dry.gain.value = 0.68;


  const wet =
    audioContext.createGain();

  wet.gain.value = 0.26;


  const lowpass =
    audioContext.createBiquadFilter();

  lowpass.type = "lowpass";
  lowpass.frequency.value = 4700;


  const delay =
    audioContext.createDelay();

  delay.delayTime.value = 0.045;


  const convolver =
    audioContext.createConvolver();

  convolver.buffer =
    makeImpulse(
      audioContext,
      1.4,
      2.9
    );


  audioSource.connect(lowpass);

  lowpass.connect(dry);
  dry.connect(audioDestination);

  lowpass.connect(delay);
  delay.connect(convolver);
  convolver.connect(wet);
  wet.connect(audioDestination);

  dry.connect(audioContext.destination);
  wet.connect(audioContext.destination);
}


function renderScreenImage(time){

  /*
    解像度を潰さない。
    出力とほぼ同じ大きさで描く。
  */

  screenCanvas.width = canvas.width;
  screenCanvas.height = canvas.height;


  const sw = screenCanvas.width;
  const sh = screenCanvas.height;


  screenCtx.clearRect(0,0,sw,sh);


  /*
    元動画の縦横比を維持しながら
    スクリーンいっぱいに表示。
  */

  const vr =
    sourceVideo.videoWidth /
    sourceVideo.videoHeight;

  const sr = sw/sh;


  let dw;
  let dh;
  let dx;
  let dy;


  if(vr > sr){

    dw = sw;
    dh = sw / vr;

  }else{

    dh = sh;
    dw = sh * vr;
  }


  dx = (sw-dw)/2;
  dy = (sh-dh)/2;


  /*
    本当のピンぼけ。

    以前よりかなり強くしている。
  */

  const slowFocus =
    (Math.sin(time*0.55)+1)/2;

  const secondFocus =
    (Math.sin(time*0.21+1.4)+1)/2;

  const blur =
    7 +
    slowFocus*5 +
    secondFocus*2;


  /*
    露出の呼吸
  */

  const brightness =
    92 +
    Math.sin(time*0.85)*4 +
    Math.sin(time*4.3)*2;


  screenCtx.save();

  screenCtx.filter =
    `brightness(${brightness}%)
     contrast(88%)
     saturate(72%)
     blur(${blur}px)`;

  screenCtx.drawImage(
    sourceVideo,
    dx,
    dy,
    dw,
    dh
  );

  screenCtx.restore();


  /*
    BLOOM

    同じ映像を強くぼかして
    screen合成する。
  */

  screenCtx.save();

  screenCtx.globalCompositeOperation =
    "screen";

  screenCtx.globalAlpha =
    0.48;

  screenCtx.filter =
    "brightness(165%) blur(20px)";

  screenCtx.drawImage(
    sourceVideo,
    dx,
    dy,
    dw,
    dh
  );

  screenCtx.restore();


  /*
    さらに強い白飛びの滲み。
  */

  screenCtx.save();

  screenCtx.globalCompositeOperation =
    "screen";

  screenCtx.globalAlpha =
    0.18;

  screenCtx.filter =
    "brightness(210%) blur(38px)";

  screenCtx.drawImage(
    sourceVideo,
    dx,
    dy,
    dw,
    dh
  );

  screenCtx.restore();
}


function buildCinemaScene(time){

  const w = sceneCanvas.width;
  const h = sceneCanvas.height;

  sceneCtx.clearRect(0,0,w,h);

  sceneCtx.fillStyle = "#000";
  sceneCtx.fillRect(0,0,w,h);


  renderScreenImage(time);


  /*
    斜めスクリーン。

    細切れ処理は一切しない。
    1枚の連続画像を変形する。
  */

  sceneCtx.save();


  /*
    スクリーン中心
  */

  sceneCtx.translate(
    w*0.50,
    h*0.48
  );


  /*
    少し回転
  */

  sceneCtx.rotate(
    -0.055
  );


  /*
    横方向のスキュー
  */

  sceneCtx.transform(
    1,
    -0.035,
    0.13,
    1,
    0,
    0
  );


  /*
    ほぼ画面いっぱいまで拡大
  */

  const scaleX = 1.03;
  const scaleY = 0.86;


  /*
    スクリーン外側の大きな光漏れ
  */

  sceneCtx.save();

  sceneCtx.globalAlpha = 0.24;

  sceneCtx.filter =
    "blur(38px) brightness(140%)";

  sceneCtx.drawImage(
    screenCanvas,

    -w*0.49*scaleX,
    -h*0.46*scaleY,

    w*0.98*scaleX,
    h*0.92*scaleY
  );

  sceneCtx.restore();


  /*
    メイン映像。

    ここにも軽く追加のBlurをかけ、
    スクリーンの縁を鋭くしない。
  */

  sceneCtx.save();

  sceneCtx.filter =
    "blur(3.5px)";

  sceneCtx.drawImage(
    screenCanvas,

    -w*0.49*scaleX,
    -h*0.46*scaleY,

    w*0.98*scaleX,
    h*0.92*scaleY
  );

  sceneCtx.restore();


  /*
    スクリーン境界の光。

    矩形の線は描かない。
    周囲にボヤっとした光だけ置く。
  */

  sceneCtx.save();

  sceneCtx.globalAlpha = 0.13;

  sceneCtx.filter =
    "blur(30px)";

  sceneCtx.fillStyle =
    "rgba(185,200,215,0.8)";

  sceneCtx.fillRect(
    -w*0.485*scaleX,
    -h*0.455*scaleY,
    w*0.97*scaleX,
    h*0.91*scaleY
  );

  sceneCtx.restore();


  sceneCtx.restore();


  /*
    スクリーン光が黒い空間にも
    うっすら漏れる。
  */

  const glow =
    sceneCtx.createRadialGradient(

      w*0.52,
      h*0.47,
      w*0.12,

      w*0.52,
      h*0.50,
      w*0.75
    );


  glow.addColorStop(
    0,
    "rgba(120,135,150,0.055)"
  );

  glow.addColorStop(
    0.48,
    "rgba(60,65,70,0.028)"
  );

  glow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  sceneCtx.fillStyle = glow;

  sceneCtx.fillRect(
    0,
    0,
    w,
    h
  );


  /*
    周辺減光
  */

  const vignette =
    sceneCtx.createRadialGradient(

      w*0.52,
      h*0.47,
      w*0.24,

      w*0.52,
      h*0.50,
      w*0.80
    );


  vignette.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  vignette.addColorStop(
    0.65,
    "rgba(0,0,0,0.12)"
  );

  vignette.addColorStop(
    1,
    "rgba(0,0,0,0.72)"
  );

  sceneCtx.fillStyle =
    vignette;

  sceneCtx.fillRect(
    0,
    0,
    w,
    h
  );
}


function drawFinalCamera(time){

  const w = canvas.width;
  const h = canvas.height;


  /*
    基本手ブレ
  */

  const x =
    Math.sin(time*7.3)*3.3 +
    Math.sin(time*16.1)*1.2 +
    Math.sin(time*1.43)*5;


  const y =
    Math.cos(time*6.6)*2.6 +
    Math.sin(time*13.3)*1.1 +
    Math.cos(time*1.05)*3;


  /*
    時々少し大きく手が動く
  */

  const occasional =
    Math.sin(time*0.33)*5;


  const rotation =
    Math.sin(time*0.72)*0.006 +
    Math.sin(time*3.1)*0.0017;


  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  ctx.fillStyle = "#000";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  ctx.save();


  ctx.translate(
    w/2 + x + occasional,
    h/2 + y
  );


  ctx.rotate(
    rotation
  );


  ctx.scale(
    1.035,
    1.035
  );


  ctx.drawImage(
    sceneCanvas,
    -w/2,
    -h/2,
    w,
    h
  );


  ctx.restore();
}



processButton.addEventListener(
"click",
async function(){

  if(!selectedFile) return;


  try{


    if(!window.MediaRecorder){
      throw new Error(
        "MediaRecorderに対応していません"
      );
    }


    if(!canvas.captureStream){
      throw new Error(
        "Canvas captureStreamに対応していません"
      );
    }


    processButton.disabled = true;

    sourceVideo.controls = false;

    resultArea.style.display =
      "none";

    progressWrap.style.display =
      "block";

    progressBar.style.width =
      "0%";

    progressText.textContent =
      "準備中";

    status.textContent =
      "動画加工の準備をしています。";


    await prepareAudio();


    sourceVideo.pause();

    sourceVideo.currentTime = 0;


    await new Promise(resolve=>{

      if(sourceVideo.readyState>=1){

        resolve();

      }else{

        sourceVideo.onloadedmetadata =
          resolve;
      }
    });


    const portrait =
      sourceVideo.videoHeight >
      sourceVideo.videoWidth;


    if(portrait){

      canvas.width = 540;
      canvas.height = 960;

    }else{

      canvas.width = 960;
      canvas.height = 540;
    }


    sceneCanvas.width =
      canvas.width;

    sceneCanvas.height =
      canvas.height;


    const canvasStream =
      canvas.captureStream(30);


    const finalStream =
      new MediaStream();


    canvasStream
      .getVideoTracks()
      .forEach(track=>
        finalStream.addTrack(track)
      );


    if(audioDestination){

      audioDestination.stream
        .getAudioTracks()
        .forEach(track=>
          finalStream.addTrack(track)
        );
    }


    const mimeType =
      chooseMimeType();


    const recorder =
      new MediaRecorder(

        finalStream,

        mimeType
        ?{
          mimeType,
          videoBitsPerSecond:
            3500000
        }
        :{
          videoBitsPerSecond:
            3500000
        }
      );


    const chunks = [];


    recorder.ondataavailable =
      e=>{

        if(e.data && e.data.size>0){
          chunks.push(e.data);
        }
      };


    recorder.onstop =
      ()=>{

        const actualType =
          recorder.mimeType ||
          mimeType ||
          "video/mp4";


        const blob =
          new Blob(
            chunks,
            {type:actualType}
          );


        if(outputURL){
          URL.revokeObjectURL(outputURL);
        }


        outputURL =
          URL.createObjectURL(blob);


        resultVideo.src =
          outputURL;


        saveButton.href =
          outputURL;


        saveButton.download =
          actualType.includes("mp4")
          ? "movie-leak.mp4"
          : "movie-leak.webm";


        resultArea.style.display =
          "block";


        progressBar.style.width =
          "100%";


        progressText.textContent =
          "完成";


        status.textContent =
          "加工が完了しました。";


        processButton.disabled =
          false;


        sourceVideo.controls =
          true;
      };


    function drawFrame(){

      if(
        sourceVideo.paused ||
        sourceVideo.ended
      ){
        return;
      }


      const t =
        sourceVideo.currentTime;


      buildCinemaScene(t);

      drawFinalCamera(t);


      if(sourceVideo.duration){

        const percent =
          Math.min(
            100,
            Math.round(
              sourceVideo.currentTime /
              sourceVideo.duration *
              100
            )
          );


        progressBar.style.width =
          percent+"%";


        progressText.textContent =
          "加工中 "+percent+"%";
      }


      requestAnimationFrame(
        drawFrame
      );
    }


    sourceVideo.onended =
      ()=>{

        if(
          recorder.state !==
          "inactive"
        ){
          recorder.stop();
        }
      };


    status.textContent =
      "強いピンぼけ・光のにじみ・カメラ手ブレを加えています。";


    recorder.start(500);


    await sourceVideo.play();


    requestAnimationFrame(
      drawFrame
    );


  }catch(error){


    console.error(error);


    processButton.disabled =
      false;


    sourceVideo.controls =
      true;


    progressText.textContent =
      "エラー";


    status.textContent =
      "エラー："+error.message;
  }

});
</script>

</body>
</html>
