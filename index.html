let selectedFile =

function chooseMimeType(){


  const types = [

    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',

    'video/mp4',

    'video/webm;codecs=vp9,opus',

    'video/webm;codecs=vp8,opus',

    'video/webm'

  ];


  for(
    const type
    of types
  ){

    if(
      MediaRecorder
        .isTypeSupported(
          type
        )
    ){

      return type;
    }

  }


  return "";

}





function makeImpulse(
  context,
  seconds,
  decay
){


  const rate =
    context.sampleRate;


  const length =
    Math.floor(
      rate *
      seconds
    );


  const impulse =
    context.createBuffer(
      2,
      length,
      rate
    );


  for(
    let channel = 0;
    channel < 2;
    channel++
  ){


    const data =
      impulse.getChannelData(
        channel
      );


    for(
      let i = 0;
      i < length;
      i++
    ){


      data[i] =
        (
          Math.random() *
          2 -
          1
        )
        *
        Math.pow(
          1 -
          i /
          length,
          decay
        );

    }

  }


  return impulse;

}





function createNoiseBuffer(
  context,
  seconds
){


  const length =
    Math.floor(
      context.sampleRate *
      seconds
    );


  const buffer =
    context.createBuffer(
      1,
      length,
      context.sampleRate
    );


  const data =
    buffer.getChannelData(
      0
    );


  for(
    let i = 0;
    i < length;
    i++
  ){


    data[i] =
      Math.random() *
      2 -
      1;

  }


  return buffer;

}





async function prepareAudio(){


  if(
    !audioContext
  ){


    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  await audioContext.resume();



  if(
    audioSource
  ){

    return;

  }



  audioSource =
    audioContext
      .createMediaElementSource(
        sourceVideo
      );



  audioDestination =
    audioContext
      .createMediaStreamDestination();



  /*
  元動画
  */

  const dry =
    audioContext
      .createGain();


  dry.gain.value =
    0.54;



  /*
  劇場反響
  */

  const wet =
    audioContext
      .createGain();


  wet.gain.value =
    0.43;



  const lowpass =
    audioContext
      .createBiquadFilter();


  lowpass.type =
    "lowpass";


  lowpass.frequency.value =
    3900;



  const delay =
    audioContext
      .createDelay();


  delay.delayTime.value =
    0.075;



  const convolver =
    audioContext
      .createConvolver();


  convolver.buffer =
    makeImpulse(
      audioContext,
      2.0,
      2.2
    );



  audioSource.connect(
    lowpass
  );


  lowpass.connect(
    dry
  );


  dry.connect(
    audioDestination
  );


  lowpass.connect(
    delay
  );


  delay.connect(
    convolver
  );


  convolver.connect(
    wet
  );


  wet.connect(
    audioDestination
  );



  dry.connect(
    audioContext.destination
  );


  wet.connect(
    audioContext.destination
  );



  /*
  観客音専用
  */

  audienceBus =
    audioContext
      .createGain();


  audienceBus.gain.value =
    0.95;



  const audienceLowpass =
    audioContext
      .createBiquadFilter();


  audienceLowpass.type =
    "lowpass";


  audienceLowpass.frequency.value =
    5000;



  const audienceReverb =
    audioContext
      .createConvolver();


  audienceReverb.buffer =
    makeImpulse(
      audioContext,
      1.7,
      2.4
    );



  const audienceDry =
    audioContext
      .createGain();


  audienceDry.gain.value =
    0.80;



  const audienceWet =
    audioContext
      .createGain();


  audienceWet.gain.value =
    0.32;



  audienceBus.connect(
    audienceLowpass
  );


  audienceLowpass.connect(
    audienceDry
  );


  audienceLowpass.connect(
    audienceReverb
  );


  audienceReverb.connect(
    audienceWet
  );


  audienceDry.connect(
    audioDestination
  );


  audienceWet.connect(
    audioDestination
  );



  audienceDry.connect(
    audioContext.destination
  );


  audienceWet.connect(
    audioContext.destination
  );

}





function stopAudienceSounds(){


  activeAudienceNodes
    .forEach(
      node => {


        try{


          if(
            node.stop
          ){

            node.stop();

          }


        }catch(error){}


      }
    );


  activeAudienceNodes =
    [];

}





/*
客席ざわめき
*/

function createAudienceMurmur(
  startTime
){


  /*
  低い客席音
  */

  const source1 =
    audioContext
      .createBufferSource();


  source1.buffer =
    createNoiseBuffer(
      audioContext,
      14
    );


  source1.loop =
    true;



  const hp1 =
    audioContext
      .createBiquadFilter();


  hp1.type =
    "highpass";


  hp1.frequency.value =
    120;



  const lp1 =
    audioContext
      .createBiquadFilter();


  lp1.type =
    "lowpass";


  lp1.frequency.value =
    700;



  const gain1 =
    audioContext
      .createGain();


  gain1.gain.value =
    0.018;



  source1.connect(
    hp1
  );


  hp1.connect(
    lp1
  );


  lp1.connect(
    gain1
  );


  gain1.connect(
    audienceBus
  );



  source1.start(
    startTime
  );


  activeAudienceNodes.push(
    source1
  );



  /*
  少し高いざわめき
  */

  const source2 =
    audioContext
      .createBufferSource();


  source2.buffer =
    createNoiseBuffer(
      audioContext,
      11
    );


  source2.loop =
    true;



  const hp2 =
    audioContext
      .createBiquadFilter();


  hp2.type =
    "highpass";


  hp2.frequency.value =
    380;



  const lp2 =
    audioContext
      .createBiquadFilter();


  lp2.type =
    "lowpass";


  lp2.frequency.value =
    1700;



  const gain2 =
    audioContext
      .createGain();


  gain2.gain.value =
    0.008;



  source2.connect(
    hp2
  );


  hp2.connect(
    lp2
  );


  lp2.connect(
    gain2
  );


  gain2.connect(
    audienceBus
  );



  source2.start(
    startTime
  );


  activeAudienceNodes.push(
    source2
  );



  return {

    low:gain1,

    high:gain2,

    source1,

    source2

  };

}





/*
1人分の
「オオオ」「ウォオ」
のような母音歓声
*/

function createVowelVoice(

  startTime,

  duration,

  strength,

  voiceType,

  rise = true

){


  const base =
    voiceType === "high"
    ?
      170 +
      Math.random() * 95
    :
      85 +
      Math.random() * 90;



  const oscillator =
    audioContext
      .createOscillator();


  oscillator.type =
    "sawtooth";



  oscillator.frequency
    .setValueAtTime(

      base,

      startTime

    );



  if(
    rise
  ){


    oscillator.frequency
      .exponentialRampToValueAtTime(

        base *
        (
          1.15 +
          Math.random() * 0.30
        ),

        startTime +
        duration * 0.55

      );

  }



  /*
  口の共鳴を作る
  */


  const formant1 =
    audioContext
      .createBiquadFilter();


  formant1.type =
    "bandpass";


  formant1.frequency.value =
    voiceType === "high"
    ?
      720 +
      Math.random() * 180
    :
      520 +
      Math.random() * 180;


  formant1.Q.value =
    4;



  const formant2 =
    audioContext
      .createBiquadFilter();


  formant2.type =
    "bandpass";


  formant2.frequency.value =
    voiceType === "high"
    ?
      1350 +
      Math.random() * 350
    :
      950 +
      Math.random() * 300;


  formant2.Q.value =
    3;



  const gain1 =
    audioContext
      .createGain();


  const gain2 =
    audioContext
      .createGain();



  gain1.gain.value =
    0.65;


  gain2.gain.value =
    0.35;



  oscillator.connect(
    formant1
  );


  oscillator.connect(
    formant2
  );


  formant1.connect(
    gain1
  );


  formant2.connect(
    gain2
  );



  const voiceGain =
    audioContext
      .createGain();



  const maxGain =
    (
      0.0045 +
      Math.random() *
      0.006
    )
    *
    strength;



  voiceGain.gain
    .setValueAtTime(

      0.0001,

      startTime

    );


  voiceGain.gain
    .linearRampToValueAtTime(

      maxGain,

      startTime +
      0.08 +
      Math.random() *
      0.10

    );


  voiceGain.gain
    .setValueAtTime(

      maxGain,

      startTime +
      duration *
      0.45

    );


  voiceGain.gain
    .exponentialRampToValueAtTime(

      0.0001,

      startTime +
      duration

    );



  gain1.connect(
    voiceGain
  );


  gain2.connect(
    voiceGain
  );



  if(
    audioContext
      .createStereoPanner
  ){


    const pan =
      audioContext
        .createStereoPanner();


    pan.pan.value =
      -0.9 +
      Math.random() *
      1.8;


    voiceGain.connect(
      pan
    );


    pan.connect(
      audienceBus
    );


  }else{


    voiceGain.connect(
      audienceBus
    );

  }



  oscillator.start(
    startTime
  );


  oscillator.stop(
    startTime +
    duration +
    0.05
  );


  activeAudienceNodes.push(
    oscillator
  );

}





/*
複数人の
OHHH / WHOA
*/

function createHumanCrowdCheer(

  startTime,

  duration = 1.8,

  strength = 1

){


  const people =
    Math.floor(
      28 *
      strength
    );


  for(
    let i = 0;
    i < people;
    i++
  ){


    const delay =
      Math.random() *
      0.30;


    const individualDuration =
      duration *
      (
        0.55 +
        Math.random() *
        0.60
      );


    const highVoice =
      Math.random() <
      0.38;


    createVowelVoice(

      startTime +
      delay,

      individualDuration,

      strength,

      highVoice
      ?
        "high"
      :
        "low",

      Math.random() >
      0.18

    );

  }



  /*
  群衆全体の息・ノイズ
  */

  const noise =
    audioContext
      .createBufferSource();


  noise.buffer =
    createNoiseBuffer(
      audioContext,
      duration +
      0.8
    );



  const filter =
    audioContext
      .createBiquadFilter();


  filter.type =
    "bandpass";


  filter.frequency.value =
    1250;


  filter.Q.value =
    0.42;



  const gain =
    audioContext
      .createGain();



  gain.gain
    .setValueAtTime(

      0.0001,

      startTime

    );


  gain.gain
    .linearRampToValueAtTime(

      0.028 *
      strength,

      startTime +
      0.18

    );


  gain.gain
    .exponentialRampToValueAtTime(

      0.0001,

      startTime +
      duration

    );



  noise.connect(
    filter
  );


  filter.connect(
    gain
  );


  gain.connect(
    audienceBus
  );



  noise.start(
    startTime
  );


  noise.stop(
    startTime +
    duration +
    0.3
  );


  activeAudienceNodes.push(
    noise
  );

}





/*
拍手
*/

function createApplause(

  startTime,

  duration = 3,

  strength = 1

){


  const count =
    Math.floor(
      75 *
      strength
    );


  for(
    let i = 0;
    i < count;
    i++
  ){


    const source =
      audioContext
        .createBufferSource();


    source.buffer =
      createNoiseBuffer(
        audioContext,
        0.08
      );



    const filter =
      audioContext
        .createBiquadFilter();


    filter.type =
      "bandpass";


    filter.frequency.value =
      800 +
      Math.random() *
      3000;


    filter.Q.value =
      0.7;



    const gain =
      audioContext
        .createGain();



    const hit =
      startTime +
      Math.random() *
      duration;



    const level =
      (
        0.010 +
        Math.random() *
        0.030
      )
      *
      strength;



    gain.gain
      .setValueAtTime(

        0.0001,

        hit

      );


    gain.gain
      .linearRampToValueAtTime(

        level,

        hit +
        0.008

      );


    gain.gain
      .exponentialRampToValueAtTime(

        0.0001,

        hit +
        0.10

      );



    source.connect(
      filter
    );


    filter.connect(
      gain
    );



    if(
      audioContext
        .createStereoPanner
    ){


      const pan =
        audioContext
          .createStereoPanner();


      pan.pan.value =
        -0.95 +
        Math.random() *
        1.9;


      gain.connect(
        pan
      );


      pan.connect(
        audienceBus
      );


    }else{


      gain.connect(
        audienceBus
      );

    }



    source.start(
      hit
    );


    source.stop(
      hit +
      0.12
    );


    activeAudienceNodes.push(
      source
    );

  }

}





/*
観客リアクション配置
*/

function scheduleAudience(
  duration
){


  stopAudienceSounds();



  const start =
    audioContext.currentTime +
    0.05;



  const murmur =
    createAudienceMurmur(
      start
    );



  /*
  前半
  */


  createHumanCrowdCheer(

    start +
    duration *
    0.25,

    Math.min(
      1.4,
      duration *
      0.11
    ),

    0.45

  );



  /*
  中盤
  */


  createHumanCrowdCheer(

    start +
    duration *
    0.51,

    Math.min(
      2.0,
      duration *
      0.14
    ),

    0.72

  );



  /*
  後半
  大きなOHHH
  */


  createHumanCrowdCheer(

    start +
    duration *
    0.74,

    Math.min(
      2.8,
      duration *
      0.18
    ),

    1.18

  );



  /*
  さらに数人遅れて声を出す
  */


  createHumanCrowdCheer(

    start +
    duration *
    0.77,

    Math.min(
      2.0,
      duration *
      0.13
    ),

    0.68

  );



  /*
  大歓声から拍手
  */


  createApplause(

    start +
    duration *
    0.78,

    Math.min(
      3.8,
      duration *
      0.22
    ),

    1.10

  );



  /*
  ラスト
  */


  if(
    duration >
    8
  ){


    createApplause(

      start +
      duration *
      0.92,

      Math.min(
        1.8,
        duration *
        0.08
      ),

      0.55

    );

  }

動画全面描画

function drawVideoCover(

  targetCtx,

  video,

  width,

  height,

  extraScale = 1

){


  const videoRatio =
    video.videoWidth /
    video.videoHeight;


  const targetRatio =
    width /
    height;


  let sourceX = 0;

  let sourceY = 0;


  let sourceW =
    video.videoWidth;


  let sourceH =
    video.videoHeight;



  if(
    videoRatio >
    targetRatio
  ){


    sourceW =
      video.videoHeight *
      targetRatio;


    sourceX =
      (
        video.videoWidth -
        sourceW
      ) /
      2;


  }else{


    sourceH =
      video.videoWidth /
      targetRatio;


    sourceY =
      (
        video.videoHeight -
        sourceH
      ) /
      2;

  }



  const dw =
    width *
    extraScale;


  const dh =
    height *
    extraScale;


  const dx =
    (
      width -
      dw
    ) /
    2;


  const dy =
    (
      height -
      dh
    ) /
    2;



  targetCtx.drawImage(

    video,

    sourceX,
    sourceY,
    sourceW,
    sourceH,

    dx,
    dy,
    dw,
    dh

  );

}





function renderScreen(
  time
){


  const w =
    screenCanvas.width;


  const h =
    screenCanvas.height;



  screenCtx.clearRect(
    0,
    0,
    w,
    h
  );


  blurCtx.clearRect(
    0,
    0,
    w,
    h
  );


  bloomCtx.clearRect(
    0,
    0,
    w,
    h
  );


  colorCtx.clearRect(
    0,
    0,
    w,
    h
  );



  const focusA =
    (
      Math.sin(
        time *
        0.38
      ) +
      1
    ) /
    2;


  const focusB =
    (
      Math.sin(
        time *
        0.14 +
        2.1
      ) +
      1
    ) /
    2;



  const blur =
    15 +
    focusA *
    9 +
    focusB *
    5;



  const brightness =
    108 +
    Math.sin(
      time *
      0.62
    ) *
    8 +
    Math.sin(
      time *
      3.7
    ) *
    3;



  blurCtx.save();


  blurCtx.filter =
    `
    brightness(${brightness}%)
    contrast(79%)
    saturate(64%)
    blur(${blur}px)
    `;


  drawVideoCover(

    blurCtx,

    sourceVideo,

    w,

    h,

    1.06

  );


  blurCtx.restore();



  const haze =
    blurCtx
      .createLinearGradient(
        0,
        0,
        w,
        h
      );


  haze.addColorStop(
    0,
    "rgba(210,220,230,0.10)"
  );


  haze.addColorStop(
    0.45,
    "rgba(235,235,225,0.16)"
  );


  haze.addColorStop(
    1,
    "rgba(180,200,215,0.08)"
  );


  blurCtx.fillStyle =
    haze;


  blurCtx.fillRect(
    0,
    0,
    w,
    h
  );



  bloomCtx.save();


  bloomCtx.filter =
    "brightness(190%) blur(32px)";


  drawVideoCover(

    bloomCtx,

    sourceVideo,

    w,

    h,

    1.08

  );
