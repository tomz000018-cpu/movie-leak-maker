<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Leak Maker</title>

<style>

*{

}

body{

  background:#080808;
  color:white;
  font-family:
    -apple-system,

}

.container{
  width:min(92%,800px);

}

h1{

}

</head>


<body>

<div class="container">

<h1>Movie Leak Maker</h1>

<div class="subtitle">
普通の動画を<br>
「海外試写会の流出映像風」に加工します
</div>

<div class="panel">

<label class="file-label" for="videoInput">
動画を選ぶ
</label>

<input
  id="videoInput"
  type="file"
  accept="video/*"
>

<div id="fileName">
まだ動画は選択されていません
</div>


<div id="previewArea" class="preview-area">

<div class="screen">

<video
  id="sourceVideo"
  controls
  playsinline
></video>

</div>


<button
  id="processButton"
  class="process-button"
>
流出映像風に加工する
</button>


<div
  id="progressWrap"
  class="progress-wrap"
>

<div class="progress-bg">

<div
  id="progressBar"
  class="progress-bar"
></div>

</div>

<div
  id="progressText"
  class="progress-text"
>
準備中
</div>

</div>


<div id="status" class="status">
動画を選んでください。
</div>

</div>



<div id="resultArea" class="result-area">

<h2>完成動画</h2>

<div class="screen">

<video
  id="resultVideo"
  controls
  playsinline
></video>

</div>

<a
  id="saveButton"
  class="save-button"
>
完成動画を保存
</a>

</div>

</div>

<canvas id="workCanvas"></canvas>

<div class="notice">
動画はサーバーへ送信せず、この端末内で加工します。
</div>

</div>


<script>

const videoInput =
  document.getElementById("videoInput");

const sourceVideo =
  document.getElementById("sourceVideo");

const resultVideo =
  document.getElementById("resultVideo");

const previewArea =
  document.getElementById("previewArea");

const resultArea =
  document.getElementById("resultArea");

const processButton =
  document.getElementById("processButton");

const saveButton =
  document.getElementById("saveButton");

const fileName =
  document.getElementById("fileName");

const status =
  document.getElementById("status");

const progressWrap =
  document.getElementById("progressWrap");

const progressBar =
  document.getElementById("progressBar");

const progressText =
  document.getElementById("progressText");

const canvas =
  document.getElementById("workCanvas");

const ctx =
  canvas.getContext(
    "2d",
    {alpha:false}
  );


/*
映画館全体
*/
const sceneCanvas =
  document.createElement("canvas");

const sceneCtx =
  sceneCanvas.getContext("2d");


/*
スクリーン本体
*/
const screenCanvas =
  document.createElement("canvas");

const screenCtx =
  screenCanvas.getContext("2d");


/*
ぼかし用
*/
const blurCanvas =
  document.createElement("canvas");

const blurCtx =
  blurCanvas.getContext("2d");


/*
ブルーム用
*/
const bloomCanvas =
  document.createElement("canvas");

const bloomCtx =
  bloomCanvas.getContext("2d");


/*
色収差用
*/
const colorCanvas =
  document.createElement("canvas");

const colorCtx =
  colorCanvas.getContext("2d");


let selectedFile = null;

let inputURL = null;

let outputURL = null;

let audioContext = null;

let audioSource = null;

let audioDestination = null;



videoInput.addEventListener(
  "change",
  event => {

    selectedFile =
      event.target.files[0];

    if(!selectedFile){
      return;
    }


    if(inputURL){

      URL.revokeObjectURL(
        inputURL
      );
    }


    inputURL =
      URL.createObjectURL(
        selectedFile
      );


    sourceVideo.src =
      inputURL;


    sourceVideo.load();


    fileName.textContent =
      selectedFile.name;


    previewArea.style.display =
      "block";


    resultArea.style.display =
      "none";


    status.textContent =
      "動画を読み込みました。";
  }
);



function chooseMimeType(){

  const types = [

    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',

    'video/mp4',

    'video/webm;codecs=vp9,opus',

    'video/webm;codecs=vp8,opus',

    'video/webm'

  ];


  for(const type of types){

    if(
      MediaRecorder.isTypeSupported(
        type
      )
    ){

      return type;
    }
  }


  return "";
}



function makeImpulse(
  context,
  seconds,
  decay
){

  const rate =
    context.sampleRate;


  const length =
    rate * seconds;


  const impulse =
    context.createBuffer(
      2,
      length,
      rate
    );


  for(
    let channel=0;
    channel<2;
    channel++
  ){

    const data =
      impulse.getChannelData(
        channel
      );


    for(
      let i=0;
      i<length;
      i++
    ){

      data[i] =
        (
          Math.random()*2-1
        )
        *
        Math.pow(
          1-i/length,
          decay
        );
    }
  }


  return impulse;
}



async function prepareAudio(){

  if(!audioContext){

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }


  await audioContext.resume();


  if(audioSource){
    return;
  }


  audioSource =
    audioContext.createMediaElementSource(
      sourceVideo
    );


  audioDestination =
    audioContext.createMediaStreamDestination();


  const dry =
    audioContext.createGain();

  dry.gain.value =
    0.60;


  const wet =
    audioContext.createGain();

  wet.gain.value =
    0.32;


  const lowpass =
    audioContext.createBiquadFilter();

  lowpass.type =
    "lowpass";

  lowpass.frequency.value =
    4200;


  const delay =
    audioContext.createDelay();

  delay.delayTime.value =
    0.055;


  const convolver =
    audioContext.createConvolver();

  convolver.buffer =
    makeImpulse(
      audioContext,
      1.55,
      2.7
    );


  audioSource.connect(
    lowpass
  );


  lowpass.connect(
    dry
  );


  dry.connect(
    audioDestination
  );


  lowpass.connect(
    delay
  );


  delay.connect(
    convolver
  );


  convolver.connect(
    wet
  );


  wet.connect(
    audioDestination
  );


  dry.connect(
    audioContext.destination
  );


  wet.connect(
    audioContext.destination
  );
}



/*
動画をクロップしながら
全面に表示
*/
function drawVideoCover(
  targetCtx,
  video,
  width,
  height,
  extraScale = 1
){

  const videoRatio =
    video.videoWidth /
    video.videoHeight;


  const targetRatio =
    width /
    height;


  let sourceX = 0;
  let sourceY = 0;

  let sourceW =
    video.videoWidth;

  let sourceH =
    video.videoHeight;


  if(videoRatio > targetRatio){

    sourceW =
      video.videoHeight *
      targetRatio;


    sourceX =
      (
        video.videoWidth -
        sourceW
      ) / 2;

  }else{

    sourceH =
      video.videoWidth /
      targetRatio;


    sourceY =
      (
        video.videoHeight -
        sourceH
      ) / 2;
  }


  const dw =
    width *
    extraScale;


  const dh =
    height *
    extraScale;


  const dx =
    (width-dw)/2;


  const dy =
    (height-dh)/2;


  targetCtx.drawImage(
    video,

    sourceX,
    sourceY,
    sourceW,
    sourceH,

    dx,
    dy,
    dw,
    dh
  );
}



/*
映画館のスクリーン画像を作る
*/
function renderScreen(
  time
){

  const w =
    screenCanvas.width;


  const h =
    screenCanvas.height;


  screenCtx.clearRect(
    0,
    0,
    w,
    h
  );


  blurCtx.clearRect(
    0,
    0,
    w,
    h
  );


  bloomCtx.clearRect(
    0,
    0,
    w,
    h
  );


  colorCtx.clearRect(
    0,
    0,
    w,
    h
  );



  /*
  ピントがかなり外れている。

  今回は15〜29px。
  */

  const focusA =
    (
      Math.sin(
        time * 0.38
      ) + 1
    ) / 2;


  const focusB =
    (
      Math.sin(
        time * 0.14 + 2.1
      ) + 1
    ) / 2;


  const blur =
    15 +
    focusA * 9 +
    focusB * 5;



  /*
  明るさもゆっくり暴れる
  */

  const brightness =
    108 +
    Math.sin(
      time * 0.62
    ) * 8 +
    Math.sin(
      time * 3.7
    ) * 3;



  /*
  ベース映像
  */

  blurCtx.save();


  blurCtx.filter =
    `
    brightness(${brightness}%)
    contrast(79%)
    saturate(64%)
    blur(${blur}px)
    `;


  drawVideoCover(
    blurCtx,
    sourceVideo,
    w,
    h,
    1.06
  );


  blurCtx.restore();



  /*
  Haze（ヘイズ）
  白い霞
  */

  blurCtx.save();


  const haze =
    blurCtx.createLinearGradient(
      0,
      0,
      w,
      h
    );


  haze.addColorStop(
    0,
    "rgba(210,220,230,0.10)"
  );


  haze.addColorStop(
    0.45,
    "rgba(235,235,225,0.16)"
  );


  haze.addColorStop(
    1,
    "rgba(180,200,215,0.08)"
  );


  blurCtx.fillStyle =
    haze;


  blurCtx.fillRect(
    0,
    0,
    w,
    h
  );


  blurCtx.restore();



  /*
  第一Bloom
  */

  bloomCtx.save();


  bloomCtx.filter =
    "brightness(190%) blur(32px)";


  drawVideoCover(
    bloomCtx,
    sourceVideo,
    w,
    h,
    1.08
  );


  bloomCtx.restore();



  /*
  第二Bloom
  */

  bloomCtx.save();


  bloomCtx.globalAlpha =
    0.55;


  bloomCtx.filter =
    "brightness(260%) blur(62px)";


  drawVideoCover(
    bloomCtx,
    sourceVideo,
    w,
    h,
    1.10
  );


  bloomCtx.restore();



  /*
  ベース
  */

  screenCtx.drawImage(
    blurCanvas,
    0,
    0
  );



  /*
  Bloomを加算
  */

  screenCtx.save();


  screenCtx.globalCompositeOperation =
    "screen";


  screenCtx.globalAlpha =
    0.44;


  screenCtx.drawImage(
    bloomCanvas,
    0,
    0
  );


  screenCtx.restore();



  /*
  色収差

  赤と青を数pxずらす。
  かなり弱く。
  */

  colorCtx.save();


  colorCtx.globalCompositeOperation =
    "source-over";


  colorCtx.globalAlpha =
    0.11;


  colorCtx.filter =
    "sepia(100%) saturate(500%) hue-rotate(-35deg)";


  colorCtx.drawImage(
    blurCanvas,
    4,
    1
  );


  colorCtx.restore();


  colorCtx.save();


  colorCtx.globalCompositeOperation =
    "screen";


  colorCtx.globalAlpha =
    0.08;


  colorCtx.filter =
    "sepia(100%) saturate(500%) hue-rotate(170deg)";


  colorCtx.drawImage(
    blurCanvas,
    -4,
    -1
  );


  colorCtx.restore();


  screenCtx.save();


  screenCtx.globalCompositeOperation =
    "screen";


  screenCtx.drawImage(
    colorCanvas,
    0,
    0
  );


  screenCtx.restore();



  /*
  画面全体に白っぽい膜
  */

  screenCtx.save();


  screenCtx.fillStyle =
    "rgba(215,220,215,0.095)";


  screenCtx.fillRect(
    0,
    0,
    w,
    h
  );


  screenCtx.restore();



  /*
  スクリーンの端を
  極端にぼかして消す
  */

  screenCtx.save();


  screenCtx.globalCompositeOperation =
    "destination-in";


  screenCtx.filter =
    "blur(38px)";


  screenCtx.fillStyle =
    "white";


  screenCtx.fillRect(
    46,
    40,
    w-92,
    h-80
  );


  screenCtx.restore();
}



/*
映画館の一枚を作る
*/
function buildScene(
  time
){

  const w =
    sceneCanvas.width;


  const h =
    sceneCanvas.height;


  sceneCtx.clearRect(
    0,
    0,
    w,
    h
  );


  /*
  完全な黒ではなく
  暗いグレー
  */

  sceneCtx.fillStyle =
    "rgb(5,6,7)";


  sceneCtx.fillRect(
    0,
    0,
    w,
    h
  );


  renderScreen(
    time
  );



  /*
  スクリーン外へ漏れる
  光
  */

  const roomGlow =
    sceneCtx.createRadialGradient(

      w*0.52,
      h*0.47,
      w*0.10,

      w*0.52,
      h*0.50,
      w*0.95
    );


  roomGlow.addColorStop(
    0,
    "rgba(135,150,165,0.16)"
  );


  roomGlow.addColorStop(
    0.38,
    "rgba(85,95,105,0.075)"
  );


  roomGlow.addColorStop(
    0.72,
    "rgba(35,40,45,0.035)"
  );


  roomGlow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  sceneCtx.fillStyle =
    roomGlow;


  sceneCtx.fillRect(
    0,
    0,
    w,
    h
  );



  /*
  斜めスクリーン

  端は完全に画面外へ。
  */

  sceneCtx.save();


  sceneCtx.translate(
    w*0.51,
    h*0.48
  );


  sceneCtx.rotate(
    -0.048
  );


  sceneCtx.transform(
    1,
    -0.022,
    0.115,
    1,
    0,
    0
  );


  const screenWidth =
    w * 1.46;


  const screenHeight =
    h * 1.18;



  /*
  超大型Glow
  */

  sceneCtx.save();


  sceneCtx.globalAlpha =
    0.26;


  sceneCtx.filter =
    "blur(65px) brightness(175%)";


  sceneCtx.drawImage(
    screenCanvas,

    -screenWidth/2,

    -screenHeight/2,

    screenWidth,

    screenHeight
  );


  sceneCtx.restore();



  /*
  メインスクリーン
  */

  sceneCtx.save();


  sceneCtx.filter =
    "blur(7px)";


  sceneCtx.drawImage(
    screenCanvas,

    -screenWidth/2,

    -screenHeight/2,

    screenWidth,

    screenHeight
  );


  sceneCtx.restore();


  sceneCtx.restore();



  /*
  レンズの霞
  */

  sceneCtx.save();


  const lensHaze =
    sceneCtx.createLinearGradient(
      0,
      0,
      w,
      h
    );


  lensHaze.addColorStop(
    0,
    "rgba(160,175,190,0.055)"
  );


  lensHaze.addColorStop(
    0.5,
    "rgba(220,220,205,0.075)"
  );


  lensHaze.addColorStop(
    1,
    "rgba(120,140,160,0.035)"
  );


  sceneCtx.fillStyle =
    lensHaze;


  sceneCtx.fillRect(
    0,
    0,
    w,
    h
  );


  sceneCtx.restore();



  /*
  周辺減光
  */

  const vignette =
    sceneCtx.createRadialGradient(

      w*0.52,
      h*0.47,
      w*0.27,

      w*0.52,
      h*0.50,
      w*0.87
    );


  vignette.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );


  vignette.addColorStop(
    0.68,
    "rgba(0,0,0,0.10)"
  );


  vignette.addColorStop(
    1,
    "rgba(0,0,0,0.76)"
  );


  sceneCtx.fillStyle =
    vignette;


  sceneCtx.fillRect(
    0,
    0,
    w,
    h
  );
}



/*
カメラ本体の手ブレ
*/
function drawCamera(
  time
){

  const w =
    canvas.width;


  const h =
    canvas.height;



  const microX =
    Math.sin(
      time*8.3
    ) * 2.5
    +
    Math.sin(
      time*16.9
    ) * 1.0;


  const microY =
    Math.cos(
      time*7.1
    ) * 2.0
    +
    Math.sin(
      time*13.5
    ) * 0.9;


  const driftX =
    Math.sin(
      time*0.39
    ) * 6.5;


  const driftY =
    Math.cos(
      time*0.28
    ) * 4.2;


  const angle =
    Math.sin(
      time*0.63
    ) * 0.0062
    +
    Math.sin(
      time*2.8
    ) * 0.0018;



  /*
  ゆっくりズームが
  微妙に前後
  */

  const breathingZoom =
    1.055 +
    Math.sin(
      time*0.24
    ) * 0.008;



  ctx.fillStyle =
    "#000";


  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  ctx.save();


  ctx.translate(

    w/2 +
    microX +
    driftX,

    h/2 +
    microY +
    driftY

  );


  ctx.rotate(
    angle
  );


  ctx.scale(
    breathingZoom,
    breathingZoom
  );


  ctx.drawImage(

    sceneCanvas,

    -w/2,

    -h/2,

    w,

    h

  );


  ctx.restore();
}



processButton.addEventListener(
  "click",
  async function(){

    if(!selectedFile){
      return;
    }


    try{


      if(!window.MediaRecorder){

        throw new Error(
          "MediaRecorderに対応していません"
        );
      }


      if(!canvas.captureStream){

        throw new Error(
          "Canvas captureStreamに対応していません"
        );
      }


      processButton.disabled =
        true;


      sourceVideo.controls =
        false;


      resultArea.style.display =
        "none";


      progressWrap.style.display =
        "block";


      progressBar.style.width =
        "0%";


      progressText.textContent =
        "準備中";


      status.textContent =
        "動画加工の準備をしています。";


      await prepareAudio();


      sourceVideo.pause();


      sourceVideo.currentTime =
        0;


      await new Promise(
        resolve=>{

          if(
            sourceVideo.readyState >= 1
          ){

            resolve();

          }else{

            sourceVideo.onloadedmetadata =
              resolve;
          }
        }
      );


      const portrait =
        sourceVideo.videoHeight >
        sourceVideo.videoWidth;


      if(portrait){

        canvas.width =
          540;

        canvas.height =
          960;

      }else{

        canvas.width =
          960;

        canvas.height =
          540;
      }


      sceneCanvas.width =
        canvas.width;

      sceneCanvas.height =
        canvas.height;


      screenCanvas.width =
        canvas.width;

      screenCanvas.height =
        canvas.height;


      blurCanvas.width =
        canvas.width;

      blurCanvas.height =
        canvas.height;


      bloomCanvas.width =
        canvas.width;

      bloomCanvas.height =
        canvas.height;


      colorCanvas.width =
        canvas.width;

      colorCanvas.height =
        canvas.height;



      const canvasStream =
        canvas.captureStream(
          30
        );


      const finalStream =
        new MediaStream();


      canvasStream
        .getVideoTracks()
        .forEach(
          track=>
            finalStream.addTrack(
              track
            )
        );


      if(audioDestination){

        audioDestination.stream
          .getAudioTracks()
          .forEach(
            track=>
              finalStream.addTrack(
                track
              )
          );
      }


      const mimeType =
        chooseMimeType();


      const recorder =
        new MediaRecorder(

          finalStream,

          mimeType
          ?{
            mimeType,

            videoBitsPerSecond:
              4500000
          }
          :{
            videoBitsPerSecond:
              4500000
          }
        );


      const chunks =
        [];


      recorder.ondataavailable =
        event=>{

          if(
            event.data &&
            event.data.size>0
          ){

            chunks.push(
              event.data
            );
          }
        };


      recorder.onstop =
        ()=>{


          const actualType =
            recorder.mimeType ||
            mimeType ||
            "video/mp4";


          const blob =
            new Blob(
              chunks,
              {
                type:
                  actualType
              }
            );


          if(outputURL){

            URL.revokeObjectURL(
              outputURL
            );
          }


          outputURL =
            URL.createObjectURL(
              blob
            );


          resultVideo.src =
            outputURL;


          saveButton.href =
            outputURL;


          saveButton.download =
            actualType.includes(
              "mp4"
            )
            ? "movie-leak.mp4"
            : "movie-leak.webm";


          resultArea.style.display =
            "block";


          progressBar.style.width =
            "100%";


          progressText.textContent =
            "完成";


          status.textContent =
            "加工が完了しました。";


          processButton.disabled =
            false;


          sourceVideo.controls =
            true;
        };


      function drawFrame(){

        if(
          sourceVideo.paused ||
          sourceVideo.ended
        ){

          return;
        }


        const t =
          sourceVideo.currentTime;


        buildScene(
          t
        );


        drawCamera(
          t
        );


        if(
          sourceVideo.duration
        ){

          const percent =
            Math.min(
              100,
              Math.round(
                sourceVideo.currentTime /
                sourceVideo.duration *
                100
              )
            );


          progressBar.style.width =
            percent+"%";


          progressText.textContent =
            "加工中 "+percent+"%";
        }


        requestAnimationFrame(
          drawFrame
        );
      }


      sourceVideo.onended =
        ()=>{

          if(
            recorder.state !==
            "inactive"
          ){

            recorder.stop();
          }
        };


      status.textContent =
        "映画館スクリーンのピンぼけ・光漏れ・色ズレを強く加工しています。";


      recorder.start(
        500
      );


      await sourceVideo.play();


      requestAnimationFrame(
        drawFrame
      );


    }catch(error){


      console.error(
        error
      );


      processButton.disabled =
        false;


      sourceVideo.controls =
        true;


      progressText.textContent =
        "エラー";


      status.textContent =
        "エラー：" +
        error.message;
    }
  }
);

</script>

</body>
</html>
