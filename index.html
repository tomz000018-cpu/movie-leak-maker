<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>やめよう映画盗撮 | 盗撮流出風動画メーカー</title>

<style>

:root{--pink:#f50082;--ink:#151b29;--muted:#697386;--line:#e8eaf1;--bg:#fafafd}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif}

main{width:min(100%,620px);margin:0 auto;padding:20px 13px 56px}

header{text-align:center;padding:12px 0 18px}

h1{font-size:clamp(27px,7.4vw,43px);font-weight:950;letter-spacing:-.07em;margin:5px 0 8px;line-height:1.22;white-space:nowrap}

h1 em{font-style:normal;color:var(--pink)}

.sub{font-size:clamp(12px,3.5vw,16px);font-weight:650;color:#5b6676}

.ver{font-size:11px;color:#9298a5;margin-top:8px}

.card{background:white;border:1px solid #edf0f4;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 4px 20px rgba(20,25,50,.035)}

.videoShell{background:#141519;border-radius:12px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;color:#a7acb6;font-weight:700;font-size:13px}

.videoShell video{width:100%;height:100%;object-fit:contain;display:block;background:#090a0c}

#sourceVideo{display:none}

#sourceVideo.loaded{display:block}

#videoPlaceholder{padding:20px;text-align:center;line-height:1.6}

.file-label,.make,.save{display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:14px;background:var(--pink);color:white;text-align:center;text-decoration:none;font-size:18px;font-weight:850;min-height:63px;width:100%;cursor:pointer}

.file-label{position:relative;overflow:hidden;margin-top:13px}

.file-label input{position:absolute;inset:0;width:100%;height:100%;opacity:.001;cursor:pointer;z-index:2}

.file-label svg,.make svg,.save svg{width:23px;height:23px;flex-shrink:0}

.file-note,.hint,.name{font-size:12px;color:var(--muted);line-height:1.65}

.file-note{text-align:center;margin:9px 0 0}

.name{text-align:center;margin-top:9px;overflow-wrap:anywhere}

#videoInputFallback{display:block;width:100%;margin:10px auto;color:#555;font-size:13px}

h2{font-size:18px;line-height:1.3;margin:0 0 8px;font-weight:850}

.hint{margin:0 0 10px}

.setting{margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}

.settingHeader{display:flex;justify-content:space-between;gap:10px;align-items:center;font-size:14px;font-weight:800}

#crowdText{color:var(--pink);font-size:13px;white-space:nowrap}

input[type=range]{width:100%;accent-color:var(--pink);touch-action:pan-y}

.sliderLabels{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}

#preview{display:none}

.clock{font-weight:900;font-size:21px;text-align:center;font-variant-numeric:tabular-nums;margin:12px 0 8px}

.seek{display:flex;align-items:center;gap:10px}

.seek input{min-width:0;flex:1}

.smallbtn{border:1px solid var(--line);background:white;border-radius:11px;color:var(--ink);font-size:13px;font-weight:700;padding:12px 8px;white-space:nowrap}

.choices{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:9px;margin:13px 0}

.choice{grid-column:span 2;position:relative;min-width:0}

.choice.wide{grid-column:span 3}

.choice input{position:absolute;opacity:0;width:1px;height:1px}

.choice span{display:flex;align-items:center;justify-content:center;gap:5px;border:1px solid var(--line);background:#fff;border-radius:999px;min-height:52px;padding:8px 3px;color:var(--ink);font-weight:800;font-size:clamp(11px,3.4vw,14px);white-space:nowrap;cursor:pointer}

.choice input:checked+span{color:white;background:var(--pink);border-color:var(--pink)}

.listHeader{display:flex;align-items:center;justify-content:space-between;gap:8px}

.listHeader h2{font-size:17px;margin:0}

.add{border:1.5px solid var(--pink);background:white;color:var(--pink);border-radius:11px;padding:11px 12px;font-size:13px;font-weight:850;white-space:nowrap}

.add:disabled,.make:disabled{opacity:.45}

#addNotice{color:#e10077;min-height:16px;font-size:12px;margin-top:6px}

#count{font-size:12px;color:var(--muted);margin:4px 0 10px}

.markerRow{display:flex;align-items:center;gap:12px;margin-top:7px;border:1px solid var(--line);border-radius:11px;padding:10px 9px;background:#fcfcff}

.markerRow:before{content:'⋮';font-size:18px;color:#b7bcc7}

.jump{background:transparent;border:0;color:var(--ink);font-size:15px;font-weight:850;font-variant-numeric:tabular-nums;padding:6px 0}

.type{flex:1;font-weight:700;font-size:14px}

.delete{border:0;background:#f5f5f8;color:#707887;border-radius:8px;padding:9px;font-size:12px}

.empty{color:var(--muted);font-size:13px;padding:14px 0}

.make{margin:16px 0;border-radius:999px;box-shadow:0 5px 13px rgba(245,0,130,.18);font-size:clamp(16px,4.7vw,20px)}

#progress,#result{display:none}

.barbg{height:11px;background:#f0f0f3;border-radius:9px;overflow:hidden;margin-top:10px}

.bar{height:100%;background:var(--pink);width:0%}

.progressText{font-size:12px;color:var(--muted);text-align:center;margin:8px}

.status{background:#f6f7fa;border-radius:10px;padding:12px;font-size:12px;line-height:1.6;color:#5f6978;white-space:pre-wrap}

#outVideo{width:100%;border-radius:11px;background:black;margin:10px 0;max-height:55vh}

.save{background:white;color:var(--pink);border:2px solid var(--pink);margin:9px 0}

.notice{text-align:center;font-size:11px;color:#969cab;line-height:1.8;margin-top:14px}

#work{display:none}

@media(max-width:370px){

.choice span{font-size:10px;gap:3px}

.card{padding:12px}

.smallbtn{font-size:11px}

.listHeader h2{font-size:15px}

}

@media(min-width:700px){

main{width:650px;padding-top:35px}

.choice span{font-size:14px}

}

</style>

</head>

<body>

<main>

<header>

<h1>やめよう<em>
