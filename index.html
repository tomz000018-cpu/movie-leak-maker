<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Leak Maker</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#080808;
  color:#fff;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

.container{
  width:min(92%,800px);
  margin:auto;
  padding:35px 0 80px;
}

h1{
  text-align:center;
  margin:0 0 8px;
  font-size:30px;
}

.subtitle{
  text-align:center;
  color:#aaa;
  line-height:1.6;
  margin-bottom:30px;
}

.panel{
  background:#161616;
  border:1px solid #333;
  border-radius:18px;
  padding:20px;
}

.file-label,
.process-button,
.save-button{
  display:block;
  width:100%;
  border:0;
  border-radius:12px;
  padding:16px;
  font-size:17px;
  font-weight:bold;
  text-align:center;
}

.file-label{
  background:#fff;
  color:#111;
}

#videoInput{
  display:none;
}

#fileName{
  margin-top:14px;
  text-align:center;
  color:#aaa;
  word-break:break-all;
}

.preview-area,
.result-area{
  display:none;
  margin-top:24px;
}

.screen{
  background:#000;
  padding:8px;
  border-radius:10px;
  overflow:hidden;
}

video{
  display:block;
  width:100%;
  max-height:65vh;
  background:#000;
}

#workCanvas{
  display:none;
}

.process-button{
  margin-top:20px;
  background:#f2f2f2;
  color:#111;
}

.process-button:disabled{
  background:#444;
  color:#999;
}

.save-button{
  margin-top:16px;
  background:#fff;
  color:#111;
  text-decoration:none;
}

.status{
  margin-top:18px;
  padding:14px;
  border-radius:10px;
  background:#101010;
  color:#ccc;
  line-height:1.6;
  font-size:14px;
}

.progress-wrap{
  display:none;
  margin-top:18px;
}

.progress-bg{
  height:12px;
  background:#333;
  border-radius:10px;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background:white;
}

.progress-text{
  margin-top:8px;
  text-align:center;
  color:#aaa;
  font-size:13px;
}

.notice{
  margin-top:25px;
  text-align:center;
  color:#777;
  font-size:12px;
  line-height:1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>Movie Leak Maker</h1>

<div class="subtitle">
普通の動画を<br>
「海外試写会の流出映像風」に加工します
</div>

<div class="panel">

<label class="file-label" for="videoInput">
動画を選ぶ
</label>

<input
  id="videoInput"
  type="file"
  accept="video/*"
>

<div id="fileName">
まだ動画は選択されていません
</div>

<div
  id="previewArea"
  class="preview-area"
>

<div class="screen">

<video
  id="sourceVideo"
  controls
  playsinline
></video>

</div>

<button
  id="processButton"
  class="process-button"
>
流出映像風に加工する
</button>

<div
  id="progressWrap"
  class="progress-wrap"
>

<div class="progress-bg">

<div
  id="progressBar"
  class="progress-bar"
></div>

</div>

<div
  id="progressText"
  class="progress-text"
>
準備中
</div>

</div>

<div
  id="status"
  class="status"
>
動画を選んでください。
</div>

</div>


<div
  id="resultArea"
  class="result-area"
>

<h2>完成動画</h2>

<div class="screen">

<video
  id="resultVideo"
  controls
  playsinline
></video>

</div>

<a
  id="saveButton"
  class="save-button"
>
完成動画を保存
</a>

</div>

</div>

<canvas id="workCanvas"></canvas>

<div class="notice">
動画はサーバーへ送信せず、この端末内で加工します。
</div>

</div>


<script>

const videoInput =
  document.getElementById("videoInput");

const sourceVideo =
  document.getElementById("sourceVideo");

const resultVideo =
  document.getElementById("resultVideo");

const previewArea =
  document.getElementById("previewArea");

const resultArea =
  document.getElementById("resultArea");

const processButton =
  document.getElementById("processButton");

const saveButton =
  document.getElementById("saveButton");

const fileName =
  document.getElementById("fileName");

const status =
  document.getElementById("status");

const progressWrap =
  document.getElementById("progressWrap");

const progressBar =
  document.getElementById("progressBar");

const progressText =
  document.getElementById("progressText");

const canvas =
  document.getElementById("workCanvas");

const ctx =
  canvas.getContext(
    "2d",
    {alpha:false}
  );


/*
映画館の一枚絵
*/
const sceneCanvas =
  document.createElement("canvas");

const sceneCtx =
  sceneCanvas.getContext("2d");


/*
スクリーン映像
*/
const screenCanvas =
  document.createElement("canvas");

const screenCtx =
  screenCanvas.getContext("2d");


/*
強い光の滲み
*/
const bloomCanvas =
  document.createElement("canvas");

const bloomCtx =
  bloomCanvas.getContext("2d");


let selectedFile = null;

let inputURL = null;

let outputURL = null;

let audioContext = null;

let audioSource = null;

let audioDestination = null;



videoInput.addEventListener(
  "change",
  event => {

    selectedFile =
      event.target.files[0];

    if(!selectedFile){
      return;
    }


    if(inputURL){

      URL.revokeObjectURL(
        inputURL
      );
    }


    inputURL =
      URL.createObjectURL(
        selectedFile
      );


    sourceVideo.src =
      inputURL;


    sourceVideo.load();


    fileName.textContent =
      selectedFile.name;


    previewArea.style.display =
      "block";


    resultArea.style.display =
      "none";


    status.textContent =
      "動画を読み込みました。";
  }
);



function chooseMimeType(){

  const types = [

    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',

    'video/mp4',

    'video/webm;codecs=vp9,opus',

    'video/webm;codecs=vp8,opus',

    'video/webm'

  ];


  for(const type of types){

    if(
      MediaRecorder.isTypeSupported(
        type
      )
    ){

      return type;
    }
  }


  return "";
}



function makeImpulse(
  context,
  seconds,
  decay
){

  const rate =
    context.sampleRate;


  const length =
    rate * seconds;


  const impulse =
    context.createBuffer(
      2,
      length,
      rate
    );


  for(
    let channel=0;
    channel<2;
    channel++
  ){

    const data =
      impulse.getChannelData(
        channel
      );


    for(
      let i=0;
      i<length;
      i++
    ){

      data[i] =
        (
          Math.random()*2-1
        )
        *
        Math.pow(
          1-i/length,
          decay
        );
    }
  }


  return impulse;
}



async function prepareAudio(){

  if(!audioContext){

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }


  await audioContext.resume();


  if(audioSource){
    return;
  }


  audioSource =
    audioContext.createMediaElementSource(
      sourceVideo
    );


  audioDestination =
    audioContext.createMediaStreamDestination();


  const dry =
    audioContext.createGain();


  dry.gain.value =
    0.68;


  const wet =
    audioContext.createGain();


  wet.gain.value =
    0.26;


  const lowpass =
    audioContext.createBiquadFilter();


  lowpass.type =
    "lowpass";


  lowpass.frequency.value =
    4500;


  const delay =
    audioContext.createDelay();


  delay.delayTime.value =
    0.045;


  const convolver =
    audioContext.createConvolver();


  convolver.buffer =
    makeImpulse(
      audioContext,
      1.4,
      2.9
    );


  audioSource.connect(
    lowpass
  );


  lowpass.connect(
    dry
  );


  dry.connect(
    audioDestination
  );


  lowpass.connect(
    delay
  );


  delay.connect(
    convolver
  );


  convolver.connect(
    wet
  );


  wet.connect(
    audioDestination
  );


  dry.connect(
    audioContext.destination
  );


  wet.connect(
    audioContext.destination
  );
}



/*
映像を画面いっぱいへ。

黒帯を作らず、
多少切れてもスクリーンを満たす。
*/
function drawVideoCover(
  targetCtx,
  video,
  width,
  height
){

  const videoRatio =
    video.videoWidth /
    video.videoHeight;


  const targetRatio =
    width /
    height;


  let sourceX = 0;
  let sourceY = 0;
  let sourceW =
    video.videoWidth;
  let sourceH =
    video.videoHeight;


  if(
    videoRatio >
    targetRatio
  ){

    sourceW =
      video.videoHeight *
      targetRatio;


    sourceX =
      (
        video.videoWidth -
        sourceW
      ) / 2;

  }else{

    sourceH =
      video.videoWidth /
      targetRatio;


    sourceY =
      (
        video.videoHeight -
        sourceH
      ) / 2;
  }


  targetCtx.drawImage(
    video,

    sourceX,
    sourceY,
    sourceW,
    sourceH,

    0,
    0,
    width,
    height
  );
}



/*
本物のピンぼけ映像を作る
*/
function renderOutOfFocusScreen(
  time
){

  const w =
    screenCanvas.width;


  const h =
    screenCanvas.height;


  screenCtx.clearRect(
    0,
    0,
    w,
    h
  );


  /*
  ピントが数秒かけて
  ゆっくり呼吸する
  */

  const focus1 =
    (
      Math.sin(
        time * 0.43
      ) + 1
    ) / 2;


  const focus2 =
    (
      Math.sin(
        time * 0.17 + 1.8
      ) + 1
    ) / 2;


  /*
  今回はかなり強い。

  約12〜22px。
  */

  const blurAmount =
    12 +
    focus1 * 7 +
    focus2 * 3;


  const brightness =
    97 +
    Math.sin(
      time * 0.77
    ) * 5 +
    Math.sin(
      time * 4.1
    ) * 2;


  /*
  メイン映像
  */

  screenCtx.save();


  screenCtx.filter =
    `
    brightness(${brightness}%)
    contrast(84%)
    saturate(67%)
    blur(${blurAmount}px)
    `;


  drawVideoCover(
    screenCtx,
    sourceVideo,
    w,
    h
  );


  screenCtx.restore();



  /*
  第一Bloom
  */

  bloomCtx.clearRect(
    0,
    0,
    w,
    h
  );


  bloomCtx.save();


  bloomCtx.filter =
    "brightness(175%) blur(28px)";


  drawVideoCover(
    bloomCtx,
    sourceVideo,
    w,
    h
  );


  bloomCtx.restore();


  screenCtx.save();


  screenCtx.globalCompositeOperation =
    "screen";


  screenCtx.globalAlpha =
    0.42;


  screenCtx.drawImage(
    bloomCanvas,
    0,
    0
  );


  screenCtx.restore();



  /*
  第二Bloom
  白い部分をさらに大きく滲ませる
  */

  bloomCtx.clearRect(
    0,
    0,
    w,
    h
  );


  bloomCtx.save();


  bloomCtx.filter =
    "brightness(230%) blur(52px)";


  drawVideoCover(
    bloomCtx,
    sourceVideo,
    w,
    h
  );


  bloomCtx.restore();


  screenCtx.save();


  screenCtx.globalCompositeOperation =
    "screen";


  screenCtx.globalAlpha =
    0.15;


  screenCtx.drawImage(
    bloomCanvas,
    0,
    0
  );


  screenCtx.restore();



  /*
  スクリーンの縁そのものを
  フェザー処理。

  黒との境目をくっきり残さない。
  */

  screenCtx.save();


  screenCtx.globalCompositeOperation =
    "destination-in";


  screenCtx.filter =
    "blur(26px)";


  screenCtx.fillStyle =
    "rgba(255,255,255,1)";


  screenCtx.fillRect(
    28,
    28,
    w-56,
    h-56
  );


  screenCtx.restore();
}



/*
映画館空間を作る
*/
function buildCinemaScene(
  time
){

  const w =
    sceneCanvas.width;


  const h =
    sceneCanvas.height;


  sceneCtx.clearRect(
    0,
    0,
    w,
    h
  );


  sceneCtx.fillStyle =
    "#000";


  sceneCtx.fillRect(
    0,
    0,
    w,
    h
  );


  renderOutOfFocusScreen(
    time
  );



  /*
  スクリーンから周囲の闇へ漏れる光
  */

  const roomGlow =
    sceneCtx.createRadialGradient(

      w * 0.53,
      h * 0.49,
      w * 0.16,

      w * 0.53,
      h * 0.49,
      w * 0.90
    );


  roomGlow.addColorStop(
    0,
    "rgba(130,145,160,0.10)"
  );


  roomGlow.addColorStop(
    0.44,
    "rgba(65,72,80,0.055)"
  );


  roomGlow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  sceneCtx.fillStyle =
    roomGlow;


  sceneCtx.fillRect(
    0,
    0,
    w,
    h
  );



  /*
  スクリーン本体。

  前回よりかなり大きくする。

  左右端は原則として
  撮影フレーム外へ追い出す。
  */

  sceneCtx.save();


  sceneCtx.translate(
    w * 0.51,
    h * 0.48
  );


  /*
  映画館の座席から
  少し斜めに撮影
  */

  sceneCtx.rotate(
    -0.045
  );


  sceneCtx.transform(

    1,

    -0.025,

    0.10,

    1,

    0,

    0
  );


  /*
  大胆にOverscan
  */

  const screenWidth =
    w * 1.34;


  const screenHeight =
    h * 1.11;



  /*
  スクリーン周囲の
  巨大な光の滲み
  */

  sceneCtx.save();


  sceneCtx.globalAlpha =
    0.30;


  sceneCtx.filter =
    "blur(45px) brightness(150%)";


  sceneCtx.drawImage(

    screenCanvas,

    -screenWidth / 2,

    -screenHeight / 2,

    screenWidth,

    screenHeight
  );


  sceneCtx.restore();



  /*
  本体も最後にさらにぼかす。

  これでスクリーン境界も
  光学的に柔らかくする。
  */

  sceneCtx.save();


  sceneCtx.filter =
    "blur(5px)";


  sceneCtx.drawImage(

    screenCanvas,

    -screenWidth / 2,

    -screenHeight / 2,

    screenWidth,

    screenHeight
  );


  sceneCtx.restore();


  sceneCtx.restore();



  /*
  周辺減光
  */

  const vignette =
    sceneCtx.createRadialGradient(

      w * 0.52,
      h * 0.46,
      w * 0.28,

      w * 0.52,
      h * 0.49,
      w * 0.86
    );


  vignette.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );


  vignette.addColorStop(
    0.67,
    "rgba(0,0,0,0.11)"
  );


  vignette.addColorStop(
    1,
    "rgba(0,0,0,0.80)"
  );


  sceneCtx.fillStyle =
    vignette;


  sceneCtx.fillRect(
    0,
    0,
    w,
    h
  );
}



/*
自然なカメラ手ブレ
*/
function drawFinalCamera(
  time
){

  const w =
    canvas.width;


  const h =
    canvas.height;


  /*
  微細な震え
  */

  const microX =
    Math.sin(
      time * 8.1
    ) * 2.2 +
    Math.sin(
      time * 16.4
    ) * 0.9;


  const microY =
    Math.cos(
      time * 7.0
    ) * 1.9 +
    Math.sin(
      time * 13.7
    ) * 0.8;


  /*
  手首のゆっくりしたズレ
  */

  const driftX =
    Math.sin(
      time * 0.42
    ) * 5.5;


  const driftY =
    Math.cos(
      time * 0.31
    ) * 3.8;


  /*
  わずかな傾き
  */

  const angle =
    Math.sin(
      time * 0.68
    ) * 0.0055 +
    Math.sin(
      time * 2.9
    ) * 0.0014;


  ctx.fillStyle =
    "#000";


  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  ctx.save();


  ctx.translate(

    w/2 +
    microX +
    driftX,

    h/2 +
    microY +
    driftY
  );


  ctx.rotate(
    angle
  );


  /*
  手ブレで黒い端が
  見えないように
  少しだけ拡大
  */

  ctx.scale(
    1.045,
    1.045
  );


  ctx.drawImage(

    sceneCanvas,

    -w/2,

    -h/2,

    w,

    h
  );


  ctx.restore();
}



processButton.addEventListener(
  "click",
  async function(){

    if(!selectedFile){
      return;
    }


    try{


      if(!window.MediaRecorder){

        throw new Error(
          "MediaRecorderに対応していません"
        );
      }


      if(!canvas.captureStream){

        throw new Error(
          "Canvas captureStreamに対応していません"
        );
      }


      processButton.disabled =
        true;


      sourceVideo.controls =
        false;


      resultArea.style.display =
        "none";


      progressWrap.style.display =
        "block";


      progressBar.style.width =
        "0%";


      progressText.textContent =
        "準備中";


      status.textContent =
        "動画加工の準備をしています。";


      await prepareAudio();


      sourceVideo.pause();


      sourceVideo.currentTime =
        0;


      await new Promise(
        resolve=>{

          if(
            sourceVideo.readyState >= 1
          ){

            resolve();

          }else{

            sourceVideo.onloadedmetadata =
              resolve;
          }
        }
      );


      const portrait =
        sourceVideo.videoHeight >
        sourceVideo.videoWidth;


      if(portrait){

        canvas.width =
          540;

        canvas.height =
          960;

      }else{

        canvas.width =
          960;

        canvas.height =
          540;
      }


      sceneCanvas.width =
        canvas.width;


      sceneCanvas.height =
        canvas.height;


      screenCanvas.width =
        canvas.width;


      screenCanvas.height =
        canvas.height;


      bloomCanvas.width =
        canvas.width;


      bloomCanvas.height =
        canvas.height;


      const canvasStream =
        canvas.captureStream(
          30
        );


      const finalStream =
        new MediaStream();


      canvasStream
        .getVideoTracks()
        .forEach(
          track=>
            finalStream.addTrack(
              track
            )
        );


      if(audioDestination){

        audioDestination.stream
          .getAudioTracks()
          .forEach(
            track=>
              finalStream.addTrack(
                track
              )
          );
      }


      const mimeType =
        chooseMimeType();


      const recorder =
        new MediaRecorder(

          finalStream,

          mimeType
          ?{
            mimeType,
            videoBitsPerSecond:
              4200000
          }
          :{
            videoBitsPerSecond:
              4200000
          }
        );


      const chunks =
        [];


      recorder.ondataavailable =
        event=>{

          if(
            event.data &&
            event.data.size>0
          ){

            chunks.push(
              event.data
            );
          }
        };


      recorder.onstop =
        ()=>{


          const actualType =
            recorder.mimeType ||
            mimeType ||
            "video/mp4";


          const blob =
            new Blob(
              chunks,
              {
                type:
                  actualType
              }
            );


          if(outputURL){

            URL.revokeObjectURL(
              outputURL
            );
          }


          outputURL =
            URL.createObjectURL(
              blob
            );


          resultVideo.src =
            outputURL;


          saveButton.href =
            outputURL;


          saveButton.download =
            actualType.includes(
              "mp4"
            )
            ? "movie-leak.mp4"
            : "movie-leak.webm";


          resultArea.style.display =
            "block";


          progressBar.style.width =
            "100%";


          progressText.textContent =
            "完成";


          status.textContent =
            "加工が完了しました。";


          processButton.disabled =
            false;


          sourceVideo.controls =
            true;
        };


      function drawFrame(){

        if(
          sourceVideo.paused ||
          sourceVideo.ended
        ){

          return;
        }


        const t =
          sourceVideo.currentTime;


        buildCinemaScene(
          t
        );


        drawFinalCamera(
          t
        );


        if(
          sourceVideo.duration
        ){

          const percent =
            Math.min(
              100,
              Math.round(
                sourceVideo.currentTime /
                sourceVideo.duration *
                100
              )
            );


          progressBar.style.width =
            percent+"%";


          progressText.textContent =
            "加工中 "+percent+"%";
        }


        requestAnimationFrame(
          drawFrame
        );
      }


      sourceVideo.onended =
        ()=>{

          if(
            recorder.state !==
            "inactive"
          ){

            recorder.stop();
          }
        };


      status.textContent =
        "強いピンぼけ・光のにじみ・手ブレを加えています。";


      recorder.start(
        500
      );


      await sourceVideo.play();


      requestAnimationFrame(
        drawFrame
      );


    }catch(error){


      console.error(
        error
      );


      processButton.disabled =
        false;


      sourceVideo.controls =
        true;


      progressText.textContent =
        "エラー";


      status.textContent =
        "エラー：" +
        error.message;
    }
  }
);

</script>

</body>
</html>
