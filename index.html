<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Leak Maker</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090909;
  color: white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

.container {
  width: min(92%, 800px);
  margin: auto;
  padding: 35px 0 80px;
}

h1 {
  text-align: center;
  margin: 0 0 8px;
  font-size: 30px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  line-height: 1.6;
  margin-bottom: 30px;
}

.panel {
  background: #161616;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 20px;
}

.file-label,
.process-button,
.save-button {
  display: block;
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
}

.file-label {
  background: white;
  color: #111;
}

#videoInput {
  display: none;
}

#fileName {
  margin-top: 14px;
  text-align: center;
  color: #aaa;
  word-break: break-all;
}

.preview-area,
.result-area {
  display: none;
  margin-top: 24px;
}

.screen {
  background: black;
  padding: 8px;
  border-radius: 10px;
  overflow: hidden;
}

video,
canvas {
  display: block;
  width: 100%;
  max-height: 65vh;
  background: black;
}

#workCanvas {
  display: none;
}

.process-button {
  margin-top: 20px;
  background: #f2f2f2;
  color: #111;
}

.process-button:disabled {
  background: #444;
  color: #999;
}

.save-button {
  margin-top: 16px;
  background: white;
  color: #111;
  text-decoration: none;
}

.status {
  margin-top: 18px;
  padding: 14px;
  border-radius: 10px;
  background: #101010;
  color: #ccc;
  line-height: 1.6;
  font-size: 14px;
}

.progress-wrap {
  display: none;
  margin-top: 18px;
}

.progress-bg {
  height: 12px;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: white;
}

.progress-text {
  margin-top: 8px;
  color: #aaa;
  text-align: center;
  font-size: 13px;
}

.notice {
  margin-top: 25px;
  text-align: center;
  color: #777;
  font-size: 12px;
  line-height: 1.6;
}

</style>
</head>

<body>

<div class="container">

<h1>Movie Leak Maker</h1>

<div class="subtitle">
普通の動画を<br>
「海外試写会の流出映像風」に加工します
</div>

<div class="panel">

<label class="file-label" for="videoInput">
動画を選ぶ
</label>

<input
  id="videoInput"
  type="file"
  accept="video/*"
>

<div id="fileName">
まだ動画は選択されていません
</div>


<div
  class="preview-area"
  id="previewArea"
>

<div class="screen">

<video
  id="sourceVideo"
  controls
  playsinline
></video>

</div>


<button
  id="processButton"
  class="process-button"
>
流出映像風に加工する
</button>


<div
  class="progress-wrap"
  id="progressWrap"
>

<div class="progress-bg">

<div
  class="progress-bar"
  id="progressBar"
></div>

</div>

<div
  class="progress-text"
  id="progressText"
>
準備中
</div>

</div>


<div
  class="status"
  id="status"
>
動画を選んでください。
</div>

</div>


<div
  class="result-area"
  id="resultArea"
>

<h2>
完成動画
</h2>

<div class="screen">

<video
  id="resultVideo"
  controls
  playsinline
></video>

</div>


<a
  id="saveButton"
  class="save-button"
>
完成動画を保存
</a>

</div>

</div>


<canvas id="workCanvas"></canvas>


<div class="notice">
動画はサーバーへ送信せず、
この端末の中で加工します。
</div>

</div>


<script>

const videoInput =
  document.getElementById("videoInput");

const sourceVideo =
  document.getElementById("sourceVideo");

const resultVideo =
  document.getElementById("resultVideo");

const previewArea =
  document.getElementById("previewArea");

const resultArea =
  document.getElementById("resultArea");

const processButton =
  document.getElementById("processButton");

const saveButton =
  document.getElementById("saveButton");

const fileName =
  document.getElementById("fileName");

const status =
  document.getElementById("status");

const progressWrap =
  document.getElementById("progressWrap");

const progressBar =
  document.getElementById("progressBar");

const progressText =
  document.getElementById("progressText");

const canvas =
  document.getElementById("workCanvas");

const ctx =
  canvas.getContext("2d");


let selectedFile = null;

let inputURL = null;

let outputURL = null;

let audioContext = null;

let audioSource = null;

let audioDestination = null;


videoInput.addEventListener(
  "change",
  function(event) {

    selectedFile =
      event.target.files[0];

    if (!selectedFile) {
      return;
    }


    if (inputURL) {
      URL.revokeObjectURL(inputURL);
    }

    inputURL =
      URL.createObjectURL(selectedFile);

    sourceVideo.src =
      inputURL;

    sourceVideo.load();

    fileName.textContent =
      selectedFile.name;

    previewArea.style.display =
      "block";

    resultArea.style.display =
      "none";

    status.textContent =
      "動画を読み込みました。";

  }
);


function chooseMimeType() {

  const types = [

    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',

    'video/mp4',

    'video/webm;codecs=vp9,opus',

    'video/webm;codecs=vp8,opus',

    'video/webm'

  ];


  for (const type of types) {

    if (
      MediaRecorder.isTypeSupported(type)
    ) {

      return type;

    }

  }


  return "";

}


async function prepareAudio() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  await audioContext.resume();


  if (!audioSource) {

    audioSource =
      audioContext.createMediaElementSource(
        sourceVideo
      );


    audioDestination =
      audioContext.createMediaStreamDestination();


    audioSource.connect(
      audioDestination
    );


    audioSource.connect(
      audioContext.destination
    );

  }

}


processButton.addEventListener(
  "click",
  async function() {

    if (!selectedFile) {
      return;
    }


    try {


      if (
        !window.MediaRecorder
      ) {

        throw new Error(
          "MediaRecorderに対応していません"
        );

      }


      if (
        !canvas.captureStream
      ) {

        throw new Error(
          "Canvas captureStreamに対応していません"
        );

      }


      processButton.disabled =
        true;

      sourceVideo.controls =
        false;

      resultArea.style.display =
        "none";

      progressWrap.style.display =
        "block";

      progressBar.style.width =
        "0%";

      progressText.textContent =
        "準備中";

      status.textContent =
        "動画加工の準備をしています。";


      await prepareAudio();


      sourceVideo.pause();

      sourceVideo.currentTime =
        0;


      await new Promise(resolve => {

        if (
          sourceVideo.readyState >= 1
        ) {

          resolve();

        }

        else {

          sourceVideo.onloadedmetadata =
            resolve;

        }

      });


      const originalWidth =
        sourceVideo.videoWidth;

      const originalHeight =
        sourceVideo.videoHeight;


      let outputWidth =
        originalWidth;

      let outputHeight =
        originalHeight;


      if (outputWidth > 720) {

        const ratio =
          720 / outputWidth;

        outputWidth =
          720;

        outputHeight =
          Math.round(
            outputHeight * ratio
          );

      }


      outputWidth =
        Math.floor(
          outputWidth / 2
        ) * 2;

      outputHeight =
        Math.floor(
          outputHeight / 2
        ) * 2;


      canvas.width =
        outputWidth;

      canvas.height =
        outputHeight;


      const canvasStream =
        canvas.captureStream(30);


      const finalStream =
        new MediaStream();


      canvasStream
        .getVideoTracks()
        .forEach(track => {

          finalStream.addTrack(track);

        });


      if (audioDestination) {

        audioDestination.stream
          .getAudioTracks()
          .forEach(track => {

            finalStream.addTrack(track);

          });

      }


      const mimeType =
        chooseMimeType();


      const recorderOptions =
        mimeType
        ? {
            mimeType: mimeType,
            videoBitsPerSecond:
              3500000
          }
        : {
            videoBitsPerSecond:
              3500000
          };


      const recorder =
        new MediaRecorder(
          finalStream,
          recorderOptions
        );


      const chunks =
        [];


      recorder.ondataavailable =
        function(event) {

          if (
            event.data &&
            event.data.size > 0
          ) {

            chunks.push(
              event.data
            );

          }

        };


      recorder.onerror =
        function(event) {

          console.error(
            event
          );

        };


      recorder.onstop =
        function() {


          const actualType =
            recorder.mimeType ||
            mimeType ||
            "video/mp4";


          const blob =
            new Blob(
              chunks,
              {
                type: actualType
              }
            );


          if (outputURL) {

            URL.revokeObjectURL(
              outputURL
            );

          }


          outputURL =
            URL.createObjectURL(
              blob
            );


          resultVideo.src =
            outputURL;


          const isMP4 =
            actualType.includes(
              "mp4"
            );


          saveButton.href =
            outputURL;


          saveButton.download =
            isMP4
              ? "movie-leak.mp4"
              : "movie-leak.webm";


          resultArea.style.display =
            "block";


          progressBar.style.width =
            "100%";


          progressText.textContent =
            "完成";


          status.textContent =
            "加工が完了しました。";


          processButton.disabled =
            false;


          sourceVideo.controls =
            true;

        };


      function drawFrame() {


        if (
          sourceVideo.paused ||
          sourceVideo.ended
        ) {

          return;

        }


        const t =
          sourceVideo.currentTime;


        const shakeX =
          Math.sin(
            t * 7.3
          ) * 2.5
          +
          Math.sin(
            t * 2.1
          ) * 1.5;


        const shakeY =
          Math.cos(
            t * 5.7
          ) * 2.0;


        const angle =
          Math.sin(
            t * 1.8
          ) * 0.004;


        ctx.save();


        ctx.fillStyle =
          "black";


        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        ctx.translate(
          canvas.width / 2
          + shakeX,

          canvas.height / 2
          + shakeY
        );


        ctx.rotate(
          angle
        );


        ctx.scale(
          1.035,
          1.035
        );


        ctx.filter =
          "brightness(82%) " +
          "contrast(90%) " +
          "saturate(72%) " +
          "blur(0.7px)";


        ctx.drawImage(
          sourceVideo,

          -canvas.width / 2,

          -canvas.height / 2,

          canvas.width,

          canvas.height
        );


        ctx.restore();


        /*
        暗い映画館で撮ったような
        周辺減光
        */

        const gradient =
          ctx.createRadialGradient(

            canvas.width / 2,
            canvas.height / 2,
            canvas.width * 0.15,

            canvas.width / 2,
            canvas.height / 2,
            canvas.width * 0.75

          );


        gradient.addColorStop(
          0,
          "rgba(0,0,0,0)"
        );


        gradient.addColorStop(
          1,
          "rgba(0,0,0,0.30)"
        );


        ctx.fillStyle =
          gradient;


        ctx.fillRect(
          0,
          0,
          canvas.width,
          canvas.height
        );


        if (
          sourceVideo.duration
        ) {

          const percent =
            Math.min(
              100,
              Math.round(
                sourceVideo.currentTime /
                sourceVideo.duration *
                100
              )
            );


          progressBar.style.width =
            percent + "%";


          progressText.textContent =
            "加工中 " +
            percent +
            "%";

        }


        requestAnimationFrame(
          drawFrame
        );

      }


      sourceVideo.onended =
        function() {

          if (
            recorder.state !==
            "inactive"
          ) {

            recorder.stop();

          }

        };


      status.textContent =
        "加工しています。動画の長さとほぼ同じ時間かかります。";


      recorder.start(500);


      await sourceVideo.play();


      requestAnimationFrame(
        drawFrame
      );


    }

    catch(error) {


      console.error(
        error
      );


      processButton.disabled =
        false;


      sourceVideo.controls =
        true;


      progressText.textContent =
        "エラー";


      status.textContent =
        "エラー：" +
        error.message;

    }

  }
);

</script>

</body>
</html>
