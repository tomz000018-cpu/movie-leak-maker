<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Leak Maker</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
}

.container {
  width: min(92%, 800px);
  margin: auto;
  padding: 35px 0 80px;
}

h1 {
  text-align: center;
  margin: 0 0 8px;
  font-size: 30px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  line-height: 1.6;
  margin-bottom: 30px;
}

.panel {
  background: #161616;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 20px;
}

.file-label,
.process-button,
.save-button {
  display: block;
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
}

.file-label {
  background: white;
  color: #111;
}

#videoInput {
  display: none;
}

#fileName {
  margin-top: 14px;
  text-align: center;
  color: #aaa;
  word-break: break-all;
}

.preview-area,
.result-area {
  display: none;
  margin-top: 24px;
}

.screen {
  background: black;
  padding: 8px;
  border-radius: 10px;
  overflow: hidden;
}

video {
  display: block;
  width: 100%;
  max-height: 65vh;
  background: black;
}

#workCanvas {
  display: none;
}

.process-button {
  margin-top: 20px;
  background: #f2f2f2;
  color: #111;
}

.process-button:disabled {
  background: #444;
  color: #999;
}

.save-button {
  margin-top: 16px;
  background: white;
  color: #111;
  text-decoration: none;
}

.status {
  margin-top: 18px;
  padding: 14px;
  border-radius: 10px;
  background: #101010;
  color: #ccc;
  line-height: 1.6;
  font-size: 14px;
}

.progress-wrap {
  display: none;
  margin-top: 18px;
}

.progress-bg {
  height: 12px;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: white;
}

.progress-text {
  margin-top: 8px;
  color: #aaa;
  text-align: center;
  font-size: 13px;
}

.notice {
  margin-top: 25px;
  text-align: center;
  color: #777;
  font-size: 12px;
  line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">

<h1>Movie Leak Maker</h1>

<div class="subtitle">
普通の動画を<br>
「海外試写会の流出映像風」に加工します
</div>

<div class="panel">

<label class="file-label" for="videoInput">
動画を選ぶ
</label>

<input id="videoInput" type="file" accept="video/*">

<div id="fileName">
まだ動画は選択されていません
</div>

<div class="preview-area" id="previewArea">

<div class="screen">
<video id="sourceVideo" controls playsinline></video>
</div>

<button id="processButton" class="process-button">
流出映像風に加工する
</button>

<div class="progress-wrap" id="progressWrap">

<div class="progress-bg">
<div class="progress-bar" id="progressBar"></div>
</div>

<div class="progress-text" id="progressText">
準備中
</div>

</div>

<div class="status" id="status">
動画を選んでください。
</div>

</div>

<div class="result-area" id="resultArea">

<h2>完成動画</h2>

<div class="screen">
<video id="resultVideo" controls playsinline></video>
</div>

<a id="saveButton" class="save-button">
完成動画を保存
</a>

</div>

</div>

<canvas id="workCanvas"></canvas>

<div class="notice">
動画はサーバーへ送信せず、この端末の中で加工します。
</div>

</div>


<script>

const videoInput = document.getElementById("videoInput");
const sourceVideo = document.getElementById("sourceVideo");
const resultVideo = document.getElementById("resultVideo");
const previewArea = document.getElementById("previewArea");
const resultArea = document.getElementById("resultArea");
const processButton = document.getElementById("processButton");
const saveButton = document.getElementById("saveButton");
const fileName = document.getElementById("fileName");
const status = document.getElementById("status");
const progressWrap = document.getElementById("progressWrap");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");

const canvas = document.getElementById("workCanvas");
const ctx = canvas.getContext("2d");

const tempCanvas = document.createElement("canvas");
const tempCtx = tempCanvas.getContext("2d");

let selectedFile = null;
let inputURL = null;
let outputURL = null;

let audioContext = null;
let audioSource = null;
let audioDestination = null;


videoInput.addEventListener("change", function(event) {

  selectedFile = event.target.files[0];

  if (!selectedFile) return;

  if (inputURL) {
    URL.revokeObjectURL(inputURL);
  }

  inputURL = URL.createObjectURL(selectedFile);

  sourceVideo.src = inputURL;
  sourceVideo.load();

  fileName.textContent = selectedFile.name;

  previewArea.style.display = "block";
  resultArea.style.display = "none";

  status.textContent = "動画を読み込みました。";
});


function chooseMimeType() {

  const types = [
    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
    'video/mp4',
    'video/webm;codecs=vp9,opus',
    'video/webm;codecs=vp8,opus',
    'video/webm'
  ];

  for (const type of types) {

    if (MediaRecorder.isTypeSupported(type)) {
      return type;
    }
  }

  return "";
}


function makeImpulse(context, seconds, decay) {

  const rate = context.sampleRate;
  const length = rate * seconds;

  const impulse = context.createBuffer(
    2,
    length,
    rate
  );

  for (let channel = 0; channel < 2; channel++) {

    const data =
      impulse.getChannelData(channel);

    for (let i = 0; i < length; i++) {

      data[i] =
        (Math.random() * 2 - 1) *
        Math.pow(
          1 - i / length,
          decay
        );
    }
  }

  return impulse;
}


async function prepareAudio() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }

  await audioContext.resume();

  if (!audioSource) {

    audioSource =
      audioContext.createMediaElementSource(
        sourceVideo
      );

    audioDestination =
      audioContext.createMediaStreamDestination();


    const dry =
      audioContext.createGain();

    dry.gain.value = 0.72;


    const wet =
      audioContext.createGain();

    wet.gain.value = 0.34;


    const convolver =
      audioContext.createConvolver();

    convolver.buffer =
      makeImpulse(
        audioContext,
        1.5,
        2.8
      );


    const delay =
      audioContext.createDelay();

    delay.delayTime.value = 0.055;


    const highCut =
      audioContext.createBiquadFilter();

    highCut.type = "lowpass";
    highCut.frequency.value = 5200;


    audioSource.connect(highCut);

    highCut.connect(dry);
    dry.connect(audioDestination);

    highCut.connect(delay);
    delay.connect(convolver);
    convolver.connect(wet);
    wet.connect(audioDestination);


    /*
    端末からも音を聞けるようにする
    */

    dry.connect(audioContext.destination);
    wet.connect(audioContext.destination);
  }
}


function lerp(a, b, t) {
  return a + (b - a) * t;
}


function drawCinemaBackground(w, h) {

  ctx.fillStyle = "#010101";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  /*
  スクリーンから客席に漏れる光
  */

  const glow =
    ctx.createRadialGradient(
      w * 0.52,
      h * 0.50,
      w * 0.10,

      w * 0.52,
      h * 0.60,
      w * 0.78
    );

  glow.addColorStop(
    0,
    "rgba(105,115,125,0.12)"
  );

  glow.addColorStop(
    0.55,
    "rgba(45,45,50,0.07)"
  );

  glow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );

  ctx.fillStyle = glow;

  ctx.fillRect(
    0,
    0,
    w,
    h
  );
}


function createScreenPoints(w, h, t) {

  /*
  小さい手ブレ
  */

  const shakeX =
    Math.sin(t * 7.2) * 2.8 +
    Math.sin(t * 15.6) * 1.2 +
    Math.sin(t * 2.0) * 3.5;

  const shakeY =
    Math.cos(t * 6.6) * 2.2 +
    Math.sin(t * 13.1) * 1.0;

  /*
  手で構えているため
  ゆっくり位置が流れる
  */

  const driftX =
    Math.sin(t * 0.48) * 5;

  const driftY =
    Math.cos(t * 0.39) * 3;


  /*
  前回より大きなスクリーン
  */

  return {

    TL: {
      x:
        w * 0.045 +
        shakeX +
        driftX,

      y:
        h * 0.115 +
        shakeY +
        driftY
    },

    TR: {
      x:
        w * 0.975 +
        shakeX +
        driftX,

      y:
        h * 0.035 +
        shakeY +
        driftY
    },

    BL: {
      x:
        w * 0.075 +
        shakeX +
        driftX,

      y:
        h * 0.835 +
        shakeY +
        driftY
    },

    BR: {
      x:
        w * 0.985 +
        shakeX +
        driftX,

      y:
        h * 0.755 +
        shakeY +
        driftY
    }

  };
}


function drawScreenGlow(points) {

  const {TL, TR, BL, BR} = points;

  ctx.save();

  ctx.shadowColor =
    "rgba(180,195,215,0.35)";

  ctx.shadowBlur = 30;

  ctx.fillStyle =
    "rgba(130,145,160,0.10)";

  ctx.beginPath();

  ctx.moveTo(TL.x, TL.y);
  ctx.lineTo(TR.x, TR.y);
  ctx.lineTo(BR.x, BR.y);
  ctx.lineTo(BL.x, BL.y);

  ctx.closePath();
  ctx.fill();

  ctx.restore();
}


function prepareUglyVideo(source, time) {

  /*
  解像度をわざと落とす
  */

  const landscape =
    source.videoWidth >=
    source.videoHeight;

  const tempWidth =
    landscape ? 320 : 210;

  const tempHeight =
    Math.max(
      2,
      Math.round(
        tempWidth *
        source.videoHeight /
        source.videoWidth
      )
    );

  tempCanvas.width = tempWidth;
  tempCanvas.height = tempHeight;


  /*
  ピントがずっと微妙に呼吸する
  */

  const blurAmount =
    2.2 +
    (
      Math.sin(time * 0.67) + 1
    ) * 0.75;


  /*
  スマホの自動露出が
  少し迷っている感じ
  */

  const brightness =
    72 +
    Math.sin(time * 4.8) * 4 +
    Math.sin(time * 1.1) * 2;


  tempCtx.clearRect(
    0,
    0,
    tempWidth,
    tempHeight
  );


  tempCtx.filter =
    "brightness(" +
    brightness +
    "%) " +

    "contrast(78%) " +

    "saturate(55%) " +

    "blur(" +
    blurAmount +
    "px)";


  tempCtx.drawImage(
    source,
    0,
    0,
    tempWidth,
    tempHeight
  );


  /*
  薄い霞
  */

  tempCtx.fillStyle =
    "rgba(200,210,215,0.045)";

  tempCtx.fillRect(
    0,
    0,
    tempWidth,
    tempHeight
  );
}


function drawWarpedVideo(source, w, h, time) {

  const points =
    createScreenPoints(
      w,
      h,
      time
    );

  const {TL, TR, BL, BR} = points;


  drawScreenGlow(points);

  prepareUglyVideo(
    source,
    time
  );


  /*
  台形からはみ出さないように
  クリップ
  */

  ctx.save();

  ctx.beginPath();

  ctx.moveTo(TL.x, TL.y);
  ctx.lineTo(TR.x, TR.y);
  ctx.lineTo(BR.x, BR.y);
  ctx.lineTo(BL.x, BL.y);

  ctx.closePath();
  ctx.clip();


  const strips = 150;


  for (
    let i = 0;
    i < strips;
    i++
  ) {

    const u1 =
      i / strips;

    const u2 =
      (i + 1) / strips;


    const topX1 =
      lerp(
        TL.x,
        TR.x,
        u1
      );

    const topX2 =
      lerp(
        TL.x,
        TR.x,
        u2
      );

    const bottomX1 =
      lerp(
        BL.x,
        BR.x,
        u1
      );

    const bottomX2 =
      lerp(
        BL.x,
        BR.x,
        u2
      );


    const topY1 =
      lerp(
        TL.y,
        TR.y,
        u1
      );

    const topY2 =
      lerp(
        TL.y,
        TR.y,
        u2
      );

    const bottomY1 =
      lerp(
        BL.y,
        BR.y,
        u1
      );

    const bottomY2 =
      lerp(
        BL.y,
        BR.y,
        u2
      );


    const destX =
      Math.min(
        topX1,
        bottomX1
      );

    const nextDestX =
      Math.max(
        topX2,
        bottomX2
      );


    const destY =
      (topY1 + topY2) / 2;

    const destBottom =
      (bottomY1 + bottomY2) / 2;


    const destW =
      Math.max(
        2,
        nextDestX -
        destX +
        3
      );

    const destH =
      destBottom -
      destY;


    const srcX =
      Math.floor(
        u1 *
        tempCanvas.width
      );


    const srcW =
      Math.max(
        1,
        Math.ceil(
          tempCanvas.width /
          strips
        ) + 1
      );


    ctx.drawImage(
      tempCanvas,

      srcX,
      0,
      srcW,
      tempCanvas.height,

      destX,
      destY,
      destW,
      destH
    );
  }


  /*
  スクリーンの白浮き
  */

  ctx.fillStyle =
    "rgba(210,220,225,0.045)";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  ctx.restore();


  /*
  スクリーンの縁を
  あえてシャープにしすぎない
  */

  ctx.save();

  ctx.strokeStyle =
    "rgba(150,160,170,0.08)";

  ctx.lineWidth = 7;

  ctx.filter =
    "blur(4px)";

  ctx.beginPath();

  ctx.moveTo(TL.x, TL.y);
  ctx.lineTo(TR.x, TR.y);
  ctx.lineTo(BR.x, BR.y);
  ctx.lineTo(BL.x, BL.y);

  ctx.closePath();
  ctx.stroke();

  ctx.restore();
}


function drawAudience(w, h, time) {

  /*
  客席をスクリーンへ少し重ねる。
  前回より明確に見える位置。
  */

  ctx.save();


  /*
  輪郭にスクリーンの反射光
  */

  ctx.shadowColor =
    "rgba(100,115,125,0.25)";

  ctx.shadowBlur = 5;

  ctx.fillStyle =
    "rgba(0,0,0,0.97)";


  /*
  左
  */

  ctx.beginPath();

  ctx.ellipse(
    w * 0.075,
    h * 0.80,
    w * 0.075,
    h * 0.105,
    -0.08,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.ellipse(
    w * 0.08,
    h * 0.99,
    w * 0.16,
    h * 0.19,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
  左中央
  */

  ctx.beginPath();

  ctx.ellipse(
    w * 0.31,
    h * 0.90,
    w * 0.055,
    h * 0.075,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
  中央
  */

  ctx.beginPath();

  ctx.ellipse(
    w * 0.53,
    h * 0.865,
    w * 0.075,
    h * 0.095,
    0.03,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.ellipse(
    w * 0.53,
    h * 1.01,
    w * 0.15,
    h * 0.16,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
  右
  */

  ctx.beginPath();

  ctx.ellipse(
    w * 0.91,
    h * 0.79,
    w * 0.085,
    h * 0.11,
    0.08,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.ellipse(
    w * 0.91,
    h * 0.99,
    w * 0.18,
    h * 0.19,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.restore();
}


function drawVignette(w, h) {

  const gradient =
    ctx.createRadialGradient(
      w * 0.52,
      h * 0.43,
      w * 0.20,

      w * 0.52,
      h * 0.48,
      w * 0.77
    );

  gradient.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );

  gradient.addColorStop(
    0.57,
    "rgba(0,0,0,0.08)"
  );

  gradient.addColorStop(
    1,
    "rgba(0,0,0,0.67)"
  );

  ctx.fillStyle = gradient;

  ctx.fillRect(
    0,
    0,
    w,
    h
  );
}


function drawNoise(w, h) {

  ctx.save();

  ctx.globalAlpha = 0.085;

  for (
    let i = 0;
    i < 190;
    i++
  ) {

    const gray =
      Math.floor(
        65 +
        Math.random() * 150
      );

    ctx.fillStyle =
      `rgb(${gray},${gray},${gray})`;

    ctx.fillRect(
      Math.random() * w,
      Math.random() * h,
      1 + Math.random() * 2,
      1 + Math.random() * 2
    );
  }

  ctx.restore();
}


processButton.addEventListener(
  "click",
  async function() {

    if (!selectedFile) return;

    try {

      if (!window.MediaRecorder) {
        throw new Error(
          "MediaRecorderに対応していません"
        );
      }

      if (!canvas.captureStream) {
        throw new Error(
          "Canvas captureStreamに対応していません"
        );
      }


      processButton.disabled = true;

      sourceVideo.controls = false;

      resultArea.style.display =
        "none";

      progressWrap.style.display =
        "block";

      progressBar.style.width =
        "0%";

      progressText.textContent =
        "準備中";

      status.textContent =
        "動画加工の準備をしています。";


      await prepareAudio();


      sourceVideo.pause();

      sourceVideo.currentTime = 0;


      await new Promise(resolve => {

        if (
          sourceVideo.readyState >= 1
        ) {

          resolve();

        } else {

          sourceVideo.onloadedmetadata =
            resolve;
        }
      });


      const isPortrait =
        sourceVideo.videoHeight >
        sourceVideo.videoWidth;


      if (isPortrait) {

        canvas.width = 540;
        canvas.height = 960;

      } else {

        canvas.width = 960;
        canvas.height = 540;
      }


      const canvasStream =
        canvas.captureStream(30);


      const finalStream =
        new MediaStream();


      canvasStream
        .getVideoTracks()
        .forEach(track => {

          finalStream.addTrack(track);

        });


      if (audioDestination) {

        audioDestination.stream
          .getAudioTracks()
          .forEach(track => {

            finalStream.addTrack(track);

          });
      }


      const mimeType =
        chooseMimeType();


      const recorderOptions =
        mimeType
        ? {
            mimeType: mimeType,
            videoBitsPerSecond:
              1350000
          }
        : {
            videoBitsPerSecond:
              1350000
          };


      const recorder =
        new MediaRecorder(
          finalStream,
          recorderOptions
        );


      const chunks = [];


      recorder.ondataavailable =
        function(event) {

          if (
            event.data &&
            event.data.size > 0
          ) {

            chunks.push(
              event.data
            );
          }
        };


      recorder.onstop =
        function() {

          const actualType =
            recorder.mimeType ||
            mimeType ||
            "video/mp4";


          const blob =
            new Blob(
              chunks,
              {
                type: actualType
              }
            );


          if (outputURL) {

            URL.revokeObjectURL(
              outputURL
            );
          }


          outputURL =
            URL.createObjectURL(
              blob
            );


          resultVideo.src =
            outputURL;


          saveButton.href =
            outputURL;


          saveButton.download =
            actualType.includes("mp4")
              ? "movie-leak.mp4"
              : "movie-leak.webm";


          resultArea.style.display =
            "block";


          progressBar.style.width =
            "100%";


          progressText.textContent =
            "完成";


          status.textContent =
            "加工が完了しました。";


          processButton.disabled =
            false;


          sourceVideo.controls =
            true;
        };


      function drawFrame() {

        if (
          sourceVideo.paused ||
          sourceVideo.ended
        ) {
          return;
        }


        const t =
          sourceVideo.currentTime;

        const w =
          canvas.width;

        const h =
          canvas.height;


        drawCinemaBackground(
          w,
          h
        );


        drawWarpedVideo(
          sourceVideo,
          w,
          h,
          t
        );


        drawVignette(
          w,
          h
        );


        drawAudience(
          w,
          h,
          t
        );


        drawNoise(
          w,
          h
        );


        /*
        スマホの露出が
        ときどき一瞬迷う
        */

        if (
          Math.random() < 0.06
        ) {

          ctx.fillStyle =
            "rgba(255,255,255,0.015)";

          ctx.fillRect(
            0,
            0,
            w,
            h
          );
        }


        if (sourceVideo.duration) {

          const percent =
            Math.min(
              100,
              Math.round(
                sourceVideo.currentTime /
                sourceVideo.duration *
                100
              )
            );


          progressBar.style.width =
            percent + "%";


          progressText.textContent =
            "加工中 " +
            percent +
            "%";
        }


        requestAnimationFrame(
          drawFrame
        );
      }


      sourceVideo.onended =
        function() {

          if (
            recorder.state !==
            "inactive"
          ) {

            recorder.stop();
          }
        };


      status.textContent =
        "映画館流出映像風に加工しています。動画の長さとほぼ同じ時間かかります。";


      recorder.start(500);


      await sourceVideo.play();


      requestAnimationFrame(
        drawFrame
      );

    }

    catch(error) {

      console.error(error);

      processButton.disabled =
        false;

      sourceVideo.controls =
        true;

      progressText.textContent =
        "エラー";

      status.textContent =
        "エラー：" +
        error.message;
    }
  }
);

</script>

</body>
</html>
