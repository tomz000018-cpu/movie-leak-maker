<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Movie Leak Maker</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080808;
  color: white;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
}

.container {
  width: min(92%, 800px);
  margin: auto;
  padding: 35px 0 80px;
}

h1 {
  text-align: center;
  margin: 0 0 8px;
  font-size: 30px;
}

.subtitle {
  text-align: center;
  color: #aaa;
  line-height: 1.6;
  margin-bottom: 30px;
}

.panel {
  background: #161616;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 20px;
}

.file-label,
.process-button,
.save-button {
  display: block;
  width: 100%;
  border: none;
  border-radius: 12px;
  padding: 16px;
  font-size: 17px;
  font-weight: bold;
  text-align: center;
}

.file-label {
  background: white;
  color: #111;
}

#videoInput {
  display: none;
}

#fileName {
  margin-top: 14px;
  text-align: center;
  color: #aaa;
  word-break: break-all;
}

.preview-area,
.result-area {
  display: none;
  margin-top: 24px;
}

.screen {
  background: black;
  padding: 8px;
  border-radius: 10px;
  overflow: hidden;
}

video {
  display: block;
  width: 100%;
  max-height: 65vh;
  background: black;
}

#workCanvas {
  display: none;
}

.process-button {
  margin-top: 20px;
  background: #f2f2f2;
  color: #111;
}

.process-button:disabled {
  background: #444;
  color: #999;
}

.save-button {
  margin-top: 16px;
  background: white;
  color: #111;
  text-decoration: none;
}

.status {
  margin-top: 18px;
  padding: 14px;
  border-radius: 10px;
  background: #101010;
  color: #ccc;
  line-height: 1.6;
  font-size: 14px;
}

.progress-wrap {
  display: none;
  margin-top: 18px;
}

.progress-bg {
  height: 12px;
  background: #333;
  border-radius: 10px;
  overflow: hidden;
}

.progress-bar {
  width: 0%;
  height: 100%;
  background: white;
}

.progress-text {
  margin-top: 8px;
  color: #aaa;
  text-align: center;
  font-size: 13px;
}

.notice {
  margin-top: 25px;
  text-align: center;
  color: #777;
  font-size: 12px;
  line-height: 1.6;
}

</style>
</head>


<body>

<div class="container">

<h1>Movie Leak Maker</h1>

<div class="subtitle">
普通の動画を<br>
「海外試写会の流出映像風」に加工します
</div>


<div class="panel">

<label class="file-label" for="videoInput">
動画を選ぶ
</label>

<input
  id="videoInput"
  type="file"
  accept="video/*"
>

<div id="fileName">
まだ動画は選択されていません
</div>


<div
  class="preview-area"
  id="previewArea"
>

<div class="screen">

<video
  id="sourceVideo"
  controls
  playsinline
></video>

</div>


<button
  id="processButton"
  class="process-button"
>
流出映像風に加工する
</button>


<div
  class="progress-wrap"
  id="progressWrap"
>

<div class="progress-bg">

<div
  class="progress-bar"
  id="progressBar"
></div>

</div>

<div
  class="progress-text"
  id="progressText"
>
準備中
</div>

</div>


<div
  class="status"
  id="status"
>
動画を選んでください。
</div>

</div>


<div
  class="result-area"
  id="resultArea"
>

<h2>
完成動画
</h2>

<div class="screen">

<video
  id="resultVideo"
  controls
  playsinline
></video>

</div>

<a
  id="saveButton"
  class="save-button"
>
完成動画を保存
</a>

</div>

</div>


<canvas id="workCanvas"></canvas>


<div class="notice">
動画はサーバーへ送信せず、
この端末の中で加工します。
</div>

</div>


<script>

const videoInput =
  document.getElementById("videoInput");

const sourceVideo =
  document.getElementById("sourceVideo");

const resultVideo =
  document.getElementById("resultVideo");

const previewArea =
  document.getElementById("previewArea");

const resultArea =
  document.getElementById("resultArea");

const processButton =
  document.getElementById("processButton");

const saveButton =
  document.getElementById("saveButton");

const fileName =
  document.getElementById("fileName");

const status =
  document.getElementById("status");

const progressWrap =
  document.getElementById("progressWrap");

const progressBar =
  document.getElementById("progressBar");

const progressText =
  document.getElementById("progressText");

const canvas =
  document.getElementById("workCanvas");

const ctx =
  canvas.getContext("2d");


const tempCanvas =
  document.createElement("canvas");

const tempCtx =
  tempCanvas.getContext("2d");


let selectedFile = null;

let inputURL = null;

let outputURL = null;

let audioContext = null;

let audioSource = null;

let audioDestination = null;



videoInput.addEventListener(
  "change",
  function(event) {

    selectedFile =
      event.target.files[0];

    if (!selectedFile) {
      return;
    }


    if (inputURL) {
      URL.revokeObjectURL(inputURL);
    }


    inputURL =
      URL.createObjectURL(selectedFile);


    sourceVideo.src =
      inputURL;

    sourceVideo.load();


    fileName.textContent =
      selectedFile.name;


    previewArea.style.display =
      "block";

    resultArea.style.display =
      "none";


    status.textContent =
      "動画を読み込みました。";

  }
);



function chooseMimeType() {

  const types = [

    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',

    'video/mp4',

    'video/webm;codecs=vp9,opus',

    'video/webm;codecs=vp8,opus',

    'video/webm'

  ];


  for (const type of types) {

    if (
      MediaRecorder.isTypeSupported(type)
    ) {

      return type;

    }

  }


  return "";

}



async function prepareAudio() {

  if (!audioContext) {

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

  }


  await audioContext.resume();


  if (!audioSource) {

    audioSource =
      audioContext.createMediaElementSource(
        sourceVideo
      );


    audioDestination =
      audioContext.createMediaStreamDestination();


    audioSource.connect(
      audioDestination
    );


    audioSource.connect(
      audioContext.destination
    );

  }

}



function lerp(a, b, t) {

  return a + (b - a) * t;

}



function drawCinemaBackground(w, h, time) {

  ctx.fillStyle =
    "#010101";

  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  const glow =
    ctx.createRadialGradient(

      w * 0.52,
      h * 0.43,
      10,

      w * 0.52,
      h * 0.43,
      w * 0.75

    );


  glow.addColorStop(
    0,
    "rgba(80,90,105,0.10)"
  );

  glow.addColorStop(
    0.45,
    "rgba(25,25,30,0.06)"
  );

  glow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  ctx.fillStyle =
    glow;

  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  /*
  ほんの少しだけ
  暗い映画館の壁っぽい色
  */

  ctx.fillStyle =
    "rgba(20,18,18,0.18)";

  ctx.fillRect(
    0,
    h * 0.78,
    w,
    h * 0.22
  );

}



function drawAudience(w, h, time) {

  ctx.save();

  ctx.fillStyle =
    "rgba(0,0,0,0.92)";


  /*
  左の観客
  */

  ctx.beginPath();

  ctx.ellipse(
    w * 0.10,
    h * 0.88,
    w * 0.085,
    h * 0.075,
    -0.1,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.ellipse(
    w * 0.12,
    h * 1.02,
    w * 0.16,
    h * 0.15,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
  中央寄りの観客
  */

  ctx.beginPath();

  ctx.ellipse(
    w * 0.48,
    h * 0.93,
    w * 0.07,
    h * 0.06,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.ellipse(
    w * 0.48,
    h * 1.04,
    w * 0.15,
    h * 0.13,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  /*
  右側の観客
  */

  ctx.beginPath();

  ctx.ellipse(
    w * 0.91,
    h * 0.86,
    w * 0.095,
    h * 0.085,
    0.1,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.beginPath();

  ctx.ellipse(
    w * 0.90,
    h * 1.01,
    w * 0.18,
    h * 0.16,
    0,
    0,
    Math.PI * 2
  );

  ctx.fill();


  ctx.restore();

}



function drawNoise(w, h) {

  ctx.save();

  ctx.globalAlpha =
    0.06;


  for (
    let i = 0;
    i < 120;
    i++
  ) {

    const gray =
      Math.floor(
        80 +
        Math.random() * 120
      );


    ctx.fillStyle =
      `rgb(${gray},${gray},${gray})`;


    const x =
      Math.random() * w;

    const y =
      Math.random() * h;


    ctx.fillRect(
      x,
      y,
      1 + Math.random() * 2,
      1 + Math.random() * 2
    );

  }


  ctx.restore();

}



function drawScreenWarp(
  source,
  w,
  h,
  time
) {

  /*
  手持ち撮影らしい
  不規則なブレ
  */

  const shakeX =
    Math.sin(time * 7.1) * 2.4
    +
    Math.sin(time * 17.3) * 1.1
    +
    Math.sin(time * 2.2) * 3.0;


  const shakeY =
    Math.cos(time * 6.3) * 2.0
    +
    Math.sin(time * 14.7) * 0.9;


  /*
  ときどき少しだけ
  カメラがずれる感じ
  */

  const driftX =
    Math.sin(time * 0.72) * 5;


  const driftY =
    Math.cos(time * 0.51) * 3;


  /*
  スクリーン四隅

  右側から斜めに撮っている
  ような形
  */

  const TL = {
    x: w * 0.13 + shakeX + driftX,
    y: h * 0.18 + shakeY + driftY
  };

  const TR = {
    x: w * 0.91 + shakeX + driftX,
    y: h * 0.10 + shakeY + driftY
  };

  const BL = {
    x: w * 0.17 + shakeX + driftX,
    y: h * 0.76 + shakeY + driftY
  };

  const BR = {
    x: w * 0.94 + shakeX + driftX,
    y: h * 0.69 + shakeY + driftY
  };


  /*
  スクリーンの弱い光
  */

  ctx.save();

  ctx.shadowColor =
    "rgba(190,200,220,0.22)";

  ctx.shadowBlur =
    22;


  ctx.fillStyle =
    "rgba(160,170,180,0.06)";


  ctx.beginPath();

  ctx.moveTo(
    TL.x,
    TL.y
  );

  ctx.lineTo(
    TR.x,
    TR.y
  );

  ctx.lineTo(
    BR.x,
    BR.y
  );

  ctx.lineTo(
    BL.x,
    BL.y
  );

  ctx.closePath();

  ctx.fill();

  ctx.restore();



  /*
  低画質化用
  一度小さなキャンバスに縮小
  */


  const tempWidth =
    source.videoWidth >
    source.videoHeight
      ? 420
      : 260;


  const tempHeight =
    Math.max(
      2,
      Math.round(
        tempWidth *
        source.videoHeight /
        source.videoWidth
      )
    );


  tempCanvas.width =
    tempWidth;

  tempCanvas.height =
    tempHeight;


  /*
  時々ピントが少し揺れる
  */

  const focusBreath =
    1.4 +
    (
      Math.sin(
        time * 0.75
      ) + 1
    ) * 0.55;


  const exposure =
    76 +
    Math.sin(
      time * 5.4
    ) * 3;


  tempCtx.clearRect(
    0,
    0,
    tempWidth,
    tempHeight
  );


  tempCtx.filter =
    "brightness(" +
    exposure +
    "%) " +

    "contrast(82%) " +

    "saturate(62%) " +

    "blur(" +
    focusBreath +
    "px)";


  tempCtx.drawImage(
    source,
    0,
    0,
    tempWidth,
    tempHeight
  );


  /*
  台形スクリーンを
  細い縦線に分割して描画。

  Canvasだけで
  遠近変形っぽく見せる方法。
  */


  const strips =
    100;


  for (
    let i = 0;
    i < strips;
    i++
  ) {

    const u1 =
      i / strips;

    const u2 =
      (i + 1) / strips;


    const topX1 =
      lerp(
        TL.x,
        TR.x,
        u1
      );


    const topX2 =
      lerp(
        TL.x,
        TR.x,
        u2
      );


    const bottomX1 =
      lerp(
        BL.x,
        BR.x,
        u1
      );


    const bottomX2 =
      lerp(
        BL.x,
        BR.x,
        u2
      );


    const topY1 =
      lerp(
        TL.y,
        TR.y,
        u1
      );


    const topY2 =
      lerp(
        TL.y,
        TR.y,
        u2
      );


    const bottomY1 =
      lerp(
        BL.y,
        BR.y,
        u1
      );


    const bottomY2 =
      lerp(
        BL.y,
        BR.y,
        u2
      );


    const destX =
      (
        topX1 +
        bottomX1
      ) / 2;


    const nextDestX =
      (
        topX2 +
        bottomX2
      ) / 2;


    const destY =
      (
        topY1 +
        topY2
      ) / 2;


    const bottomY =
      (
        bottomY1 +
        bottomY2
      ) / 2;


    const destW =
      Math.max(
        2,
        nextDestX -
        destX +
        2
      );


    const destH =
      bottomY -
      destY;


    const srcX =
      Math.floor(
        u1 *
        tempWidth
      );


    const srcW =
      Math.max(
        1,
        Math.ceil(
          tempWidth /
          strips
        )
      );


    ctx.drawImage(
      tempCanvas,

      srcX,
      0,
      srcW,
      tempHeight,

      destX,
      destY,
      destW,
      destH
    );

  }



  /*
  スクリーン全体に
  少し白っぽいかぶり
  */

  ctx.save();


  ctx.globalAlpha =
    0.055 +
    Math.random() * 0.025;


  ctx.fillStyle =
    "#d8dfdf";


  ctx.beginPath();

  ctx.moveTo(
    TL.x,
    TL.y
  );

  ctx.lineTo(
    TR.x,
    TR.y
  );

  ctx.lineTo(
    BR.x,
    BR.y
  );

  ctx.lineTo(
    BL.x,
    BL.y
  );

  ctx.closePath();

  ctx.fill();


  ctx.restore();

}



function drawVignette(w, h) {

  const gradient =
    ctx.createRadialGradient(

      w * 0.5,
      h * 0.43,
      w * 0.18,

      w * 0.5,
      h * 0.48,
      w * 0.78

    );


  gradient.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );


  gradient.addColorStop(
    0.62,
    "rgba(0,0,0,0.12)"
  );


  gradient.addColorStop(
    1,
    "rgba(0,0,0,0.72)"
  );


  ctx.fillStyle =
    gradient;


  ctx.fillRect(
    0,
    0,
    w,
    h
  );

}



processButton.addEventListener(
  "click",
  async function() {

    if (!selectedFile) {
      return;
    }


    try {


      if (
        !window.MediaRecorder
      ) {

        throw new Error(
          "MediaRecorderに対応していません"
        );

      }


      if (
        !canvas.captureStream
      ) {

        throw new Error(
          "Canvas captureStreamに対応していません"
        );

      }


      processButton.disabled =
        true;


      sourceVideo.controls =
        false;


      resultArea.style.display =
        "none";


      progressWrap.style.display =
        "block";


      progressBar.style.width =
        "0%";


      progressText.textContent =
        "準備中";


      status.textContent =
        "動画加工の準備をしています。";


      await prepareAudio();


      sourceVideo.pause();

      sourceVideo.currentTime =
        0;



      await new Promise(
        resolve => {

          if (
            sourceVideo.readyState >= 1
          ) {

            resolve();

          }

          else {

            sourceVideo.onloadedmetadata =
              resolve;

          }

        }
      );


      const isPortrait =
        sourceVideo.videoHeight >
        sourceVideo.videoWidth;



      /*
      縦動画なら縦
      横動画なら横で出力
      */


      if (isPortrait) {

        canvas.width =
          540;

        canvas.height =
          960;

      }

      else {

        canvas.width =
          960;

        canvas.height =
          540;

      }



      const canvasStream =
        canvas.captureStream(30);


      const finalStream =
        new MediaStream();



      canvasStream
        .getVideoTracks()
        .forEach(
          track => {

            finalStream.addTrack(
              track
            );

          }
        );



      if (audioDestination) {

        audioDestination.stream
          .getAudioTracks()
          .forEach(
            track => {

              finalStream.addTrack(
                track
              );

            }
          );

      }



      const mimeType =
        chooseMimeType();



      const recorderOptions =
        mimeType
        ? {
            mimeType: mimeType,

            /*
            わざと少し低めの
            ビットレート
            */
            videoBitsPerSecond:
              1800000

          }
        : {

            videoBitsPerSecond:
              1800000

          };



      const recorder =
        new MediaRecorder(
          finalStream,
          recorderOptions
        );


      const chunks =
        [];



      recorder.ondataavailable =
        function(event) {

          if (
            event.data &&
            event.data.size > 0
          ) {

            chunks.push(
              event.data
            );

          }

        };



      recorder.onstop =
        function() {


          const actualType =
            recorder.mimeType ||
            mimeType ||
            "video/mp4";


          const blob =
            new Blob(
              chunks,
              {
                type:
                  actualType
              }
            );


          if (outputURL) {

            URL.revokeObjectURL(
              outputURL
            );

          }


          outputURL =
            URL.createObjectURL(
              blob
            );


          resultVideo.src =
            outputURL;


          saveButton.href =
            outputURL;


          saveButton.download =
            actualType.includes(
              "mp4"
            )
              ? "movie-leak.mp4"
              : "movie-leak.webm";


          resultArea.style.display =
            "block";


          progressBar.style.width =
            "100%";


          progressText.textContent =
            "完成";


          status.textContent =
            "加工が完了しました。";


          processButton.disabled =
            false;


          sourceVideo.controls =
            true;

        };



      function drawFrame() {


        if (
          sourceVideo.paused ||
          sourceVideo.ended
        ) {

          return;

        }


        const t =
          sourceVideo.currentTime;


        const w =
          canvas.width;

        const h =
          canvas.height;



        drawCinemaBackground(
          w,
          h,
          t
        );


        drawScreenWarp(
          sourceVideo,
          w,
          h,
          t
        );


        drawVignette(
          w,
          h
        );


        drawAudience(
          w,
          h,
          t
        );


        drawNoise(
          w,
          h
        );


        /*
        ごく薄い露出変動
        */

        if (
          Math.random() <
          0.08
        ) {

          ctx.fillStyle =
            "rgba(255,255,255,0.012)";

          ctx.fillRect(
            0,
            0,
            w,
            h
          );

        }



        if (
          sourceVideo.duration
        ) {

          const percent =
            Math.min(
              100,
              Math.round(
                sourceVideo.currentTime /
                sourceVideo.duration *
                100
              )
            );


          progressBar.style.width =
            percent + "%";


          progressText.textContent =
            "加工中 " +
            percent +
            "%";

        }


        requestAnimationFrame(
          drawFrame
        );

      }



      sourceVideo.onended =
        function() {

          if (
            recorder.state !==
            "inactive"
          ) {

            recorder.stop();

          }

        };



      status.textContent =
        "映画館流出映像風に加工しています。動画の長さとほぼ同じ時間かかります。";


      recorder.start(500);


      await sourceVideo.play();


      requestAnimationFrame(
        drawFrame
      );


    }


    catch(error) {


      console.error(
        error
      );


      processButton.disabled =
        false;


      sourceVideo.controls =
        true;


      progressText.textContent =
        "エラー";


      status.textContent =
        "エラー：" +
        error.message;

    }

  }
);

</script>

</body>
</html>
