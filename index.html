<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Movie Leak Maker - Version 11</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#080808;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.container{width:min(92%,800px);margin:auto;padding:35px 0 80px}
h1{text-align:center;font-size:30px;margin:0 0 8px}
.subtitle{text-align:center;color:#aaa;line-height:1.7;margin-bottom:25px}
.version{text-align:center;color:#aaa;font-size:13px;margin:0 0 24px}
.panel{padding:20px;border:1px solid #333;border-radius:18px;background:#161616}
.file-label,.process-button,.save-button{display:block;width:100%;padding:16px;border:0;border-radius:12px;font-size:17px;font-weight:bold;text-align:center}
.file-label{background:#fff;color:#111;cursor:pointer}
.file-label.secondary{margin-top:20px;background:#343434;color:#fff}
.file-input{display:none}
.filename{margin-top:12px;text-align:center;color:#aaa;word-break:break-word;font-size:14px;line-height:1.6}
.preview-area,.result-area{display:none;margin-top:24px}
.screen{padding:8px;overflow:hidden;border-radius:10px;background:#000}
video{display:block;width:100%;max-height:65vh;background:#000}
#workCanvas{display:none}
.process-button{margin-top:20px;background:#f2f2f2;color:#111}
.process-button:disabled{background:#444;color:#999}
.save-button{margin-top:16px;background:#fff;color:#111;text-decoration:none}
.status{margin-top:18px;padding:14px;border-radius:10px;background:#101010;color:#ccc;font-size:14px;line-height:1.7}
.progress-wrap{display:none;margin-top:18px}
.progress-bg{height:12px;overflow:hidden;border-radius:10px;background:#333}
.progress-bar{width:0%;height:100%;background:#fff}
.progress-text{margin-top:8px;text-align:center;color:#aaa;font-size:13px}
.notice{margin-top:25px;text-align:center;color:#777;font-size:12px;line-height:1.7}
.help{color:#aaa;font-size:13px;line-height:1.7;margin-top:10px}
</style>
</head>
<body>
<div class="container">
<h1>Movie Leak Maker</h1>
<div class="subtitle">普通の動画を<br>「海外試写会の流出映像風」に加工します</div>
<div class="version">Version 11 — 実録音・観客音テスト版</div>

<div class="panel">
  <label class="file-label" for="videoInput">① 動画を選ぶ</label>
  <input class="file-input" id="videoInput" type="file" accept="video/*">
  <div id="fileName" class="filename">まだ動画は選択されていません</div>

  <label class="file-label secondary" for="audioInput">② 観客音をまとめて選ぶ（7本）</label>
  <input class="file-input" id="audioInput" type="file" accept="audio/*,.mp3,.m4a,.wav" multiple>
  <div id="audioNames" class="filename">まだ観客音は選択されていません</div>
  <div class="help">ZIPを展開したフォルダ内のMP3を7本すべて選んでください。ZIPファイル自体は選ばないでください。</div>

  <div id="previewArea" class="preview-area">
    <div class="screen">
      <video id="sourceVideo" controls playsinline preload="metadata"></video>
    </div>

    <button id="processButton" class="process-button">③ 観客音入りの動画を作る</button>

    <div id="progressWrap" class="progress-wrap">
      <div class="progress-bg">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div id="progressText" class="progress-text">準備中</div>
    </div>

    <div id="status" class="status">動画と観客音を選んでください。</div>
  </div>

  <div id="resultArea" class="result-area">
    <h2>完成動画</h2>
    <div class="screen">
      <video id="resultVideo" controls playsinline></video>
    </div>
    <a id="saveButton" class="save-button">完成動画を保存</a>
  </div>
</div>

<canvas id="workCanvas"></canvas>

<div class="notice">
  動画と観客音はサーバーにアップロードされず、端末内で加工されます。<br>
  素材の権利確認が済むまでは個人用テストとしてお使いください。
</div>
</div>

<script>
"use strict";

const $ = id => document.getElementById(id);

const videoInput = $("videoInput");
const audioInput = $("audioInput");
const sourceVideo = $("sourceVideo");
const resultVideo = $("resultVideo");
const previewArea = $("previewArea");
const resultArea = $("resultArea");
const processButton = $("processButton");
const saveButton = $("saveButton");
const fileName = $("fileName");
const audioNames = $("audioNames");
const statusBox = $("status");
const progressWrap = $("progressWrap");
const progressBar = $("progressBar");
const progressText = $("progressText");

const canvas = $("workCanvas");
const ctx = canvas.getContext("2d", { alpha:false });

const sceneCanvas = document.createElement("canvas");
const sceneCtx = sceneCanvas.getContext("2d");

const screenCanvas = document.createElement("canvas");
const screenCtx = screenCanvas.getContext("2d");

const blurCanvas = document.createElement("canvas");
const blurCtx = blurCanvas.getContext("2d");

const bloomCanvas = document.createElement("canvas");
const bloomCtx = bloomCanvas.getContext("2d");

const colorCanvas = document.createElement("canvas");
const colorCtx = colorCanvas.getContext("2d");

let selectedFile = null;
let selectedAudioFiles = [];
let inputURL = null;
let outputURL = null;

let audioContext = null;
let audioSource = null;
let audioDestination = null;
let audienceBus = null;

let activeSounds = [];
let activeRecorder = null;
let processing = false;
let activeFrame = 0;

function showError(err){
  console.error(err);
  statusBox.textContent = "エラー：" + (err && err.message ? err.message : String(err));
}

window.addEventListener("error", e => {
  if(!processing && previewArea.style.display !== "block"){
    fileName.textContent = "画面エラー：" + e.message;
  }
});

videoInput.addEventListener("change", event => {
  if(processing) return;

  selectedFile = event.target.files?.[0] || null;
  if(!selectedFile) return;

  if(inputURL) URL.revokeObjectURL(inputURL);

  inputURL = URL.createObjectURL(selectedFile);
  sourceVideo.src = inputURL;
  sourceVideo.load();

  fileName.textContent = selectedFile.name;
  previewArea.style.display = "block";
  resultArea.style.display = "none";

  statusBox.textContent = "動画を読み込みました。観客音も選んでください。";
});

audioInput.addEventListener("change", event => {
  if(processing) return;

  selectedAudioFiles = Array.from(event.target.files || []).filter(f =>
    /\.(mp3|wav|m4a|aac|ogg)$/i.test(f.name) || f.type.startsWith("audio/")
  );

  audioNames.textContent = selectedAudioFiles.length
    ? selectedAudioFiles.length + "本選択：" + selectedAudioFiles.map(f => f.name).join("、")
    : "音声ファイルが選ばれていません";
});

function chooseMimeType(){
  const types = [
    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',
    "video/mp4",
    "video/webm;codecs=vp9,opus",
    "video/webm;codecs=vp8,opus",
    "video/webm"
  ];
  return types.find(t => MediaRecorder.isTypeSupported(t)) || "";
}

function makeImpulse(context, seconds, decay){
  const rate = context.sampleRate;
  const len = Math.floor(rate * seconds);
  const buffer = context.createBuffer(2, len, rate);

  for(let c=0; c<2; c++){
    const data = buffer.getChannelData(c);
    for(let i=0; i<len; i++){
      data[i] = (Math.random()*2-1) * Math.pow(1 - i/len, decay);
    }
  }
  return buffer;
}

async function prepareAudio(){
  if(!audioContext){
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
  }

  await audioContext.resume();
  if(audioSource) return;

  audioSource = audioContext.createMediaElementSource(sourceVideo);
  audioDestination = audioContext.createMediaStreamDestination();

  const dry = audioContext.createGain();
  const wet = audioContext.createGain();
  const lowpass = audioContext.createBiquadFilter();
  const delay = audioContext.createDelay();
  const convolver = audioContext.createConvolver();

  dry.gain.value = 0.54;
  wet.gain.value = 0.43;

  lowpass.type = "lowpass";
  lowpass.frequency.value = 3900;

  delay.delayTime.value = 0.075;
  convolver.buffer = makeImpulse(audioContext, 2, 2.2);

  audioSource.connect(lowpass);
  lowpass.connect(dry);
  dry.connect(audioDestination);

  lowpass.connect(delay);
  delay.connect(convolver);
  convolver.connect(wet);
  wet.connect(audioDestination);

  dry.connect(audioContext.destination);
  wet.connect(audioContext.destination);

  audienceBus = audioContext.createGain();
  audienceBus.gain.value = 1.0;

  const audienceLowpass = audioContext.createBiquadFilter();
  const audienceReverb = audioContext.createConvolver();
  const audDry = audioContext.createGain();
  const audWet = audioContext.createGain();

  audienceLowpass.type = "lowpass";
  audienceLowpass.frequency.value = 5200;

  audienceReverb.buffer = makeImpulse(audioContext, 1.45, 2.5);

  audDry.gain.value = 0.95;
  audWet.gain.value = 0.22;

  audienceBus.connect(audienceLowpass);

  audienceLowpass.connect(audDry);
  audienceLowpass.connect(audienceReverb);
  audienceReverb.connect(audWet);

  audDry.connect(audioDestination);
  audWet.connect(audioDestination);

  audDry.connect(audioContext.destination);
  audWet.connect(audioContext.destination);
}

async function loadAudienceFiles(){
  const library = {
    cheer: [],
    applause: [],
    other: []
  };

  const failures = [];

  for(const file of selectedAudioFiles){
    try{
      const raw = await file.arrayBuffer();
      const buffer = await audioContext.decodeAudioData(raw);
      const name = file.name.toLowerCase();

      const kind = /applause|clap/.test(name)
        ? "applause"
        : /cheer|crowd|whoa|wow/.test(name)
          ? "cheer"
          : "other";

      library[kind].push({
        buffer,
        name:file.name
      });

    }catch(err){
      failures.push(file.name);
    }
  }

  if(!library.cheer.length && !library.applause.length && !library.other.length){
    throw new Error("観客音を読み込めませんでした。MP3を選び直してください。");
  }

  if(failures.length){
    statusBox.textContent = "読めなかった音声：" + failures.join("、");
  }

  return library;
}

function stopAudience(){
  for(const sound of activeSounds){
    try{
      sound.stop();
    }catch(e){}
  }
  activeSounds = [];
}

function randomChoice(items){
  return items[Math.floor(Math.random() * items.length)];
}

function playAudienceClip(items, start, volume, maxDuration){
  if(!items.length) return;

  const entry = randomChoice(items);
  const buffer = entry.buffer;

  const src = audioContext.createBufferSource();
  const gain = audioContext.createGain();

  src.buffer = buffer;

  const len = Math.min(buffer.duration, maxDuration || buffer.duration);
  if(len < 0.05) return;

  gain.gain.setValueAtTime(0.0001, start);
  gain.gain.linearRampToValueAtTime(volume, start + Math.min(0.15, len * 0.2));
  gain.gain.setValueAtTime(volume, start + Math.max(0.03, len - 0.30));
  gain.gain.linearRampToValueAtTime(0.0001, start + len);

  src.connect(gain);
  gain.connect(audienceBus);

  src.start(start, 0, len);
  src.stop(start + len + 0.02);

  activeSounds.push(src);
}

function scheduleAudience(duration, library){
  stopAudience();

  const start = audioContext.currentTime + 0.12;

  const cheers = library.cheer.length ? library.cheer : library.other;
  const applause = library.applause.length ? library.applause : library.other;

  if(cheers.length){
    playAudienceClip(cheers, start + duration * 0.22, 0.60, Math.min(3, duration * 0.13));
    playAudienceClip(cheers, start + duration * 0.49, 0.90, Math.min(4, duration * 0.16));
    playAudienceClip(cheers, start + duration * 0.74, 1.15, Math.min(5, duration * 0.19));
  }

  if(applause.length){
    playAudienceClip(applause, start + duration * 0.79, 0.80, Math.min(5, duration * 0.19));

    if(duration > 12){
      playAudienceClip(applause, start + duration * 0.91, 0.38, Math.min(2, duration * 0.07));
    }
  }
}

function drawVideoCover(target, video, w, h, extraScale=1){
  const vr = video.videoWidth / video.videoHeight;
  const tr = w / h;

  let sx = 0, sy = 0;
  let sw = video.videoWidth;
  let sh = video.videoHeight;

  if(vr > tr){
    sw = video.videoHeight * tr;
    sx = (video.videoWidth - sw) / 2;
  }else{
    sh = video.videoWidth / tr;
    sy = (video.videoHeight - sh) / 2;
  }

  const dw = w * extraScale;
  const dh = h * extraScale;

  target.drawImage(
    video,
    sx, sy, sw, sh,
    (w - dw) / 2, (h - dh) / 2, dw, dh
  );
}

function renderScreen(time){
  const w = screenCanvas.width;
  const h = screenCanvas.height;

  screenCtx.clearRect(0,0,w,h);
  blurCtx.clearRect(0,0,w,h);
  bloomCtx.clearRect(0,0,w,h);
  colorCtx.clearRect(0,0,w,h);

  const focusA = (Math.sin(time * 0.38) + 1) / 2;
  const focusB = (Math.sin(time * 0.14 + 2.1) + 1) / 2;

  const blur = 15 + focusA * 9 + focusB * 5;
  const brightness = 108 + Math.sin(time * 0.62) * 8 + Math.sin(time * 3.7) * 3;

  blurCtx.save();
  blurCtx.filter = `brightness(${brightness}%) contrast(79%) saturate(64%) blur(${blur}px)`;
  drawVideoCover(blurCtx, sourceVideo, w, h, 1.06);
  blurCtx.restore();

  const haze = blurCtx.createLinearGradient(0,0,w,h);
  haze.addColorStop(0,"rgba(210,220,230,0.10)");
  haze.addColorStop(0.45,"rgba(235,235,225,0.16)");
  haze.addColorStop(1,"rgba(180,200,215,0.08)");
  blurCtx.fillStyle = haze;
  blurCtx.fillRect(0,0,w,h);

  bloomCtx.save();
  bloomCtx.filter = "brightness(190%) blur(32px)";
  drawVideoCover(bloomCtx, sourceVideo, w, h, 1.08);
  bloomCtx.restore();

  bloomCtx.save();
  bloomCtx.globalAlpha = 0.55;
  bloomCtx.filter = "brightness(260%) blur(62px)";
  drawVideoCover(bloomCtx, sourceVideo, w, h, 1.10);
  bloomCtx.restore();

  screenCtx.drawImage(blurCanvas,0,0);

  screenCtx.save();
  screenCtx.globalCompositeOperation = "screen";
  screenCtx.globalAlpha = 0.44;
  screenCtx.drawImage(bloomCanvas,0,0);
  screenCtx.restore();

  colorCtx.save();
  colorCtx.globalAlpha = 0.11;
  colorCtx.filter = "sepia(100%) saturate(500%) hue-rotate(-35deg)";
  colorCtx.drawImage(blurCanvas,4,1);
  colorCtx.restore();

  colorCtx.save();
  colorCtx.globalCompositeOperation = "screen";
  colorCtx.globalAlpha = 0.08;
  colorCtx.filter = "sepia(100%) saturate(500%) hue-rotate(170deg)";
  colorCtx.drawImage(blurCanvas,-4,-1);
  colorCtx.restore();

  screenCtx.save();
  screenCtx.globalCompositeOperation = "screen";
  screenCtx.drawImage(colorCanvas,0,0);
  screenCtx.restore();

  screenCtx.fillStyle = "rgba(215,220,215,0.095)";
  screenCtx.fillRect(0,0,w,h);

  screenCtx.save();
  screenCtx.globalCompositeOperation = "destination-in";
  screenCtx.filter = "blur(38px)";
  screenCtx.fillStyle = "white";
  screenCtx.fillRect(46,40,w-92,h-80);
  screenCtx.restore();
}

function buildScene(time){
  const w = sceneCanvas.width;
  const h = sceneCanvas.height;

  sceneCtx.clearRect(0,0,w,h);
  sceneCtx.fillStyle = "rgb(5,6,7)";
  sceneCtx.fillRect(0,0,w,h);

  renderScreen(time);

  const roomGlow = sceneCtx.createRadialGradient(
    w * 0.52, h * 0.47, w * 0.10,
    w * 0.52, h * 0.50, w * 0.95
  );

  roomGlow.addColorStop(0,"rgba(135,150,165,0.16)");
  roomGlow.addColorStop(0.38,"rgba(85,95,105,0.075)");
  roomGlow.addColorStop(0.72,"rgba(35,40,45,0.035)");
  roomGlow.addColorStop(1,"rgba(0,0,0,0)");

  sceneCtx.fillStyle = roomGlow;
  sceneCtx.fillRect(0,0,w,h);

  sceneCtx.save();

  sceneCtx.translate(w * 0.51, h * 0.48);
  sceneCtx.rotate(-0.048);
  sceneCtx.transform(1,-0.022,0.115,1,0,0);

  const sw = w * 1.46;
  const sh = h * 1.18;

  sceneCtx.save();
  sceneCtx.globalAlpha = 0.26;
  sceneCtx.filter = "blur(65px) brightness(175%)";
  sceneCtx.drawImage(screenCanvas, -sw/2, -sh/2, sw, sh);
  sceneCtx.restore();

  sceneCtx.save();
  sceneCtx.filter = "blur(7px)";
  sceneCtx.drawImage(screenCanvas, -sw/2, -sh/2, sw, sh);
  sceneCtx.restore();

  sceneCtx.restore();

  const lensHaze = sceneCtx.createLinearGradient(0,0,w,h);
  lensHaze.addColorStop(0,"rgba(160,175,190,0.055)");
  lensHaze.addColorStop(0.5,"rgba(220,220,205,0.075)");
  lensHaze.addColorStop(1,"rgba(120,140,160,0.035)");
  sceneCtx.fillStyle = lensHaze;
  sceneCtx.fillRect(0,0,w,h);

  const vignette = sceneCtx.createRadialGradient(
    w * 0.52, h * 0.47, w * 0.27,
    w * 0.52, h * 0.50, w * 0.87
  );

  vignette.addColorStop(0,"rgba(0,0,0,0)");
  vignette.addColorStop(0.68,"rgba(0,0,0,0.10)");
  vignette.addColorStop(1,"rgba(0,0,0,0.76)");

  sceneCtx.fillStyle = vignette;
  sceneCtx.fillRect(0,0,w,h);
}

function drawCamera(time){
  const w = canvas.width;
  const h = canvas.height;

  const microX = Math.sin(time * 8.3) * 2.5 + Math.sin(time * 16.9);
  const microY = Math.cos(time * 7.1) * 2 + Math.sin(time * 13.5) * 0.9;
  const driftX = Math.sin(time * 0.39) * 6.5;
  const driftY = Math.cos(time * 0.28) * 4.2;
  const angle = Math.sin(time * 0.63) * 0.0062 + Math.sin(time * 2.8) * 0.0018;
  const zoom = 1.055 + Math.sin(time * 0.24) * 0.008;

  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,w,h);

  ctx.save();
  ctx.translate(w/2 + microX + driftX, h/2 + microY + driftY);
  ctx.rotate(angle);
  ctx.scale(zoom, zoom);
  ctx.drawImage(sceneCanvas, -w/2, -h/2, w, h);
  ctx.restore();
}

processButton.addEventListener("click", async () => {
  if(processing) return;

  if(!selectedFile){
    statusBox.textContent = "先に動画を選んでください。";
    return;
  }

  if(!selectedAudioFiles.length){
    statusBox.textContent = "先に観客音のMP3を選んでください。";
    return;
  }

  processing = true;
  processButton.disabled = true;
  videoInput.disabled = true;
  audioInput.disabled = true;
  sourceVideo.controls = false;

  resultArea.style.display = "none";
  progressWrap.style.display = "block";
  progressBar.style.width = "0%";
  progressText.textContent = "準備中";

  statusBox.textContent = "観客音を読み込んでいます…";

  let recorder = null;
  let canvasStream = null;

  try{
    if(!window.MediaRecorder || !canvas.captureStream){
      throw new Error("このブラウザでは動画の録画に対応していません");
    }

    await prepareAudio();
    const library = await loadAudienceFiles();

    const loadedCount = library.cheer.length + library.applause.length + library.other.length;

    statusBox.textContent = `観客音 ${loadedCount}本の読み込み完了。動画を加工しています。`;

    sourceVideo.pause();
    sourceVideo.currentTime = 0;

    if(sourceVideo.seeking){
      await new Promise(resolve => {
        sourceVideo.addEventListener("seeked", resolve, { once:true });
      });
    }

    if(!Number.isFinite(sourceVideo.duration) || sourceVideo.duration <= 0){
      throw new Error("動画の長さを読み取れませんでした");
    }

    const portrait = sourceVideo.videoHeight > sourceVideo.videoWidth;

    canvas.width = portrait ? 540 : 960;
    canvas.height = portrait ? 960 : 540;

    for(const c of [sceneCanvas,screenCanvas,blurCanvas,bloomCanvas,colorCanvas]){
      c.width = canvas.width;
      c.height = canvas.height;
    }

    buildScene(0);
    drawCamera(0);

    canvasStream = canvas.captureStream(30);

    const finalStream = new MediaStream();

    for(const track of canvasStream.getVideoTracks()){
      finalStream.addTrack(track);
    }

    for(const track of audioDestination.stream.getAudioTracks()){
      finalStream.addTrack(track);
    }

    const mime = chooseMimeType();

    recorder = new MediaRecorder(
      finalStream,
      mime
        ? { mimeType:mime, videoBitsPerSecond:4500000 }
        : { videoBitsPerSecond:4500000 }
    );

    activeRecorder = recorder;
    const chunks = [];

    recorder.ondataavailable = e => {
      if(e.data && e.data.size > 0){
        chunks.push(e.data);
      }
    };

    const finish = () => {
      cancelAnimationFrame(activeFrame);
      stopAudience();

      if(canvasStream){
        canvasStream.getTracks().forEach(track => track.stop());
      }

      sourceVideo.controls = true;
      processButton.disabled = false;
      videoInput.disabled = false;
      audioInput.disabled = false;
      processing = false;
      activeRecorder = null;
    };

    recorder.onerror = e => {
      showError(e.error || new Error("録画中のエラー"));
      finish();
    };

    recorder.onstop = () => {
      finish();

      if(!chunks.length){
        statusBox.textContent = "動画を保存できませんでした。短い動画で再試行してください。";
        return;
      }

      const type = recorder.mimeType || mime || "video/mp4";
      const blob = new Blob(chunks, { type });

      if(outputURL){
        URL.revokeObjectURL(outputURL);
      }

      outputURL = URL.createObjectURL(blob);
      resultVideo.src = outputURL;
      saveButton.href = outputURL;

      saveButton.download = type.includes("mp4")
        ? "movie-leak-audience.mp4"
        : "movie-leak-audience.webm";

      resultArea.style.display = "block";
      progressBar.style.width = "100%";
      progressText.textContent = "完成";
      statusBox.textContent = "観客の実録音を組み込んだ動画が完成しました。";
    };

    function frame(){
      if(sourceVideo.paused || sourceVideo.ended || !processing){
        return;
      }

      const t = sourceVideo.currentTime;
      buildScene(t);
      drawCamera(t);

      const percent = Math.min(100, Math.round(t / sourceVideo.duration * 100));
      progressBar.style.width = percent + "%";
      progressText.textContent = "加工中 " + percent + "%";

      activeFrame = requestAnimationFrame(frame);
    }

    sourceVideo.onended = () => {
      cancelAnimationFrame(activeFrame);

      if(recorder && recorder.state !== "inactive"){
        recorder.stop();
      }
    };

    recorder.start(500);
    await sourceVideo.play();

    scheduleAudience(sourceVideo.duration, library);

    activeFrame = requestAnimationFrame(frame);

  }catch(err){
    showError(err);

    cancelAnimationFrame(activeFrame);
    sourceVideo.pause();
    stopAudience();

    if(recorder && recorder.state !== "inactive"){
      try{
        recorder.stop();
      }catch(e){}
    }

    if(canvasStream){
      canvasStream.getTracks().forEach(track => track.stop());
    }

    sourceVideo.controls = true;
    processButton.disabled = false;
    videoInput.disabled = false;
    audioInput.disabled = false;
    processing = false;
  }
});
</script>
</body>
</html>
