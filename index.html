<body>

<div class="container">

<h1>Movie Leak Maker</h1>

<div class="subtitle">
普通の動画を<br>
「海外試写会の流出映像風」に加工します
</div>

<div class="panel">

<label class="file-label" for="videoInput">
動画を選ぶ
</label>

<input
  id="videoInput"
  type="file"
  accept="video/*"
>

<div id="fileName">

</div>

<video

></video>

流出映像風に加工する

>

  id="progressBar"

></div>

準備中

<video
  id="resultVideo"

></video>

</div>

<a

>
完成動画を保存
</a>

</div>

</div>

<canvas id="workCanvas"></canvas>

<div class="notice">
動画はサーバーへ送信せず、この端末内で加工します。
</div>

</div>


<script>

const videoInput =
  document.getElementById("videoInput");

const sourceVideo =
  document.getElementById("sourceVideo");

const resultVideo =
  document.getElementById("resultVideo");

const previewArea =
  document.getElementById("previewArea");

const resultArea =
  document.getElementById("resultArea");

const processButton =
  document.getElementById("processButton");

const saveButton =
  document.getElementById("saveButton");

const fileName =
  document.getElementById("fileName");

const status =
  document.getElementById("status");

const progressWrap =
  document.getElementById("progressWrap");

const progressBar =
  document.getElementById("progressBar");

const progressText =
  document.getElementById("progressText");

const canvas =
  document.getElementById("workCanvas");

const ctx =
  canvas.getContext(
    "2d",
    {alpha:false}
  );


/*
映画館全体
*/
const sceneCanvas =
  document.createElement("canvas");

const sceneCtx =
  sceneCanvas.getContext("2d");


/*
スクリーン本体
*/
const screenCanvas =
  document.createElement("canvas");

const screenCtx =
  screenCanvas.getContext("2d");


/*
ぼかし用
*/
const blurCanvas =
  document.createElement("canvas");

const blurCtx =
  blurCanvas.getContext("2d");


/*
ブルーム用
*/
const bloomCanvas =
  document.createElement("canvas");

const bloomCtx =
  bloomCanvas.getContext("2d");


/*
色収差用
*/
const colorCanvas =
  document.createElement("canvas");

const colorCtx =
  colorCanvas.getContext("2d");


let selectedFile = null;

let inputURL = null;

let outputURL = null;

let audioContext = null;

let audioSource = null;

let audioDestination = null;

let audienceBus = null;

let activeAudienceNodes = [];



videoInput.addEventListener(
  "change",
  event => {

    selectedFile =
      event.target.files[0];

    if(!selectedFile){
      return;
    }


    if(inputURL){

      URL.revokeObjectURL(
        inputURL
      );
    }


    inputURL =
      URL.createObjectURL(
        selectedFile
      );


    sourceVideo.src =
      inputURL;


    sourceVideo.load();


    fileName.textContent =
      selectedFile.name;


    previewArea.style.display =
      "block";


    resultArea.style.display =
      "none";


    status.textContent =
      "動画を読み込みました。";
  }
);



function chooseMimeType(){

  const types = [

    'video/mp4;codecs="avc1.42E01E,mp4a.40.2"',

    'video/mp4',

    'video/webm;codecs=vp9,opus',

    'video/webm;codecs=vp8,opus',

    'video/webm'

  ];


  for(const type of types){

    if(
      MediaRecorder.isTypeSupported(
        type
      )
    ){

      return type;
    }
  }


  return "";
}



function makeImpulse(
  context,
  seconds,
  decay
){

  const rate =
    context.sampleRate;


  const length =
    Math.floor(
      rate * seconds
    );


  const impulse =
    context.createBuffer(
      2,
      length,
      rate
    );


  for(
    let channel = 0;
    channel < 2;
    channel++
  ){

    const data =
      impulse.getChannelData(
        channel
      );


    for(
      let i = 0;
      i < length;
      i++
    ){

      data[i] =
        (
          Math.random() * 2 - 1
        )
        *
        Math.pow(
          1 - i / length,
          decay
        );
    }
  }


  return impulse;
}



function createNoiseBuffer(
  context,
  seconds
){

  const length =
    Math.floor(
      context.sampleRate *
      seconds
    );


  const buffer =
    context.createBuffer(
      1,
      length,
      context.sampleRate
    );


  const data =
    buffer.getChannelData(0);


  for(
    let i = 0;
    i < length;
    i++
  ){

    data[i] =
      Math.random() * 2 - 1;
  }


  return buffer;
}



async function prepareAudio(){

  if(!audioContext){

    audioContext =
      new(
        window.AudioContext ||
        window.webkitAudioContext
      )();
  }


  await audioContext.resume();


  if(audioSource){
    return;
  }


  audioSource =
    audioContext.createMediaElementSource(
      sourceVideo
    );


  audioDestination =
    audioContext.createMediaStreamDestination();



  /*
  元動画の直接音
  */

  const dry =
    audioContext.createGain();


  dry.gain.value =
    0.54;



  /*
  映画館の反響音
  */

  const wet =
    audioContext.createGain();


  wet.gain.value =
    0.43;



  /*
  スマホ録音らしく
  高い音を少し落とす
  */

  const lowpass =
    audioContext.createBiquadFilter();


  lowpass.type =
    "lowpass";


  lowpass.frequency.value =
    3900;



  /*
  映画館らしい少し遅れた反射
  */

  const delay =
    audioContext.createDelay();


  delay.delayTime.value =
    0.075;



  const convolver =
    audioContext.createConvolver();


  convolver.buffer =
    makeImpulse(
      audioContext,
      2.0,
      2.2
    );



  audioSource.connect(
    lowpass
  );


  lowpass.connect(
    dry
  );


  dry.connect(
    audioDestination
  );


  lowpass.connect(
    delay
  );


  delay.connect(
    convolver
  );


  convolver.connect(
    wet
  );


  wet.connect(
    audioDestination
  );



  /*
  加工中にも聞こえる
  */

  dry.connect(
    audioContext.destination
  );


  wet.connect(
    audioContext.destination
  );



  /*
  観客音専用バス
  */

  audienceBus =
    audioContext.createGain();


  audienceBus.gain.value =
    0.82;


  /*
  観客音も少し映画館に馴染ませる
  */

  const audienceLowpass =
    audioContext.createBiquadFilter();


  audienceLowpass.type =
    "lowpass";


  audienceLowpass.frequency.value =
    5200;


  const audienceReverb =
    audioContext.createConvolver();


  audienceReverb.buffer =
    makeImpulse(
      audioContext,
      1.45,
      2.5
    );


  const audienceDry =
    audioContext.createGain();


  audienceDry.gain.value =
    0.78;


  const audienceWet =
    audioContext.createGain();


  audienceWet.gain.value =
    0.28;


  audienceBus.connect(
    audienceLowpass
  );


  audienceLowpass.connect(
    audienceDry
  );


  audienceLowpass.connect(
    audienceReverb
  );


  audienceReverb.connect(
    audienceWet
  );


  audienceDry.connect(
    audioDestination
  );


  audienceWet.connect(
    audioDestination
  );


  /*
  加工中にも観客音を聞く
  */

  audienceDry.connect(
    audioContext.destination
  );


  audienceWet.connect(
    audioContext.destination
  );
}



function stopAudienceSounds(){

  activeAudienceNodes.forEach(
    node => {

      try{

        if(node.stop){
          node.stop();
        }

      }catch(error){
      }

    }
  );


  activeAudienceNodes =
    [];
}



/*
常に小さく存在する
観客のざわめき
*/
function createAudienceMurmur(
  startTime
){

  const source =
    audioContext.createBufferSource();


  source.buffer =
    createNoiseBuffer(
      audioContext,
      12
    );


  source.loop =
    true;


  const highpass =
    audioContext.createBiquadFilter();


  highpass.type =
    "highpass";


  highpass.frequency.value =
    150;


  const lowpass =
    audioContext.createBiquadFilter();


  lowpass.type =
    "lowpass";


  lowpass.frequency.value =
    850;


  const gain =
    audioContext.createGain();


  gain.gain.setValueAtTime(
    0.018,
    startTime
  );


  source.connect(
    highpass
  );


  highpass.connect(
    lowpass
  );


  lowpass.connect(
    gain
  );


  gain.connect(
    audienceBus
  );


  source.start(
    startTime
  );


  activeAudienceNodes.push(
    source
  );


  return {
    source,
    gain
  };
}



/*
観客が一斉に
「おおっ」と反応する感じ。

まだ本物の人声ではなく
仮の合成音。
*/
function createCrowdCheer(
  startTime,
  duration = 1.7,
  strength = 1
){

  const voices =
    Math.floor(
      18 * strength
    );


  for(
    let i = 0;
    i < voices;
    i++
  ){

    const oscillator =
      audioContext.createOscillator();


    const filter =
      audioContext.createBiquadFilter();


    const gain =
      audioContext.createGain();


    const pan =
      audioContext.createStereoPanner
      ? audioContext.createStereoPanner()
      : null;


    const delay =
      Math.random() * 0.22;


    const voiceStart =
      startTime + delay;


    const voiceDuration =
      duration *
      (
        0.55 +
        Math.random() * 0.55
      );


    const voiceEnd =
      voiceStart +
      voiceDuration;


    oscillator.type =
      Math.random() > 0.5
      ? "sawtooth"
      : "triangle";


    const baseFrequency =
      145 +
      Math.random() * 420;


    oscillator.frequency.setValueAtTime(
      baseFrequency,
      voiceStart
    );


    oscillator.frequency.exponentialRampToValueAtTime(
      baseFrequency *
      (
        1.05 +
        Math.random() * 0.55
      ),
      voiceEnd
    );


    filter.type =
      "bandpass";


    filter.frequency.value =
      450 +
      Math.random() * 1400;


    filter.Q.value =
      0.45;


    const volume =
      (
        0.006 +
        Math.random() * 0.010
      )
      *
      strength;


    gain.gain.setValueAtTime(
      0.001,
      voiceStart
    );


    gain.gain.linearRampToValueAtTime(
      volume,
      voiceStart + 0.12
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      voiceEnd
    );


    oscillator.connect(
      filter
    );


    filter.connect(
      gain
    );


    if(pan){

      pan.pan.value =
        -0.9 +
        Math.random() * 1.8;


      gain.connect(
        pan
      );


      pan.connect(
        audienceBus
      );

    }else{

      gain.connect(
        audienceBus
      );
    }


    oscillator.start(
      voiceStart
    );


    oscillator.stop(
      voiceEnd
    );


    activeAudienceNodes.push(
      oscillator
    );
  }



  /*
  大勢の声の土台になる
  ノイズ
  */

  const noise =
    audioContext.createBufferSource();


  noise.buffer =
    createNoiseBuffer(
      audioContext,
      duration + 0.6
    );


  const filter =
    audioContext.createBiquadFilter();


  filter.type =
    "bandpass";


  filter.frequency.value =
    1050;


  filter.Q.value =
    0.45;


  const gain =
    audioContext.createGain();


  gain.gain.setValueAtTime(
    0.001,
    startTime
  );


  gain.gain.linearRampToValueAtTime(
    0.040 * strength,
    startTime + 0.15
  );


  gain.gain.exponentialRampToValueAtTime(
    0.001,
    startTime + duration
  );


  noise.connect(
    filter
  );


  filter.connect(
    gain
  );


  gain.connect(
    audienceBus
  );


  noise.start(
    startTime
  );


  noise.stop(
    startTime +
    duration +
    0.25
  );


  activeAudienceNodes.push(
    noise
  );
}



/*
拍手
*/
function createApplause(
  startTime,
  duration = 2.8,
  strength = 1
){

  const clapCount =
    Math.floor(
      58 *
      strength
    );


  for(
    let i = 0;
    i < clapCount;
    i++
  ){

    const source =
      audioContext.createBufferSource();


    source.buffer =
      createNoiseBuffer(
        audioContext,
        0.09
      );


    const bandpass =
      audioContext.createBiquadFilter();


    bandpass.type =
      "bandpass";


    bandpass.frequency.value =
      900 +
      Math.random() * 2400;


    bandpass.Q.value =
      0.7;


    const gain =
      audioContext.createGain();


    const pan =
      audioContext.createStereoPanner
      ? audioContext.createStereoPanner()
      : null;


    const clapTime =
      startTime +
      Math.random() *
      duration;


    const level =
      (
        0.016 +
        Math.random() * 0.035
      )
      *
      strength;


    gain.gain.setValueAtTime(
      0.001,
      clapTime
    );


    gain.gain.linearRampToValueAtTime(
      level,
      clapTime + 0.008
    );


    gain.gain.exponentialRampToValueAtTime(
      0.001,
      clapTime + 0.095
    );


    source.connect(
      bandpass
    );


    bandpass.connect(
      gain
    );


    if(pan){

      pan.pan.value =
        -0.9 +
        Math.random() * 1.8;


      gain.connect(
        pan
      );


      pan.connect(
        audienceBus
      );

    }else{

      gain.connect(
        audienceBus
      );
    }


    source.start(
      clapTime
    );


    source.stop(
      clapTime + 0.11
    );


    activeAudienceNodes.push(
      source
    );
  }
}



/*
動画の長さに合わせて
観客リアクションを自動配置
*/
function scheduleAudience(
  duration
){

  stopAudienceSounds();


  const start =
    audioContext.currentTime +
    0.05;


  /*
  常時の小さなざわめき
  */

  const murmur =
    createAudienceMurmur(
      start
    );


  murmur.gain.gain.setValueAtTime(
    0.017,
    start
  );


  murmur.gain.gain.linearRampToValueAtTime(
    0.027,
    start +
    duration * 0.18
  );


  murmur.gain.gain.linearRampToValueAtTime(
    0.023,
    start +
    duration * 0.47
  );


  murmur.gain.gain.linearRampToValueAtTime(
    0.034,
    start +
    duration * 0.74
  );


  murmur.gain.gain.linearRampToValueAtTime(
    0.020,
    start +
    duration
  );



  /*
  1回目
  小さな反応
  */

  createCrowdCheer(

    start +
    duration * 0.25,

    Math.min(
      1.25,
      duration * 0.10
    ),

    0.48

  );



  /*
  2回目
  中くらい
  */

  createCrowdCheer(

    start +
    duration * 0.52,

    Math.min(
      1.8,
      duration * 0.12
    ),

    0.75

  );



  /*
  後半
  大きな歓声
  */

  createCrowdCheer(

    start +
    duration * 0.76,

    Math.min(
      2.5,
      duration * 0.16
    ),

    1.18

  );



  /*
  大歓声に続く拍手
  */

  createApplause(

    start +
    duration * 0.79,

    Math.min(
      3.2,
      duration * 0.19
    ),

    1.08

  );



  /*
  最後の小さな拍手
  */

  if(duration > 8){

    createApplause(

      start +
      duration * 0.92,

      Math.min(
        1.8,
        duration * 0.08
      ),

      0.55

    );
  }



  /*
  動画終了後に
  ざわめきを停止
  */

  try{

    murmur.source.stop(
      start +
      duration +
      0.25
    );

  }catch(error){
  }
}



/*
動画をクロップしながら
全面に表示
*/
function drawVideoCover(
  targetCtx,
  video,
  width,
  height,
  extraScale = 1
){

  const videoRatio =
    video.videoWidth /
    video.videoHeight;


  const targetRatio =
    width /
    height;


  let sourceX = 0;
  let sourceY = 0;

  let sourceW =
    video.videoWidth;

  let sourceH =
    video.videoHeight;


  if(videoRatio > targetRatio){

    sourceW =
      video.videoHeight *
      targetRatio;


    sourceX =
      (
        video.videoWidth -
        sourceW
      ) / 2;

  }else{

    sourceH =
      video.videoWidth /
      targetRatio;


    sourceY =
      (
        video.videoHeight -
        sourceH
      ) / 2;
  }


  const dw =
    width *
    extraScale;


  const dh =
    height *
    extraScale;


  const dx =
    (width-dw)/2;


  const dy =
    (height-dh)/2;


  targetCtx.drawImage(
    video,

    sourceX,
    sourceY,
    sourceW,
    sourceH,

    dx,
    dy,
    dw,
    dh
  );
}



/*
映画館のスクリーン画像を作る
*/
function renderScreen(
  time
){

  const w =
    screenCanvas.width;


  const h =
    screenCanvas.height;


  screenCtx.clearRect(
    0,
    0,
    w,
    h
  );


  blurCtx.clearRect(
    0,
    0,
    w,
    h
  );


  bloomCtx.clearRect(
    0,
    0,
    w,
    h
  );


  colorCtx.clearRect(
    0,
    0,
    w,
    h
  );



  /*
  強いピンぼけ
  */

  const focusA =
    (
      Math.sin(
        time * 0.38
      ) + 1
    ) / 2;


  const focusB =
    (
      Math.sin(
        time * 0.14 + 2.1
      ) + 1
    ) / 2;


  const blur =
    15 +
    focusA * 9 +
    focusB * 5;



  /*
  スマホの自動露出
  */

  const brightness =
    108 +
    Math.sin(
      time * 0.62
    ) * 8 +
    Math.sin(
      time * 3.7
    ) * 3;



  /*
  ベース映像
  */

  blurCtx.save();


  blurCtx.filter =
    `
    brightness(${brightness}%)
    contrast(79%)
    saturate(64%)
    blur(${blur}px)
    `;


  drawVideoCover(
    blurCtx,
    sourceVideo,
    w,
    h,
    1.06
  );


  blurCtx.restore();



  /*
  Haze
  白い霞
  */

  blurCtx.save();


  const haze =
    blurCtx.createLinearGradient(
      0,
      0,
      w,
      h
    );


  haze.addColorStop(
    0,
    "rgba(210,220,230,0.10)"
  );


  haze.addColorStop(
    0.45,
    "rgba(235,235,225,0.16)"
  );


  haze.addColorStop(
    1,
    "rgba(180,200,215,0.08)"
  );


  blurCtx.fillStyle =
    haze;


  blurCtx.fillRect(
    0,
    0,
    w,
    h
  );


  blurCtx.restore();



  /*
  第一Bloom
  */

  bloomCtx.save();


  bloomCtx.filter =
    "brightness(190%) blur(32px)";


  drawVideoCover(
    bloomCtx,
    sourceVideo,
    w,
    h,
    1.08
  );


  bloomCtx.restore();



  /*
  第二Bloom
  */

  bloomCtx.save();


  bloomCtx.globalAlpha =
    0.55;


  bloomCtx.filter =
    "brightness(260%) blur(62px)";


  drawVideoCover(
    bloomCtx,
    sourceVideo,
    w,
    h,
    1.10
  );


  bloomCtx.restore();



  /*
  ベース
  */

  screenCtx.drawImage(
    blurCanvas,
    0,
    0
  );



  /*
  Bloomを加算
  */

  screenCtx.save();


  screenCtx.globalCompositeOperation =
    "screen";


  screenCtx.globalAlpha =
    0.44;


  screenCtx.drawImage(
    bloomCanvas,
    0,
    0
  );


  screenCtx.restore();



  /*
  色収差
  */

  colorCtx.save();


  colorCtx.globalCompositeOperation =
    "source-over";


  colorCtx.globalAlpha =
    0.11;


  colorCtx.filter =
    "sepia(100%) saturate(500%) hue-rotate(-35deg)";


  colorCtx.drawImage(
    blurCanvas,
    4,
    1
  );


  colorCtx.restore();


  colorCtx.save();


  colorCtx.globalCompositeOperation =
    "screen";


  colorCtx.globalAlpha =
    0.08;


  colorCtx.filter =
    "sepia(100%) saturate(500%) hue-rotate(170deg)";


  colorCtx.drawImage(
    blurCanvas,
    -4,
    -1
  );


  colorCtx.restore();


  screenCtx.save();


  screenCtx.globalCompositeOperation =
    "screen";


  screenCtx.drawImage(
    colorCanvas,
    0,
    0
  );


  screenCtx.restore();



  /*
  白っぽい膜
  */

  screenCtx.save();


  screenCtx.fillStyle =
    "rgba(215,220,215,0.095)";


  screenCtx.fillRect(
    0,
    0,
    w,
    h
  );


  screenCtx.restore();



  /*
  スクリーン端をぼかす
  */

  screenCtx.save();


  screenCtx.globalCompositeOperation =
    "destination-in";


  screenCtx.filter =
    "blur(38px)";


  screenCtx.fillStyle =
    "white";


  screenCtx.fillRect(
    46,
    40,
    w-92,
    h-80
  );


  screenCtx.restore();
}



/*
映画館の一枚を作る
*/
function buildScene(
  time
){

  const w =
    sceneCanvas.width;


  const h =
    sceneCanvas.height;


  sceneCtx.clearRect(
    0,
    0,
    w,
    h
  );


  sceneCtx.fillStyle =
    "rgb(5,6,7)";


  sceneCtx.fillRect(
    0,
    0,
    w,
    h
  );


  renderScreen(
    time
  );



  /*
  スクリーン外へ漏れる光
  */

  const roomGlow =
    sceneCtx.createRadialGradient(

      w*0.52,
      h*0.47,
      w*0.10,

      w*0.52,
      h*0.50,
      w*0.95
    );


  roomGlow.addColorStop(
    0,
    "rgba(135,150,165,0.16)"
  );


  roomGlow.addColorStop(
    0.38,
    "rgba(85,95,105,0.075)"
  );


  roomGlow.addColorStop(
    0.72,
    "rgba(35,40,45,0.035)"
  );


  roomGlow.addColorStop(
    1,
    "rgba(0,0,0,0)"
  );


  sceneCtx.fillStyle =
    roomGlow;


  sceneCtx.fillRect(
    0,
    0,
    w,
    h
  );



  /*
  斜めスクリーン
  */

  sceneCtx.save();


  sceneCtx.translate(
    w*0.51,
    h*0.48
  );


  sceneCtx.rotate(
    -0.048
  );


  sceneCtx.transform(
    1,
    -0.022,
    0.115,
    1,
    0,
    0
  );


  const screenWidth =
    w * 1.46;


  const screenHeight =
    h * 1.18;



  /*
  大きな光の滲み
  */

  sceneCtx.save();


  sceneCtx.globalAlpha =
    0.26;


  sceneCtx.filter =
    "blur(65px) brightness(175%)";


  sceneCtx.drawImage(
    screenCanvas,

    -screenWidth/2,

    -screenHeight/2,

    screenWidth,

    screenHeight
  );


  sceneCtx.restore();



  /*
  メインスクリーン
  */

  sceneCtx.save();


  sceneCtx.filter =
    "blur(7px)";


  sceneCtx.drawImage(
    screenCanvas,

    -screenWidth/2,

    -screenHeight/2,

    screenWidth,

    screenHeight
  );


  sceneCtx.restore();


  sceneCtx.restore();



  /*
  レンズの霞
  */

  sceneCtx.save();


  const lensHaze =
    sceneCtx.createLinearGradient(
      0,
      0,
      w,
      h
    );


  lensHaze.addColorStop(
    0,
    "rgba(160,175,190,0.055)"
  );


  lensHaze.addColorStop(
    0.5,
    "rgba(220,220,205,0.075)"
  );


  lensHaze.addColorStop(
    1,
    "rgba(120,140,160,0.035)"
  );


  sceneCtx.fillStyle =
    lensHaze;


  sceneCtx.fillRect(
    0,
    0,
    w,
    h
  );


  sceneCtx.restore();



  /*
  周辺減光
  */

  const vignette =
    sceneCtx.createRadialGradient(

      w*0.52,
      h*0.47,
      w*0.27,

      w*0.52,
      h*0.50,
      w*0.87
    );


  vignette.addColorStop(
    0,
    "rgba(0,0,0,0)"
  );


  vignette.addColorStop(
    0.68,
    "rgba(0,0,0,0.10)"
  );


  vignette.addColorStop(
    1,
    "rgba(0,0,0,0.76)"
  );


  sceneCtx.fillStyle =
    vignette;


  sceneCtx.fillRect(
    0,
    0,
    w,
    h
  );
}



/*
カメラ全体の手ブレ
*/
function drawCamera(
  time
){

  const w =
    canvas.width;


  const h =
    canvas.height;



  const microX =
    Math.sin(
      time*8.3
    ) * 2.5
    +
    Math.sin(
      time*16.9
    ) * 1.0;


  const microY =
    Math.cos(
      time*7.1
    ) * 2.0
    +
    Math.sin(
      time*13.5
    ) * 0.9;


  const driftX =
    Math.sin(
      time*0.39
    ) * 6.5;


  const driftY =
    Math.cos(
      time*0.28
    ) * 4.2;


  const angle =
    Math.sin(
      time*0.63
    ) * 0.0062
    +
    Math.sin(
      time*2.8
    ) * 0.0018;


  const breathingZoom =
    1.055 +
    Math.sin(
      time*0.24
    ) * 0.008;



  ctx.fillStyle =
    "#000";


  ctx.fillRect(
    0,
    0,
    w,
    h
  );


  ctx.save();


  ctx.translate(

    w/2 +
    microX +
    driftX,

    h/2 +
    microY +
    driftY

  );


  ctx.rotate(
    angle
  );


  ctx.scale(
    breathingZoom,
    breathingZoom
  );


  ctx.drawImage(

    sceneCanvas,

    -w/2,

    -h/2,

    w,

    h

  );


  ctx.restore();
}



processButton.addEventListener(
  "click",
  async function(){

    if(!selectedFile){
      return;
    }


    try{


      if(!window.MediaRecorder){

        throw new Error(
          "MediaRecorderに対応していません"
        );
      }


      if(!canvas.captureStream){

        throw new Error(
          "Canvas captureStreamに対応していません"
        );
      }


      stopAudienceSounds();


      processButton.disabled =
        true;


      sourceVideo.controls =
        false;


      resultArea.style.display =
        "none";


      progressWrap.style.display =
        "block";


      progressBar.style.width =
        "0%";


      progressText.textContent =
        "準備中";


      status.textContent =
        "動画加工と観客音の準備をしています。";


      await prepareAudio();


      sourceVideo.pause();


      sourceVideo.currentTime =
        0;


      await new Promise(
        resolve=>{

          if(
            sourceVideo.readyState >= 1
          ){

            resolve();

          }else{

            sourceVideo.onloadedmetadata =
              resolve;
          }
        }
      );


      const portrait =
        sourceVideo.videoHeight >
        sourceVideo.videoWidth;


      if(portrait){

        canvas.width =
          540;

        canvas.height =
          960;

      }else{

        canvas.width =
          960;

        canvas.height =
          540;
      }


      sceneCanvas.width =
        canvas.width;

      sceneCanvas.height =
        canvas.height;


      screenCanvas.width =
        canvas.width;

      screenCanvas.height =
        canvas.height;


      blurCanvas.width =
        canvas.width;

      blurCanvas.height =
        canvas.height;


      bloomCanvas.width =
        canvas.width;

      bloomCanvas.height =
        canvas.height;


      colorCanvas.width =
        canvas.width;

      colorCanvas.height =
        canvas.height;



      const canvasStream =
        canvas.captureStream(
          30
        );


      const finalStream =
        new MediaStream();


      canvasStream
        .getVideoTracks()
        .forEach(
          track=>
            finalStream.addTrack(
              track
            )
        );


      if(audioDestination){

        audioDestination.stream
          .getAudioTracks()
          .forEach(
            track=>
              finalStream.addTrack(
                track
              )
          );
      }


      const mimeType =
        chooseMimeType();


      const recorder =
        new MediaRecorder(

          finalStream,

          mimeType
          ?{
            mimeType,

            videoBitsPerSecond:
              4500000
          }
          :{
            videoBitsPerSecond:
              4500000
          }
        );


      const chunks =
        [];


      recorder.ondataavailable =
        event=>{

          if(
            event.data &&
            event.data.size>0
          ){

            chunks.push(
              event.data
            );
          }
        };


      recorder.onstop =
        ()=>{


          const actualType =
            recorder.mimeType ||
            mimeType ||
            "video/mp4";


          const blob =
            new Blob(
              chunks,
              {
                type:
                  actualType
              }
            );


          if(outputURL){

            URL.revokeObjectURL(
              outputURL
            );
          }


          outputURL =
            URL.createObjectURL(
              blob
            );


          resultVideo.src =
            outputURL;


          saveButton.href =
            outputURL;


          saveButton.download =
            actualType.includes(
              "mp4"
            )
            ? "movie-leak.mp4"
            : "movie-leak.webm";


          resultArea.style.display =
            "block";


          progressBar.style.width =
            "100%";


          progressText.textContent =
            "完成";


          status.textContent =
            "観客音入りの加工が完了しました。";


          processButton.disabled =
            false;


          sourceVideo.controls =
            true;
        };


      function drawFrame(){

        if(
          sourceVideo.paused ||
          sourceVideo.ended
        ){

          return;
        }


        const t =
          sourceVideo.currentTime;


        buildScene(
          t
        );


        drawCamera(
          t
        );


        if(
          sourceVideo.duration
        ){

          const percent =
            Math.min(
              100,
              Math.round(
                sourceVideo.currentTime /
                sourceVideo.duration *
                100
              )
            );


          progressBar.style.width =
            percent+"%";


          progressText.textContent =
            "加工中 "+percent+"%";
        }


        requestAnimationFrame(
          drawFrame
        );
      }


      sourceVideo.onended =
        ()=>{

          if(
            recorder.state !==
            "inactive"
          ){

            recorder.stop();
          }
        };


      status.textContent =
        "映画館映像と観客のざわめき・歓声・拍手を合成しています。";


      recorder.start(
        500
      );


      await sourceVideo.play();


      /*
      動画再生開始後に
      観客音をスケジュール
      */

      scheduleAudience(
        sourceVideo.duration
      );


      requestAnimationFrame(
        drawFrame
      );


    }catch(error){


      console.error(
        error
      );


      stopAudienceSounds();


      processButton.disabled =
        false;


      sourceVideo.controls =
        true;


      progressText.textContent =
        "エラー";


      status.textContent =
        "エラー：" +
        error.message;
    }
  }
);

</script>
